uce load or range.", "Delayed-onset muscle soreness after a change in training, provided it behaves like soreness and not like injury."]}, {"t": "p", "x": "When you refer, do it cleanly: stop the provocative work, tell the client what you observed (not what you think they ‘have’), recommend the appropriate level of care, offer to help them contact their clinician, and record what happened according to your workplace’s incident and client-note procedures. Never say ‘it is only muscle’ about a red-flag cluster, and never say ‘I think you have a disc herniation / a clot / cauda equina’. Say ‘these signs mean you need to be seen by a doctor today’."}, {"t": "h", "x": "Practise"}, {"t": "p", "x": "Red-flag scenarios (8 minutes): Write two short client scenarios (or ask a training partner to write them for you). For each, decide: continue, modify, refer promptly, or emergency care — and give the reason in one sentence. Then check your answer against the red-flag list. Make one scenario a cauda equina cluster and the other a straightforward mechanical niggle, so you practise both courage and restraint."}]}, {"title": "Goal setting that sticks", "blocks": [{"t": "p", "x": "Good goals connect what the client wants with behaviours they can control. Use the **SMART** framework:"}, {"t": "cards", "hdr": ["Letter", "Meaning", "Example"], "rows": [["S", "Specific: clear and well defined", "“Deadlift with good technique”, rather than “get stronger”"], ["M", "Measurable: you can track it", "“Deadlift 60 kg for 5 reps”"], ["A", "Achievable: realistic for this person", "Based on their starting point and available time"], ["R", "Relevant: matters to the client", "“So I can lift my children and luggage without back pain”"], ["T", "Time-bound: has a deadline or review date", "“Within 12 weeks, reviewed every 4 weeks”"]]}, {"t": "ul", "items": ["**Outcome goals** describe the result (a weight lifted, a race time). **Process goals** describe the behaviours that get there (three sessions a week, 7 hours of sleep). Clients control process goals directly, so include both.", "**Find the deeper “why”**: ask “why does that matter to you?” a couple of times; the answer often keeps clients going when motivation dips.", "**Readiness to change** varies. Some clients are still deciding; others are ready to act. Match your approach: explore and inform with the undecided, plan and support with the ready."]}]}, {"title": "Baseline measures", "blocks": [{"t": "p", "x": "Choose a few measures that relate to the client’s goal and that you can repeat in the same way later. More data is not better if it is irrelevant or uncomfortable for the client."}, {"t": "ul", "items": ["**Resting heart rate** and, where you are trained and permitted, **resting blood pressure**. Refer a client whose readings are high according to your facility’s policy or local guidelines.", "**Movement screen**: posture, squat, hinge, lunge, overhead reach and single-leg stance (Module 7).", "**Performance**: for example a timed walk, push-ups to a set standard, or a comfortable working weight on key lifts.", "**Body measurements** such as body weight or waist circumference, only if they are relevant to the goal and the client is comfortable with them.", "**Subjective measures**: energy, sleep quality, confidence, mood."]}, {"t": "callout", "title": "Be sensitive", "x": "Body measurements can be emotionally loaded. Ask permission, explain why a measure is useful, offer alternatives, and never comment on a client’s body beyond the agreed goal. If a client shows signs of disordered eating, refer sensitively (Module 9).", "kind": "tip"}]}], "takeaways": ["Structure the first session: rapport, goals, screening, history, consent, baseline, next steps.", "Use a PAR-Q style questionnaire; a “yes” usually means medical clearance before progressing.", "Red flags mean stop and refer: emergency care now or prompt medical review.", "Set SMART goals with both outcome and process goals.", "Measure what matters to the goal, repeatably and sensitively."], "quiz": [{"q": "Which of the following requires urgent medical care rather than a stretch or a modified session?", "options": ["Mild delayed-onset muscle soreness two days after a new hinge session", "Low back pain with saddle anaesthesia and new difficulty urinating", "A client who prefers a slightly wider squat stance", "Tightness at the end of an indoor cycling class that eases as the client walks around"], "answer": 1, "explain": "Saddle numbness with new bladder disturbance and back pain are possible cauda equina warning signs: emergency care, not exercise.", "src": "q6.1"}, {"q": "Unexplained night pain, a history of cancer and unplanned weight loss together with back pain should lead you to:", "options": ["Add lumbar extension drills and review again in two weeks", "Increase indoor cycling volume to loosen the back", "Refer the client for medical assessment rather than treating it as simple mechanical back pain", "Continue training as normal, avoiding only the painful movements"], "answer": 2, "explain": "Night pain, a history of cancer and unexplained weight loss are red flags that need medical assessment.", "src": "q6.6"}, {"q": "What is the main purpose of a PAR-Q style questionnaire?", "options": ["To diagnose heart disease before exercise starts", "To decide which exercises a client prefers", "To set the client’s starting training intensity and load", "To identify people who may need medical clearance before starting or increasing exercise"], "answer": 3, "explain": "Screening tools flag people who should get medical advice before exercising, so they can start safely."}, {"q": "A new client ticks “yes” to chest pain during physical activity. What should you do?", "options": ["Pause, explain why, and ask them to get medical clearance before starting the programme", "Start gently and stop the session if the chest pain returns", "Start with a hard session to test them", "Reassure them it is probably anxiety and continue the session"], "answer": 0, "explain": "Chest pain with activity is a clear reason to obtain medical clearance before exercise."}, {"q": "Which goal is SMART?", "options": ["“Get fit”", "“Walk 5 km in under 50 minutes within 10 weeks, training three times a week”", "“Lose some weight before the summer by eating better and training harder”", "“Get fitter and stronger this year by going to the gym more often”"], "answer": 1, "explain": "It is specific, measurable, achievable for many beginners, relevant and time-bound."}, {"q": "“Train three times a week and sleep 7 hours a night” is an example of:", "options": ["An outcome goal", "A medical diagnosis", "A process goal", "A SMART-free goal"], "answer": 2, "explain": "Process goals describe behaviours the client controls directly."}, {"q": "Which question is an open question?", "options": ["“Do you like running?”", "“Have you ever been injured while running or lifting?”", "“Are you motivated to train three times a week?”", "“What has helped you stay active in the past?”"], "answer": 3, "explain": "Open questions invite a fuller answer than yes or no and reveal more useful information."}, {"q": "During a consultation, informed consent means the client:", "options": ["Understands the programme, its benefits and risks, and knows they can ask questions or stop at any time", "Has signed the waiver, which removes any need to discuss risks", "Has agreed to follow the programme exactly as written, without stopping", "Has signed up for a 12-month membership"], "answer": 0, "explain": "Informed consent is about understanding and voluntary agreement, including the right to stop at any time. A signature, a payment or a membership is not consent on its own."}, {"q": "A client reports low back pain with bilateral leg symptoms and difficulty urinating. What do you do, what do you say (and not say), and why?", "type": "sa", "model": "Stop the session. Do not stretch or train. Arrange emergency care (emergency department / emergency services) because this cluster raises concern for cauda equina syndrome. Tell the client, calmly, that these signs mean they need to be seen by a doctor today. Do not say ‘you have cauda equina’ or ‘it is only muscle’. Record the event according to your workplace’s procedures.", "src": "q6.7"}], "num": 6}, {"id": "movement", "title": "Movement Assessment & Exercise Technique", "short": "Movement & technique", "hours": 3, "blurb": "Screen movement like a pro, then coach the six foundational patterns with cues, fixes and smart regressions.", "objectives": ["Run a simple six-station movement-observation screen and record descriptive findings.", "Coach the squat, hinge, lunge, push, pull and carry with clear set-up and cues.", "Recognise common faults and choose a regression or progression.", "Turn an observation into a coaching experiment and re-test."], "lessons": [{"title": "The movement-observation screen", "blocks": [{"t": "p", "x": "The screen below is a coaching observation, not a medical examination and not a licensed movement-assessment certification. It should take about ten minutes. Record what you see, whether the person can change it when cued, and what you will try next. Do not record a diagnosis."}, {"t": "cards", "hdr": ["Station", "What you ask the client to do", "What you are watching", "Examples of descriptive findings"], "rows": [["Standing posture", "Stand naturally, then with feet under the hips, viewed from the side, front and back", "Plumb-line checkpoints from Module 4; obvious left–right differences", "‘Ear sits anterior to the acromion’; ‘right iliac crest appears higher’; ‘ribs sit forward of the pelvis’"], ["Bodyweight squat", "About five squats to a comfortable depth, then two more after a single cue", "Foot tripod, heel contact, knee path, pelvic control, trunk inclination, depth, symmetry, whether a cue changes anything", "‘Heels rise at the bottom’; ‘left knee travels medially’; ‘lumbar flexion in the last third of the descent’; ‘the valgus reduced after a “knees over second toe” cue’"], ["Hinge", "Dowel or light kettlebell RDL, three to five repetitions", "Whether motion is coming from the hips; whether the spine shape stays consistent; how far the implement stays from the legs", "‘Lumbar flexion appears as the bell passes the knee’; ‘knees travel forward so the pattern becomes a squat’"], ["Lunge or split squat", "Three repetitions each side", "Front-knee path, pelvic level, rear-hip extension versus lumbar extension, balance", "‘Front knee collapses medially on the right’; ‘ribs flare as the rear hip tries to extend’"], ["Overhead reach", "Both arms elevate in the scapular plane, empty-handed, then with a light dowel if painless", "Scapular upward rotation, rib position, lumbar strategy, painful arc, left–right difference", "‘Left scapula shrugs without rotating upward’; ‘pain reported between 80° and 110° on the right, eased when range is reduced’"], ["Single-leg stance", "Up to 20–30 seconds each side, near a support", "Pelvic drop, trunk lean, foot strategy, loss of balance", "‘Left pelvis drops within five seconds’; ‘the toes claw to hold position’"]]}, {"t": "p", "x": "Turning a finding into action: pick one finding, choose one experiment (reduce range, slow the tempo, change the stance or implement, add an external cue, or regress the exercise), and re-test. If nothing changes, pick a different experiment. If pain is sharp, radiating, worsening, or associated with any red flag, stop the experiment and follow the referral steps in Module 6."}, {"t": "h", "x": "Practise"}, {"t": "p", "x": "Full screen with a partner (12 minutes): Run the six-station observation on a training partner and write your findings in descriptive language. Choose one finding and one experiment, then re-test. Swap roles if you can."}]}, {"title": "How to teach any exercise", "blocks": [{"t": "ol", "items": ["**Name and demonstrate** the exercise once, from the angle that shows it best.", "**Set up**: feet, grip, posture and breathing, before the first rep.", "**One or two cues** at a time. Clients cannot process five instructions at once.", "**Observe from two angles** (side and front).", "**Give feedback**: one thing that was good, one thing to change.", "**Adjust the exercise, not just the cue**: if the pattern does not clean up, regress it."]}, {"t": "callout", "title": "Regress or progress", "x": "Regress by reducing load, range, speed or complexity, or by adding support. Progress by adding load, range, tempo control, instability or complexity, one variable at a time.", "kind": "tip"}]}, {"title": "The squat", "blocks": [{"t": "ul", "items": ["**Set-up**: feet about hip- to shoulder-width, toes turned out slightly; weight spread across the whole foot (heel, big toe, little toe); brace the trunk.", "**Execution**: hips, knees and ankles bend together; knees track in line with the toes; descend to a depth the client controls; drive up through the whole foot.", "**Prime movers**: quadriceps, gluteus maximus and adductor magnus, with the trunk working isometrically (Module 3)."]}, {"t": "cards", "hdr": ["Common fault", "Try this"], "rows": [["Heels lift", "Reduce depth, try a small heel elevation, or a goblet counterweight"], ["Knees collapse inward (valgus)", "Cue “knees over the second toe”, slow the tempo, reduce depth"], ["Lower back rounds at depth", "Limit depth to the range they control; coach the brace first"], ["Excessive forward lean", "Goblet position or box squat to teach an upright pattern"]]}, {"t": "p", "x": "**Regressions**: box or bench squat, supported squat holding a strap or rail. **Progressions**: goblet squat, tempo or paused squat, then front or back squat."}, {"t": "callout", "title": "Cues that work", "x": "“Sit between your heels.” “Spread the floor.” “Stand up tall and push the floor away.”", "kind": "tip"}]}, {"title": "The hinge", "blocks": [{"t": "ul", "items": ["**Set-up**: feet about hip-width; soft knees; bar or kettlebell close to the legs; brace.", "**Execution**: push the hips back while the spine stays long and the shins stay nearly vertical; lower until the hamstrings are loaded without the back rounding; stand up by driving the hips forward.", "**Prime movers**: gluteus maximus, hamstrings and the hamstring part of adductor magnus, with spinal extensors working isometrically (Module 3)."]}, {"t": "cards", "hdr": ["Common fault", "Try this"], "rows": [["Lower back rounds", "Raise the implement (blocks or a rack) and shorten the range"], ["Knees bend too much, so it becomes a squat", "Dowel along the spine; cue “hips back, shins quiet”"], ["Bar drifts away from the legs", "Cue “drag the bar down your thighs”"], ["Leaning back at the top", "Finish tall with glutes, ribs stacked over the pelvis"]]}, {"t": "p", "x": "**Regressions**: hip hinge with a dowel, glute bridge, kettlebell deadlift from a raised surface. **Progressions**: Romanian deadlift, single-leg RDL, conventional or trap-bar deadlift."}, {"t": "callout", "title": "Cues that work", "x": "“Close the car door with your hips.” “Push the floor away and stand the pelvis up.”", "kind": "tip"}]}, {"title": "The lunge", "blocks": [{"t": "ul", "items": ["**Set-up**: a long enough stance that the front shin stays roughly vertical to slightly forward; hips square; trunk tall.", "**Execution**: lower the back knee towards the floor; front knee tracks over the toes; drive up through the front foot.", "**Key control**: gluteus medius of the front hip keeps the pelvis level and the knee from collapsing (Module 3)."]}, {"t": "cards", "hdr": ["Common fault", "Try this"], "rows": [["Front knee collapses inward", "Static split squat, slower tempo, hand support"], ["Loss of balance", "Widen the stance (“train tracks, not a tightrope”); use support"], ["Ribs flare, lower back arches", "Shorten the stance and brace; check rear-hip extension"]]}, {"t": "p", "x": "**Regressions**: supported split squat, reduced depth, reverse lunge (often easier to control than a forward lunge). **Progressions**: walking lunge, rear-foot-elevated split squat, loaded lunges."}]}, {"title": "The push", "blocks": [{"t": "ul", "items": ["**Horizontal push (push-up, chest press)**: hands slightly wider than the shoulders; a straight line from head to heels; elbows at roughly 30–45° from the body; lower the chest under control; finish with the shoulder blades wrapping around the ribs (“push-up plus”).", "**Vertical push (overhead press)**: ribs down, glutes engaged; press the weight in a straight line overhead and let the shoulder blades rotate upward; avoid arching the lower back to finish.", "**Prime movers**: pectoralis major, anterior deltoid and triceps; serratus anterior and the rotator cuff control the shoulder (Module 3)."]}, {"t": "cards", "hdr": ["Common fault", "Try this"], "rows": [["Hips sag in a push-up", "Incline push-up (hands on a bench) and a plank cue"], ["Elbows flare wide", "Cue “screw your hands into the floor”"], ["Lower back arches overhead", "Half-kneeling or landmine press; reduce load"], ["Shrugging towards the ears", "Cue “reach up and let the shoulder blades turn”"]]}, {"t": "p", "x": "**Regressions**: wall push-up, incline push-up, seated machine press. **Progressions**: full push-up, tempo push-up, dumbbell and barbell presses."}]}, {"title": "The pull", "blocks": [{"t": "ul", "items": ["**Horizontal pull (row)**: brace; pull the elbows back towards the hips; let the shoulder blades move back and slightly down; control the return.", "**Vertical pull (pulldown, pull-up)**: set the shoulder blades first, then pull the elbows down towards the ribs; chest stays tall without arching the lower back.", "**Prime movers**: latissimus dorsi, teres major, posterior deltoid, middle trapezius and rhomboids, with the elbow flexors (Module 3)."]}, {"t": "cards", "hdr": ["Common fault", "Try this"], "rows": [["Head pokes forward", "Cue “long neck, chest proud”"], ["Lower back extends to finish the row", "Chest-supported row; reduce load"], ["Shrugged finish", "Cue “elbows to back pockets”"], ["Using momentum", "Slow the tempo; pause at the end of each rep"]]}, {"t": "p", "x": "**Regressions**: band row, chest-supported row, inverted row with high bar. **Progressions**: single-arm dumbbell row, assisted pull-up, then pull-up."}]}, {"title": "The carry", "blocks": [{"t": "p", "x": "Loaded carries (farmer’s carry, suitcase carry, front-rack carry) train grip, trunk stability and posture while walking. They are among the most functional exercises you can give a client."}, {"t": "ul", "items": ["**Set-up**: pick up the load with a good hinge or squat; stand tall; shoulders down and back but relaxed; brace and breathe.", "**Execution**: walk with short, controlled steps; no leaning or swaying; keep the ribs stacked over the pelvis.", "**Variations**: a suitcase carry (load in one hand) challenges the side of the trunk to resist side-bending."]}, {"t": "cards", "hdr": ["Common fault", "Try this"], "rows": [["Leaning to one side", "Lighter load; cue “stand tall between two walls”"], ["Shrugged shoulders", "Cue “heavy shoulders, long neck”"], ["Breath-holding", "Short breaths behind the brace; reduce distance"]]}, {"t": "callout", "title": "Mobility or stability?", "x": "When a pattern breaks, ask whether the person cannot reach the position (mobility) or cannot control it under load and speed (stability). Module 4 shows how to test which hypothesis is more likely today.", "kind": "tip"}]}], "takeaways": ["Observe first, describe accurately, and never diagnose.", "One finding, one experiment, then re-test.", "Squat, hinge, lunge, push, pull and carry are the foundation of most programmes.", "Set up well, cue one or two things, and observe from two angles.", "If a cue does not fix it, change the exercise: regress, then progress."], "quiz": [{"q": "A knee that collapses medially (valgus) during a squat most immediately points you towards control around which region?", "options": ["The wrist", "The lumbar spine, usually the spinal extensors", "The hip (and the knee it is steering), often including gluteus medius", "The opposite shoulder"], "answer": 2, "explain": "Medial knee collapse in a squat usually points first to control at the hip, where gluteus medius helps steer the femur.", "src": "q6.3"}, {"q": "What is the purpose of the movement-observation screen in this course?", "options": ["To diagnose injuries", "To replace a medical examination", "To certify the client as injury-free before training", "To describe how a person moves and choose a coaching experiment"], "answer": 3, "explain": "The screen is a coaching observation, not a medical examination. You describe, experiment and re-test."}, {"q": "A client’s heels lift at the bottom of a squat. A sensible first experiment is:", "options": ["Reduce depth or use a small heel elevation, then re-test", "Add heavy load", "Tell them they have a pronation problem", "Stop all squatting forever"], "answer": 0, "explain": "Heels rising often points to limited ankle dorsiflexion. A small heel lift or less depth is a valid experiment."}, {"q": "In a hinge, the lower back rounds as the weight passes the knees. What should you try first?", "options": ["Pull harder with the back", "Raise the implement and shorten the range", "Add more weight to “groove” it", "Lock the knees completely"], "answer": 1, "explain": "Raising the implement asks for less hip range, so the client can keep a braced, neutral spine."}, {"q": "Which is a regression of a full push-up?", "options": ["Tempo push-up", "Weighted push-up", "Incline push-up with hands on a bench", "Clap push-up"], "answer": 2, "explain": "Raising the hands reduces the proportion of body weight being pushed."}, {"q": "During a row, a client shrugs at the finish. A good cue is:", "options": ["“Squeeze your ears up”", "“Arch your lower back”", "“Pull with your neck”", "“Elbows to your back pockets”"], "answer": 3, "explain": "Drawing the elbows towards the hips encourages the shoulder blades to move back and slightly down."}, {"q": "Which muscle group is the key frontal-plane controller of the front hip in a lunge?", "options": ["Gluteus medius (and minimus)", "Biceps brachii", "Rectus abdominis", "Tibialis anterior"], "answer": 0, "explain": "Gluteus medius keeps the pelvis level and helps stop the front knee from collapsing."}, {"q": "A suitcase carry (load in one hand) especially challenges the trunk to resist:", "options": ["Flexion of the elbow", "Side-bending (lateral flexion)", "Ankle plantarflexion", "Neck rotation"], "answer": 1, "explain": "An offset load tries to bend the trunk to one side; the trunk must resist lateral flexion."}, {"q": "List four observations you would make during a bodyweight squat screen and, for each, one possible coaching implication. Do not offer a medical diagnosis.", "type": "sa", "model": "Any four descriptive observations with a coaching implication, for example: heels rise — consider ankle dorsiflexion or a temporary heel wedge; knee travels medially — coach hip/foot control and slow the tempo; lumbar flexion at depth — reduce depth and coach the brace; excessive forward lean — consider ankle range or a goblet counterweight; asymmetry — reduce load and look side to side; a cue changes the finding — it is at least partly a control problem. No marks for diagnostic labels.", "src": "q6.8"}], "num": 7}, {"id": "programming", "title": "Programme Design Fundamentals", "short": "Programme design", "hours": 3, "blurb": "Turn goals and assessments into a clear, progressive plan, from the warm-up to week twelve.", "objectives": ["Apply the FITT-VP framework to cardiovascular, resistance and flexibility training.", "Choose appropriate sets, reps, rest and load for a beginner client.", "Structure a session with a warm-up, main block and cool-down.", "Order exercises logically and progress a programme safely.", "Build a sample full-body beginner session."], "lessons": [{"title": "FITT-VP: the programming framework", "blocks": [{"t": "cards", "hdr": ["Letter", "Meaning", "Question to answer"], "rows": [["F", "Frequency", "How many sessions per week?"], ["I", "Intensity", "How hard? (RPE, heart rate, load, reps in reserve)"], ["T", "Time", "How long is each session or bout?"], ["T", "Type", "Which mode or exercises?"], ["V", "Volume", "How much in total? (for example sets × reps, or minutes per week)"], ["P", "Progression", "How and when will it increase?"]]}, {"t": "p", "x": "Start from the client’s goal, screening results, experience, schedule and preferences. A programme the client will actually follow beats a “perfect” programme they abandon."}]}, {"title": "Resistance training variables", "blocks": [{"t": "p", "x": "For novice adults, ACSM guidance suggests training each major muscle group **2–3 days per week**, using roughly **1–3 sets of 8–12 repetitions** at a moderate load. Older or very deconditioned clients may start with lighter loads and 10–15 repetitions."}, {"t": "cards", "hdr": ["Goal emphasis", "Typical reps per set", "Typical rest", "Notes"], "rows": [["Muscular endurance", "12–20+ with lighter loads", "30–60 seconds", "Good for building work capacity and technique"], ["Hypertrophy (muscle size)", "About 6–12, close to (but not necessarily at) failure", "About 1–2 minutes", "Total weekly volume per muscle group matters"], ["Strength", "About 1–6 with heavier loads", "About 2–5 minutes", "Only once technique is consistent"], ["Power", "About 1–5, moved fast", "About 2–5 minutes", "Quality of each rep over fatigue"]]}, {"t": "ul", "items": ["**Load selection**: choose a weight that allows the target reps with good technique and about 1–3 reps in reserve for most beginners.", "**Tempo**: control the lowering phase; beginners benefit from a steady, deliberate pace.", "**Progression rule of thumb**: when a client can complete about two more reps than the target on the final set for two consecutive sessions, increase the load slightly (the “2-for-2” guideline)."]}, {"t": "callout", "title": "Rep ranges overlap", "x": "These ranges are guidelines, not walls. Muscle can grow across a wide range of reps when sets are taken close to effort. Choose ranges that suit the goal, the exercise and the person.", "kind": "tip"}]}, {"title": "Cardio and flexibility prescription", "blocks": [{"t": "h", "x": "Cardiorespiratory training"}, {"t": "ul", "items": ["**Frequency**: most days of the week; at least 3 days.", "**Intensity**: moderate (RPE about 5–6 on 0–10) to vigorous (about 7–8), depending on fitness and goals. Beginners usually start at moderate.", "**Time**: build towards 150–300 minutes of moderate activity per week; bouts of any length count.", "**Type**: rhythmic, large-muscle activity: walking, cycling, rowing, swimming.", "**Intervals**: alternating harder and easier periods can be effective, but introduce them gradually."]}, {"t": "h", "x": "Flexibility training"}, {"t": "ul", "items": ["**Frequency**: at least 2–3 days per week; daily is beneficial.", "**Intensity**: stretch to a feeling of mild tension, never pain.", "**Time**: hold static stretches for about 10–30 seconds, repeated 2–4 times per muscle group.", "**When**: flexibility work is most effective when muscles are warm, for example after a session."]}]}, {"title": "Structure of a session", "blocks": [{"t": "svg", "name": "session", "cap": "A typical session flows from preparation to the hardest work, then back down."}, {"t": "ol", "items": ["**Warm-up (about 5–10 minutes)**: light, general activity to raise heart rate and temperature, then dynamic mobility and movement-specific preparation (for example bodyweight squats and hinges before loaded squats and deadlifts).", "**Main block**: power or highly technical exercises first, while the client is fresh; then multi-joint before single-joint exercises; and larger muscle groups before smaller ones.", "**Conditioning (optional)**: intervals, circuits or steady cardio, depending on the goal.", "**Cool-down (about 5–10 minutes)**: gradually lower intensity, then flexibility work and a short review of the session."]}, {"t": "callout", "title": "Static stretching and the warm-up", "x": "Long static stretches immediately before maximal strength or power work can briefly reduce performance. Prefer dynamic movement in the warm-up, and keep longer static holds for the cool-down or separate sessions.", "kind": "tip"}]}, {"title": "Sample beginner full-body session", "blocks": [{"t": "p", "x": "An example for an apparently healthy beginner who has completed screening and a movement assessment, training 2–3 times per week on non-consecutive days. Adjust every choice to the individual."}, {"t": "cards", "hdr": ["Exercise", "Block", "Sets × reps", "Rest / notes"], "rows": [["5 minutes easy bike or brisk walk, then bodyweight squats, glute bridges, band pull-aparts and arm circles", "Warm-up", "1 round", "Gradually build intensity"], ["Goblet squat (or box squat)", "Main 1", "2–3 × 8–12", "60–90 s; RPE about 6–7"], ["Kettlebell deadlift from a raised surface", "Main 2", "2–3 × 8–12", "60–90 s; focus on the hinge"], ["Incline push-up (or chest press)", "Main 3", "2–3 × 8–12", "60–90 s"], ["Seated cable row or band row", "Main 4", "2–3 × 10–12", "60–90 s"], ["Reverse lunge (supported if needed)", "Main 5", "2 × 8 each side", "60 s"], ["Farmer’s carry", "Main 6", "2–3 × 20–30 m", "60 s; tall posture"], ["Dead bug", "Core", "2 × 6–8 each side", "Slow, with steady breathing"], ["Easy walk, then stretches for hips, hamstrings, chest and calves", "Cool-down", "5–10 minutes", "Hold each stretch for 10–30 s"]]}, {"t": "callout", "title": "Progress gradually", "x": "Over the first weeks, progress one variable at a time: add reps, then a set, then load. Track each session so progression is based on what actually happened.", "kind": "tip"}]}, {"title": "Progression, recovery and review", "blocks": [{"t": "ul", "items": ["**Progress one variable at a time**: reps, sets, load, range, complexity or frequency.", "**Increase total volume gradually**, especially for running and jumping, where rapid jumps in volume are a common route to overuse injuries.", "**Plan recovery**: rest days, sleep, and lighter weeks after several weeks of harder training.", "**Periodisation** simply means organising training into planned phases (for example 4–6-week blocks with a clear emphasis) rather than changing everything at random.", "**Review every 4–6 weeks**: re-test baseline measures, ask how the client feels, and update goals.", "**Keep records**: exercises, sets, reps, loads, RPE and notes for every session."]}]}], "takeaways": ["Use FITT-VP to define frequency, intensity, time, type, volume and progression.", "Novices: 2–3 days per week per muscle group, about 1–3 sets of 8–12 reps.", "Warm-up, main block (complex and multi-joint first), conditioning, cool-down.", "Progress one variable at a time and plan recovery.", "Record every session and review the plan every 4–6 weeks."], "quiz": [{"q": "In FITT-VP, the “V” stands for:", "options": ["Variety", "VO₂max", "Velocity", "Volume"], "answer": 3, "explain": "FITT-VP is Frequency, Intensity, Time, Type, Volume and Progression."}, {"q": "For a novice adult, which resistance-training starting point matches general ACSM guidance?", "options": ["1–3 sets of 8–12 reps, 2–3 days per week per muscle group", "5 sets of 3 reps at maximal load", "10 sets to failure every day", "Cardio only for the first year, then add light resistance work"], "answer": 0, "explain": "This moderate starting point builds technique and strength safely for most beginners."}, {"q": "Which exercise order is most appropriate?", "options": ["Biceps curls before squats", "Power and multi-joint exercises before single-joint exercises", "Single-joint before multi-joint exercises", "The most tiring exercise first, regardless of type"], "answer": 1, "explain": "Complex, multi-joint and power exercises need the most skill and energy, so they come first while the client is fresh."}, {"q": "What is the main purpose of a warm-up?", "options": ["To fatigue the target muscles so the main set feels harder", "To hold long static stretches for each muscle group", "To raise temperature and heart rate and prepare the movements to be trained", "To replace the cool-down"], "answer": 2, "explain": "A warm-up gradually raises temperature and heart rate and rehearses the session’s movements."}, {"q": "A client completes 14 reps on the last set when the target was 12, for two sessions in a row. A sensible next step is:", "options": ["Keep the same load forever", "Stop the exercise", "Double the load", "Increase the load slightly"], "answer": 3, "explain": "This follows the “2-for-2” guideline: when target reps are exceeded by two on the final set in two consecutive sessions, increase load slightly."}, {"q": "Which rest period is most typical for heavy strength sets of about 3–5 reps?", "options": ["About 2–5 minutes", "10 seconds", "10 minutes minimum", "No rest"], "answer": 0, "explain": "Heavier sets need longer rest for the phosphagen system to recover so force output stays high."}, {"q": "How long should static stretches typically be held for general flexibility?", "options": ["1–2 seconds", "About 10–30 seconds", "5 minutes", "Until it hurts"], "answer": 1, "explain": "Holding a stretch for about 10–30 seconds, repeated 2–4 times, is the general recommendation."}, {"q": "Why is long static stretching usually kept out of the warm-up before maximal strength or power work?", "options": ["It always causes injury", "It increases heart rate too much", "It can briefly reduce maximal strength and power performance", "It has no effect on performance at all"], "answer": 2, "explain": "Long static holds can temporarily reduce force and power output; dynamic preparation is preferred before such work."}, {"q": "What does “progress one variable at a time” mean?", "options": ["Change the exercises, sets and load together every session", "Increase only the speed of each repetition, never the load", "Never progress", "Increase one factor, such as reps, sets or load, while keeping others stable"], "answer": 3, "explain": "Changing one thing at a time makes progression safer and lets you see what is working."}, {"q": "How often should a beginner’s programme and baseline measures typically be reviewed?", "options": ["About every 4–6 weeks", "Every session", "Once a year", "Never"], "answer": 0, "explain": "A review every few weeks gives enough time for change and keeps goals and the plan current."}], "num": 8}, {"id": "nutrition", "title": "Nutrition & Lifestyle Within Scope", "short": "Nutrition & lifestyle", "hours": 1.5, "blurb": "Give confident, accurate everyday guidance on food, hydration, sleep and recovery, and know exactly when to refer.", "objectives": ["Explain energy balance and the roles of the macronutrients.", "Give general, guideline-based advice on protein, hydration and healthy eating.", "Describe the lifestyle factors that support training: sleep, stress and daily movement.", "Know the limits of a trainer’s nutrition scope and when to refer to a registered dietitian or doctor."], "lessons": [{"title": "Your nutrition scope", "blocks": [{"t": "p", "x": "Nutrition has a huge effect on results, and clients will ask you about it. What you can say depends on your qualification and local regulations. As a general rule:"}, {"t": "cards", "hdr": ["Trainers can usually", "Trainers should not"], "rows": [["Share general healthy-eating guidance from national or international guidelines", "Prescribe meal plans or diets to treat medical conditions (for example diabetes, kidney disease, food allergies or digestive disease)"], ["Explain energy balance, macronutrients and hydration in general terms", "Diagnose deficiencies or intolerances"], ["Encourage habits: regular meals, vegetables, protein at meals, water", "Recommend high-dose supplements or anything that conflicts with medical advice"], ["Refer to a registered dietitian or doctor", "Work alone with someone showing signs of an eating disorder"]]}, {"t": "callout", "title": "When to refer", "x": "Refer to a registered dietitian or doctor for medical conditions, pregnancy-specific nutrition needs, unexplained weight loss, suspected eating disorders, or any request beyond general guidance.", "kind": "warn"}]}, {"title": "Energy balance and macronutrients", "blocks": [{"t": "p", "x": "**Energy balance** is the relationship between the energy we take in from food and drink and the energy we use (resting metabolism, digesting food, exercise and everyday movement). Over time, a consistent energy deficit leads to weight loss and a consistent surplus to weight gain, although the body’s response is individual and not perfectly predictable."}, {"t": "cards", "hdr": ["Nutrient", "Energy", "Main roles", "Common sources"], "rows": [["Carbohydrate", "About 4 kcal per gram", "The main fuel for moderate- to high-intensity exercise; stored as glycogen", "Whole grains, fruit, vegetables, legumes, rice, potatoes"], ["Protein", "About 4 kcal per gram", "Building and repairing tissues, including muscle; enzymes and hormones", "Meat, fish, eggs, dairy, legumes, tofu"], ["Fat", "About 9 kcal per gram", "Energy for longer, lower-intensity activity; cell membranes; absorbing fat-soluble vitamins", "Olive oil, nuts, seeds, avocado, oily fish"], ["Alcohol (not a nutrient)", "About 7 kcal per gram", "Provides energy but no essential nutrients; can impair recovery and sleep", "—"]]}, {"t": "p", "x": "**Micronutrients** (vitamins and minerals) and **fibre** come mainly from a varied diet rich in vegetables, fruit, whole grains, legumes, nuts and seeds."}]}, {"title": "Protein, hydration and timing", "blocks": [{"t": "ul", "items": ["**Protein**: general guidance for healthy adults is about 0.8 g per kg of body weight per day. Sports-nutrition position stands suggest that people who train regularly may benefit from more, roughly 1.2–2.0 g per kg per day, spread across meals. Anyone with kidney disease or another medical condition should follow their doctor’s or dietitian’s advice.", "**Hydration**: start sessions well hydrated, drink during longer or hot sessions, and rehydrate afterwards. Pale-yellow urine is a simple practical guide. Fluid needs rise in hot environments and with heavy sweating.", "**Around training**: a balanced meal a few hours before, or a light snack closer to the session, suits most people. After training, a meal containing protein and carbohydrate supports recovery. For most general clients, total daily intake matters more than precise timing.", "**Supplements**: in many countries these are not regulated like medicines, and some products contain undeclared or banned substances. Encourage food first, and refer questions about specific supplements to a doctor, pharmacist or dietitian."]}, {"t": "callout", "title": "Heat and hydration", "x": "Training in hot conditions raises the risk of dehydration and heat illness. Schedule outdoor sessions for cooler times, allow acclimatisation, and know the warning signs (Module 10).", "kind": "warn"}]}, {"title": "Lifestyle: sleep, stress and daily movement", "blocks": [{"t": "ul", "items": ["**Sleep**: adults are generally advised to get 7 or more hours per night. Poor sleep affects recovery, mood, appetite and training quality.", "**Stress**: high life stress affects recovery much like hard training does. On stressful weeks, reduce intensity or volume rather than pushing harder.", "**Daily movement**: activity outside the gym, such as walking and taking stairs, contributes a large part of daily energy use. Reducing long periods of sitting has its own health benefits.", "**Habits over perfection**: small, consistent changes (an extra portion of vegetables, a regular bedtime, a daily walk) are more sustainable than drastic overhauls."]}, {"t": "callout", "title": "Coaching habits", "x": "Pick one habit at a time, make it specific (“a 15-minute walk after lunch on workdays”), and track it. Celebrate consistency, not just outcomes.", "kind": "tip"}]}, {"title": "Sensitive topics: body image and disordered eating", "blocks": [{"t": "p", "x": "Some clients struggle with their relationship with food, exercise or body image. Possible warning signs include extreme restriction, rapid weight loss, compulsive exercise despite injury or illness, distress about missing a session, secrecy around eating, or frequent negative talk about their body."}, {"t": "ul", "items": ["Do not diagnose or confront.", "Express concern privately and kindly, focusing on behaviours you have noticed and on their wellbeing.", "Encourage them to speak to a doctor or a qualified mental-health or eating-disorder professional.", "Avoid weight-focused language and comments about appearance."]}]}], "takeaways": ["Stay within scope: general guidance yes, medical nutrition therapy no.", "Carbohydrate and protein provide about 4 kcal/g, fat about 9 kcal/g, alcohol about 7 kcal/g.", "Regular exercisers may benefit from roughly 1.2–2.0 g/kg/day of protein, unless medically advised otherwise.", "Hydrate before, during and after training; take heat seriously.", "Sleep, stress and daily movement shape results; refer sensitively when you see warning signs."], "quiz": [{"q": "How many kilocalories does one gram of fat provide?", "options": ["About 9", "About 7", "About 4", "About 12"], "answer": 0, "explain": "Fat provides about 9 kcal per gram; carbohydrate and protein about 4; alcohol about 7."}, {"q": "Which is within a typical personal trainer’s nutrition scope?", "options": ["Writing a diet to manage a client’s kidney disease", "Sharing general healthy-eating guidance based on national guidelines", "Diagnosing a food intolerance", "Recommending a client stop their prescribed diet"], "answer": 1, "explain": "General, guideline-based advice is within scope; medical nutrition therapy belongs to dietitians and doctors."}, {"q": "Which macronutrient is the main fuel for moderate- to high-intensity exercise?", "options": ["Protein", "Fat", "Carbohydrate", "Alcohol"], "answer": 2, "explain": "Carbohydrate (blood glucose and muscle glycogen) is the main fuel as intensity rises."}, {"q": "Sports-nutrition guidance suggests regular exercisers may benefit from a daily protein intake of roughly:", "options": ["0.1–0.3 g per kg", "Protein is not needed", "5–6 g per kg", "1.2–2.0 g per kg"], "answer": 3, "explain": "Position stands suggest roughly 1.2–2.0 g/kg/day for people who train regularly, unless a medical condition requires otherwise."}, {"q": "A simple practical guide to hydration status is:", "options": ["Pale-yellow urine", "Thirst only after training", "Body weight once a month", "Number of coffees per day"], "answer": 0, "explain": "Pale-yellow urine is a simple practical indicator of adequate hydration for most people."}, {"q": "Adults are generally advised to sleep at least:", "options": ["4 hours", "7 hours", "5 hours", "12 hours"], "answer": 1, "explain": "Adult sleep recommendations are generally 7 or more hours per night."}, {"q": "A client restricts food severely and trains compulsively despite injury. What should you do?", "options": ["Increase their training volume", "Raise it in front of the group so they feel supported", "Express concern privately and encourage them to see a doctor or qualified professional", "Write them a structured meal plan to restore their eating"], "answer": 2, "explain": "Raise concerns kindly and privately and refer; do not diagnose or manage this alone."}, {"q": "Which statement about supplements is most appropriate for a trainer?", "options": ["Recommend high-dose supplements to everyone", "Recommend a protein and creatine stack to every client who wants muscle", "Natural supplements are always safe, so trainers can recommend them freely", "Encourage food first and refer specific supplement questions to a doctor, pharmacist or dietitian"], "answer": 3, "explain": "Supplements may be poorly regulated and can interact with medicines; specific advice belongs to qualified professionals."}], "num": 9}, {"id": "safety", "title": "Safety, Injury Awareness & First Steps", "short": "Safety & first response", "hours": 2, "blurb": "Run a safe training floor, recognise common injuries and emergencies, and know your first steps when something goes wrong.", "objectives": ["Maintain a safe training environment and follow an emergency action plan.", "Recognise common presentations and modify training within scope.", "Identify emergencies, including heat illness, hypoglycaemia and red-flag symptoms, and take the right first steps.", "Apply sensible first steps after a soft-tissue injury and document incidents."], "lessons": [{"title": "A safe training environment", "blocks": [{"t": "ul", "items": ["**Check the space**: clear walkways, enough room around each exercise, non-slip flooring, good lighting and ventilation.", "**Check equipment**: cables, pins, collars, benches and machines in good repair; report and tag anything faulty.", "**Spot correctly**: stand ready, communicate the plan before the set, and know when a lift should be done in a rack with safety arms instead.", "**Know the client**: review screening information before each session and ask how they feel today.", "**Hygiene**: clean equipment and encourage hand hygiene."]}, {"t": "h", "x": "Emergency action plan"}, {"t": "p", "x": "Every facility should have a written emergency action plan. Know where the phone, first-aid kit and AED are; know the address to give emergency services; know who does what; and keep your CPR/AED training current."}]}, {"title": "Common presentations and what to do", "blocks": [{"t": "p", "x": "The table describes patterns trainers often hear about or see. It is not a diagnostic key. Many of these presentations have several possible causes. The trainer’s job is to modify intelligently and to refer when the story is not a simple, settling, load-related niggle."}, {"t": "cards", "hdr": ["Presentation", "How it often shows up", "Where you are likely to see it", "Trainer action (inside scope)"], "rows": [["Non-specific low back pain", "Aches related to sitting, indoor-cycling posture, or loaded hinges; worse with some positions and better with others; no red flags", "Indoor cycling, functional fitness, PT, some Pilates flexion or extension work", "Reduce load and range, coach the hinge and the canister, avoid aggressive end-range flexion or extension into pain. Refer if it is night pain, progressive, or accompanied by neurological or red-flag features."], ["Cuff-related / subacromial shoulder pain (often called ‘impingement’)", "Painful arc, discomfort with reaching or pressing, sometimes night pain on that side", "Yoga (chaturanga, downward dog), Pilates long stretch, wall balls, overhead PT work", "Take away the painful range and the speed. Coach scapular upward rotation and a shorter lever. Persistent, worsening, traumatic or weak shoulders are a referral. Prefer the phrase ‘shoulder pain related to overhead load’ over a diagnosis."], ["Patellofemoral / anterior knee pain", "Pain around or behind the patella on stairs, squats, cycling or wall balls", "Indoor cycling (especially if the saddle is low), lunges and wall balls, Pilates footwork", "Check saddle height and squat depth; reduce deep loaded flexion for a time; coach foot and hip control. Do not promise that ‘strengthening VMO in isolation’ will solve it."], ["Hamstring strain (typically the long head of biceps femoris in high-speed work)", "A sudden pulling sensation during a sprint, swing or fast hinge, sometimes with bruising later", "Sprints and running intervals, PT conditioning, aggressive stretching", "Stop the session for that tissue. A true strain is a clinical matter and a staged return, not an invitation to stretch the tear."], ["Inversion ankle sprain (anterior talofibular ligament most often, then calcaneofibular)", "Rolled ankle, swelling, bruising, tenderness over the lateral ligaments, difficulty bearing weight", "Any session involving change of direction, single-leg work, or stepping awkwardly off a step or platform", "If the person cannot take four steps, or there is marked bony tenderness after trauma, they need medical assessment (possible fracture). Later, once cleared, they need control and proprioception, not only calf stretching."], ["Plantar fasciopathy", "First-step heel or arch pain in the morning, easing then returning after long standing or running", "Running, long days on your feet, some yoga", "Reduce provocative volume, look at calf load and footwear conversations, and refer if the pain is not settling, is getting worse, or began with a sudden ‘pop’ or swelling (possible other pathology)."], ["Lateral elbow pain (often called tennis elbow / lateral epicondylalgia)", "Pain over the lateral elbow with gripping or wrist extension; extensor carpi radialis brevis is frequently discussed", "Grip-heavy PT, farmer’s carries, some Pilates equipment work", "Reduce provocative grip and volume; refer if it is not settling or if there is true weakness or neck-related symptoms."], ["Medial tibial stress syndrome (‘shin splints’) versus bone-stress injury", "Diffuse pain along the medial tibia after running volume increases, versus focal, progressive pain that may disturb sleep", "Running blocks, especially after a sudden increase in volume", "Diffuse, load-related shin discomfort that eases quickly may respond to a volume reduction. Focal, one-point, worsening pain needs medical assessment before more running. Trainers do not distinguish these with certainty — when unsure, refer."], ["Neck pain and headache related to posture or holding position", "Aches after indoor cycling, screen time or Pilates abdominal work in which the head is hung off the neck", "Indoor cycling, mat work, desk-bound PT clients", "Change the head and thorax position; regress abdominal work that the neck is doing. Sudden severe headache, neurological symptoms, or headache after trauma are red flags."]]}]}, {"title": "First steps after a soft-tissue injury", "blocks": [{"t": "p", "x": "If a client tweaks a muscle or rolls an ankle and there are no red flags, your role is to stop the provocative activity, make them comfortable, and advise them on next steps, within your first-aid training."}, {"t": "p", "x": "The **PEACE & LOVE** framework (Dubois and Esculier, British Journal of Sports Medicine) summarises current thinking on soft-tissue injury care:"}, {"t": "h", "x": "Immediately: PEACE"}, {"t": "cards", "hdr": ["Letter", "Meaning"], "rows": [["P — Protect", "Unload or limit movement that hurts for the first 1–3 days"], ["E — Elevate", "Raise the injured area above the heart when possible"], ["A — Avoid anti-inflammatories", "Anti-inflammatory medicines and icing early on may interfere with tissue healing (follow any medical advice)"], ["C — Compress", "Use compression, such as an elastic bandage, to help limit swelling"], ["E — Educate", "Explain that recovery takes time and that passive treatments are not a cure-all"]]}, {"t": "h", "x": "Afterwards: LOVE"}, {"t": "cards", "hdr": ["Letter", "Meaning"], "rows": [["L — Load", "Let pain guide a gradual return to normal activity"], ["O — Optimism", "Confidence and positive expectations support recovery"], ["V — Vascularisation", "Pain-free cardiovascular activity"], ["E — Exercise", "Restore mobility, strength and balance"]]}, {"t": "callout", "title": "Know when it is not a “tweak”", "x": "If the person cannot bear weight (for example cannot take four steps), there is marked bony tenderness after trauma, an obvious deformity, a “pop” with rapid swelling, or the knee gave way after a twist, stop and refer for medical assessment.", "kind": "warn"}]}, {"title": "Emergencies on the gym floor", "blocks": [{"t": "p", "x": "Stop the session and call emergency services (or send the client to an emergency department) for any of these:"}, {"t": "ul", "items": ["Possible cauda equina warning signs: Saddle anaesthesia (numbness in the groin, buttocks or inner thighs), new bladder or bowel disturbance (inability to urinate, incontinence, loss of awareness of the need to go), sexual dysfunction that is new, or bilateral leg symptoms with back pain. This cluster raises concern for cauda equina syndrome.", "Chest pain or systemic collapse: Chest pain, unexplained severe shortness of breath, fainting, sudden unexplained wheeze, or signs that may suggest a blood clot in the lung after a swollen, painful calf.", "Possible stroke or neurological emergency: Sudden severe headache unlike any other, facial droop, limb weakness or speech change, or a seizure.", "Acute trauma: A joint that looks deformed after trauma, an inability to bear weight after a fall or twist, or a suspected fracture or dislocation.", "Possible infection or clot: A hot, rapidly swelling joint with fever (possible infection of the joint) or a calf that is suddenly swollen, red, warm and tender (possible deep-vein thrombosis), especially after travel, surgery or a period of immobility."]}, {"t": "h", "x": "Other emergencies to recognise"}, {"t": "cards", "hdr": ["Situation", "Warning signs", "First steps"], "rows": [["Heat exhaustion", "Heavy sweating, weakness, dizziness, nausea, headache, cramps", "Stop exercise, move to a cool place, loosen clothing, give fluids if alert, and monitor. Seek medical help if symptoms do not improve quickly."], ["Heat stroke (emergency)", "Confusion or unusual behaviour, collapse, very high body temperature; skin may be hot and dry or still sweaty", "Call emergency services. Cool the person rapidly (for example cold-water immersion or cold, wet towels and fanning) while waiting."], ["Low blood sugar (hypoglycaemia)", "Shakiness, sweating, hunger, confusion, irritability, especially in clients with diabetes", "Stop exercise. If they are conscious and can swallow, give fast-acting carbohydrate (for example juice or glucose tablets), following their own plan, then recheck. If they are too drowsy to swallow safely, or unconscious, call emergency services and give nothing by mouth."], ["Exertional rhabdomyolysis", "Severe muscle pain and swelling out of proportion to the session, weakness, dark (cola-coloured) urine, typically after unusually extreme or novel exercise", "Urgent medical assessment. Prevent it by progressing new clients gradually."], ["Asthma attack", "Wheeze, breathlessness, difficulty speaking", "Stop, help them use their own reliever inhaler, keep them calm and upright, and call emergency services if it does not improve or worsens."], ["Collapse / not breathing normally", "Unresponsive, no normal breathing", "Call emergency services, start CPR and use the AED as trained."]]}, {"t": "callout", "title": "Document everything", "x": "After any incident, record what happened, what you observed, what you did and who you contacted, following your facility’s procedures.", "kind": "tip"}]}], "takeaways": ["Check the space and the equipment, and know the emergency action plan and the AED location.", "Common presentations: modify within scope; persistent, worsening or neurological symptoms need referral.", "Emergencies (cauda equina signs, chest pain, stroke signs, heat stroke) need emergency services now.", "PEACE & LOVE guides early soft-tissue care; inability to bear weight or deformity means referral.", "Document every incident clearly."], "quiz": [{"q": "The ligament most commonly injured in a typical inversion ankle sprain is the:", "options": ["Anterior cruciate ligament", "Anterior talofibular ligament", "Deltoid ligament", "Iliolumbar ligament"], "answer": 1, "explain": "The anterior talofibular ligament is the ligament most often injured in an inversion ankle sprain.", "src": "q6.2"}, {"q": "First-step heel or arch pain in the morning is most characteristic of which common presentation?", "options": ["A quadriceps strain", "A biceps tendon rupture", "Plantar fasciopathy", "A medical emergency involving the spinal cord"], "answer": 2, "explain": "First-step heel or arch pain in the morning is the classic pattern of plantar fasciopathy.", "src": "q6.5"}, {"q": "A client becomes confused and collapses during a hot outdoor session. Their skin is very hot. What is the priority?", "options": ["Give them a protein shake", "Encourage them to finish the set", "Let them rest for an hour, then continue", "Call emergency services and begin rapid cooling"], "answer": 3, "explain": "Confusion and collapse in the heat suggest heat stroke, a medical emergency: call for help and cool rapidly."}, {"q": "A client with diabetes becomes shaky, sweaty and irritable mid-session but is alert and can swallow. What should you do first?", "options": ["Stop exercise and give fast-acting carbohydrate according to their plan, then recheck", "Keep training to “burn it off”", "Offer them a drink of water and continue at a lower intensity", "Finish the session early and send them home to rest alone"], "answer": 0, "explain": "These signs suggest low blood sugar. Stop, give fast-acting carbohydrate if they are conscious and can swallow, and monitor."}, {"q": "In PEACE & LOVE, the “L” stands for:", "options": ["Lie down", "Load", "Laser", "Leave it alone"], "answer": 1, "explain": "Load: let pain guide a gradual return to normal activity."}, {"q": "Which situation needs medical assessment rather than ordinary modification?", "options": ["Mild calf soreness two days after a new session", "Slight stiffness that eases during the warm-up", "Inability to take four steps after rolling an ankle", "Preferring a narrower squat stance"], "answer": 2, "explain": "Being unable to bear weight after an ankle injury is a reason for medical assessment (possible fracture)."}, {"q": "Dark, cola-coloured urine with severe muscle pain after an extreme first session may indicate:", "options": ["Normal soreness", "Good training progress", "Dehydration only, so no action is needed", "Exertional rhabdomyolysis, which needs urgent medical assessment"], "answer": 3, "explain": "These signs suggest exertional rhabdomyolysis, which needs urgent medical assessment. Gradual progression for new clients helps prevent it."}, {"q": "What should happen after any incident during a session?", "options": ["Record what happened and what you did, following facility procedures", "Nothing, if the client seems fine", "Mention it to the client next session if they bring it up", "Record it only if the client needed an ambulance"], "answer": 0, "explain": "Clear, factual incident records protect the client, you and the facility."}, {"q": "Explain the difference between modifying a session and referring a client. Give one clear example of each, from your own practice or a realistic scenario.", "type": "sa", "model": "Modifying: you keep the client training by changing load, range, speed, exercise choice or position, because the presentation appears mechanical and straightforward (for example swapping a deep loaded squat for a shallower goblet squat when the knees are sore). Referring: you stop treating the problem as a programming puzzle and hand the client to a clinician or to emergency care (for example night pain with weight loss and a history of cancer, or any red-flag cluster). A complete answer gives a definition and an example of each.", "src": "q6.10"}], "num": 10}], "final": [{"q": "Flexion and extension of the knee occur primarily in the:", "options": ["Frontal plane around a sagittal axis", "Sagittal plane around a frontal (mediolateral) axis", "Transverse plane around a vertical axis", "Frontal plane around a vertical axis"], "answer": 1, "explain": "Knee flexion and extension happen in the sagittal plane, around a frontal (mediolateral) axis.", "src": "final.1"}, {"q": "Which tissue connects muscle to bone and transmits contractile force?", "options": ["Ligament", "Hyaline cartilage", "Tendon", "Epithelium"], "answer": 2, "explain": "Tendons connect muscle to bone and transmit force; ligaments connect bone to bone.", "src": "final.2"}, {"q": "The axial skeleton includes which of the following groups?", "options": ["Femur, tibia and fibula", "Scapula, clavicle and humerus", "Hip bones and the bones of the feet", "Skull, vertebral column, ribs and sternum"], "answer": 3, "explain": "The axial skeleton is the skull, vertebral column, ribs and sternum (plus the hyoid and ossicles).", "src": "final.3"}, {"q": "A typical adult vertebral column has:", "options": ["7 cervical, 12 thoracic and 5 lumbar vertebrae", "5 cervical, 12 thoracic and 7 lumbar vertebrae", "7 cervical, 5 thoracic and 12 lumbar vertebrae", "12 cervical, 7 thoracic and 5 lumbar vertebrae"], "answer": 0, "explain": "A typical adult spine has 7 cervical, 12 thoracic and 5 lumbar vertebrae.", "src": "final.4"}, {"q": "Which synovial type best describes the proximal radioulnar joint?", "options": ["Hinge", "Pivot", "Ball-and-socket", "Plane only"], "answer": 1, "explain": "The proximal radioulnar joint is a pivot joint that allows pronation and supination.", "src": "final.5"}, {"q": "There is no intervertebral disc between:", "options": ["L4 and L5", "T12 and L1", "C1 and C2", "C6 and C7"], "answer": 2, "explain": "There is no disc between the skull and C1, or between C1 and C2.", "src": "final.6"}, {"q": "Psoas major inserts on the:", "options": ["Greater trochanter", "Tibial tuberosity", "AIIS", "Lesser trochanter"], "answer": 3, "explain": "Psoas major joins iliacus as the iliopsoas tendon on the lesser trochanter.", "src": "final.7"}, {"q": "Which description of gluteus medius is correct?", "options": ["It originates on the external ilium and inserts on the greater trochanter; it abducts the hip and controls the pelvis in single-leg stance.", "It originates on the ischial tuberosity, crosses the back of the knee and mainly flexes the knee.", "It lies deep to piriformis and mainly rotates the femur medially during a squat.", "It inserts on the lesser trochanter with psoas major and mainly flexes the hip in a sprint."], "answer": 0, "explain": "Gluteus medius runs from the external ilium to the greater trochanter, abducts the hip and controls the pelvis in single-leg stance.", "src": "final.8"}, {"q": "In an open-chain terminal knee extension, the screw-home mechanism involves:", "options": ["Internal rotation of the tibia on the femur", "External rotation of the tibia on the femur", "Pure abduction of the tibia", "Pronation of the femur"], "answer": 1, "explain": "In open-chain terminal knee extension, the tibia externally rotates on the femur to “lock” the knee.", "src": "final.11"}, {"q": "Soleus is a more isolated plantarflexor when the knee is flexed because:", "options": ["The Achilles tendon only attaches to gastrocnemius", "Soleus crosses the knee and switches off when the knee is straight", "Gastrocnemius also crosses the knee and is placed at a less effective length when the knee flexes", "Tibialis anterior takes over all plantarflexion with the knee bent"], "answer": 2, "explain": "Gastrocnemius crosses the knee, so flexing the knee puts it at a less effective length, leaving soleus to do more of the plantarflexion.", "src": "final.12"}, {"q": "During the descent of a well-organised squat, which statement is most accurate?", "options": ["Gluteus medius is the only muscle working.", "The quadriceps are silent and the iliopsoas does all the work.", "The spinal extensors work concentrically to flex the lumbar spine.", "The quadriceps work eccentrically to control knee flexion."], "answer": 3, "explain": "On the way down, the quadriceps lengthen under load to control knee flexion: eccentric work.", "src": "final.14"}, {"q": "Supraspinatus originates from the:", "options": ["Supraspinous fossa and inserts on the superior facet of the greater tubercle", "Infraspinous fossa and inserts on the lesser tubercle", "Subscapular fossa and inserts on the coracoid", "Lateral clavicle and inserts on the deltoid tuberosity"], "answer": 0, "explain": "Supraspinatus runs from the supraspinous fossa to the superior facet of the greater tubercle.", "src": "final.15"}, {"q": "Infraspinatus and teres minor share which primary glenohumeral action?", "options": ["Internal rotation", "External rotation", "Horizontal adduction", "Scapular upward rotation"], "answer": 1, "explain": "Infraspinatus and teres minor are the cuff’s external rotators.", "src": "final.16"}, {"q": "Lower trapezius contributes to scapular:", "options": ["Elevation and downward rotation only", "Protraction and downward rotation only", "Depression and upward rotation", "Glenohumeral internal rotation"], "answer": 2, "explain": "Lower trapezius depresses the scapula and contributes to upward rotation.", "src": "final.18"}, {"q": "The phrase ‘a lady between two majors’ refers to which insertions around the intertubercular sulcus?", "options": ["Biceps brachii (long head) between brachialis (medial lip) and brachioradialis (lateral lip)", "Deltoid (floor) between pectoralis minor (lateral lip) and coracobrachialis (medial lip)", "Subscapularis between the two heads of biceps", "Latissimus dorsi (floor) between pectoralis major (lateral lip) and teres major (medial lip)"], "answer": 3, "explain": "Pectoralis major (lateral lip) and teres major (medial lip) flank latissimus dorsi on the floor of the sulcus.", "src": "final.19"}, {"q": "Which list correctly names the four parts of the core canister as taught on this course?", "options": ["Diaphragm, transversus abdominis / abdominal wall, multifidus, and the pelvic floor", "Rectus abdominis, biceps femoris, deltoid and masseter", "Upper trapezius, scalenes, platysma and temporalis", "Soleus, popliteus, plantaris and piriformis"], "answer": 0, "explain": "The core canister is the diaphragm (roof), abdominal wall (walls), multifidus (back) and pelvic floor (floor).", "src": "final.21"}, {"q": "Right external oblique acting with left internal oblique will:", "options": ["Rotate the trunk to the right", "Rotate the trunk to the left", "Plantarflex both ankles", "Retract both scapulae"], "answer": 1, "explain": "Opposite-side obliques cooperate: right external oblique with left internal oblique rotates the trunk to the left.", "src": "final.22"}, {"q": "A motor unit grades force together with other motor units by:", "options": ["Changing bone length", "Secretion of synovial fluid", "Recruitment (size principle) and rate coding", "Splitting the muscle into new heads during the set"], "answer": 2, "explain": "Force is graded by recruiting more motor units (size principle) and changing their firing rate (rate coding).", "src": "final.23"}, {"q": "Which line, in Myers’ teaching model, runs from the plantar fascia through the Achilles and hamstrings to the erector spinae and epicranial fascia?", "options": ["Superficial Front Line", "Superficial Front Arm Line", "Deep Front Line", "Superficial Back Line"], "answer": 3, "explain": "The Superficial Back Line runs from the plantar fascia through the Achilles and hamstrings to the erector spinae and scalp.", "src": "final.25"}, {"q": "A client’s heels rise at the bottom of every squat, and a small heel wedge immediately cleans the pattern. The finding most strongly supports:", "options": ["A limitation involving ankle dorsiflexion (mobility, or a temporary bypass of that demand)", "A primary need for heavier load so the client sits deeper into the squat", "A torn ligament at the knee until proven otherwise", "Weak hip flexors that cannot pull the body down into depth"], "answer": 0, "explain": "If a heel wedge instantly cleans the squat, limited ankle dorsiflexion (or a bypass of it) was a big part of the problem.", "src": "final.26"}, {"q": "Loss of ankle dorsiflexion, often with weakened eversion (foot drop), should be treated by a personal trainer as:", "options": ["A cueing problem to be stretched out in assisted stretching", "A neurological warning sign that requires the session to stop and the client to be referred", "A reason to add more running", "Normal delayed-onset muscle soreness"], "answer": 1, "explain": "Foot drop is a neurological warning sign: stop and refer.", "src": "final.27"}, {"q": "Which statement about scope of practice is correct?", "options": ["Completing this course allows a trainer to issue a formal medical diagnosis.", "Trainers may tell a client their imaging shows a disc that can be put back with assisted stretching.", "Trainers describe what they see, modify or stop the work, and refer; they do not name a medical diagnosis to the client.", "Warning signs of serious pathology can wait until the end of a conditioning block if the client is motivated."], "answer": 2, "explain": "Trainers describe, modify or stop, and refer. They do not give a medical diagnosis.", "src": "final.28"}, {"q": "Which of these is outside a personal trainer’s scope of practice?", "options": ["Coaching squat technique", "Modifying load for mild, settling discomfort", "Referring a client to a physiotherapist", "Interpreting an MRI report for a client"], "answer": 3, "explain": "Interpreting imaging belongs to the treating clinician. Trainers coach, modify and refer."}, {"q": "Midway through a landmark check, a client says they would rather you did not touch their hip. What should you do?", "options": ["Stop at once, thank them, and use another method such as self-palpation or visual observation", "Finish quickly, since you have already started", "Explain that palpation is required to complete the assessment", "Carry on but use lighter pressure"], "answer": 0, "explain": "Consent can be withdrawn at any time. Stop immediately and use an alternative, such as asking the client to locate the landmark themselves.", "src": "review"}, {"q": "Which energy system contributes most during a steady 30-minute jog?", "options": ["Phosphagen", "Oxidative (aerobic)", "Glycolytic", "None"], "answer": 1, "explain": "Efforts longer than a few minutes are dominated by the oxidative system."}, {"q": "A client training for a 5 km run spends every session on the leg press and has stopped running. Which principle is being neglected?", "options": ["Reversibility", "Individuality", "Specificity (SAID)", "Recovery"], "answer": 2, "explain": "Specificity (Specific Adaptations to Imposed Demands): to improve at running, the client needs to run. Leg work can support it but cannot replace it.", "src": "review"}, {"q": "Early strength gains in a new lifter are mainly due to:", "options": ["Increased height", "New bones", "Larger hearts", "Neural adaptations"], "answer": 3, "explain": "In the first weeks, improved recruitment and coordination drive most strength gains."}, {"q": "At vigorous intensity, a client using the talk test can:", "options": ["Say only a few words before pausing for breath", "Hold a full conversation without pausing", "Sing a few lines of a song comfortably", "Talk normally without effort"], "answer": 0, "explain": "At vigorous intensity, speech is limited to a few words at a time."}, {"q": "A “yes” answer on a PAR-Q style questionnaire usually means:", "options": ["The client can never take part in exercise again", "Follow-up questions and, often, medical clearance before progressing", "You should train them harder to test it", "Nothing; the form is only a formality for new clients"], "answer": 1, "explain": "Screening flags people who should get medical advice before starting or progressing exercise."}, {"q": "“Lose weight” becomes SMART when rewritten as:", "options": ["“Lose as much weight as possible this year by training hard”", "“Look better soon”", "“Reduce waist circumference by 4 cm in 12 weeks by training 3 times a week and walking daily”", "“Cut out sugar completely and train every day from now on”"], "answer": 2, "explain": "Specific, measurable, achievable, relevant and time-bound, with process behaviours attached."}, {"q": "In a squat, the knees collapsing inward is called:", "options": ["Varus", "Lordosis", "Kyphosis", "Valgus"], "answer": 3, "explain": "Medial knee collapse is described as valgus."}, {"q": "Which is the best first regression for a client who cannot keep a neutral spine in a floor deadlift?", "options": ["Raise the implement onto blocks", "Add more load", "Round the back on purpose", "Lock the knees"], "answer": 0, "explain": "Raising the start position reduces the hip range required, so the spine can stay braced."}, {"q": "During a farmer’s carry, a client’s shoulders creep up towards their ears. Which cue best fits the fault?", "options": ["“Squeeze your ears up”", "“Heavy shoulders, long neck”", "“Lean towards the heavier side”", "“Hold your breath for the whole walk”"], "answer": 1, "explain": "A shrugged carry is an upper-trapezius strategy. “Heavy shoulders, long neck” encourages a depressed, stable scapula.", "src": "review"}, {"q": "In FITT-VP, “I” stands for:", "options": ["Interval", "Isolation", "Intensity", "Injury"], "answer": 2, "explain": "Intensity: how hard the exercise is."}, {"q": "An older, deconditioned beginner is starting resistance training. Which starting point fits general guidance?", "options": ["Heavy sets of 1–3 reps to build strength quickly", "Avoiding resistance training until fitness improves with cardio alone", "Training every muscle group to failure daily", "Lighter loads for about 10–15 reps, progressing gradually"], "answer": 3, "explain": "Older or very deconditioned clients can start with lighter loads and about 10–15 repetitions, then progress gradually.", "src": "review"}, {"q": "Which order of exercises is best?", "options": ["Squats, then curls", "Curls, then squats", "Calf raises, then deadlifts", "Random order"], "answer": 0, "explain": "Multi-joint, larger-muscle exercises come before single-joint, smaller-muscle exercises."}, {"q": "How many kilocalories per gram do carbohydrate and protein each provide?", "options": ["About 7", "About 4", "About 9", "About 2"], "answer": 1, "explain": "Carbohydrate and protein each provide about 4 kcal per gram."}, {"q": "A client with kidney disease asks for a high-protein meal plan. You should:", "options": ["Write a general high-protein plan from national guidelines", "Tell them protein is always safe", "Refer them to their doctor or a registered dietitian", "Recommend a protein shake instead of a full meal plan"], "answer": 2, "explain": "Nutrition for medical conditions is outside a trainer’s scope; refer."}, {"q": "During a hot session a client is sweating heavily, dizzy and nauseous, but alert and talking normally. What are the right first steps?", "options": ["Finish the current set, then rest for five minutes and restart at the same intensity", "Send them to sit alone in the changing room until they feel better, then go home", "Give a caffeinated drink and continue at a lower intensity", "Stop exercise, move them somewhere cool, give fluids and monitor; seek medical help if they do not improve quickly"], "answer": 3, "explain": "These signs fit heat exhaustion. Stop, cool, hydrate and monitor. Confusion, collapse or worsening symptoms suggest heat stroke: call emergency services.", "src": "review"}, {"q": "In PEACE & LOVE, the first “E” in PEACE means:", "options": ["Elevate", "Exercise hard", "Eat more", "Endure pain"], "answer": 0, "explain": "Elevate the injured area above the heart when possible."}], "saPractice": [{"q": "Name the plane and axis of hip abduction, and give one example of a movement that uses that action.", "type": "sa", "model": "Frontal (coronal) plane around a sagittal (anteroposterior) axis. Example: side-lying hip abduction, standing cable abduction, or the frontal-plane control inside a lunge.", "src": "final.29"}, {"q": "List the six synovial joint types and give one living example of each.", "type": "sa", "model": "Hinge — humeroulnar or talocrural (the knee as a modified hinge is acceptable). Pivot — proximal radioulnar or atlanto-axial. Ball-and-socket — glenohumeral or hip. Condyloid/ellipsoid — radiocarpal or MCP joints 2–5. Saddle — first carpometacarpal joint (sternoclavicular acceptable). Plane/gliding — facet joints, AC joint, intercarpal or intertarsal joints, patellofemoral.", "src": "final.30"}, {"q": "Give the origin, insertion and primary actions of rectus femoris, and state why it behaves differently from the vasti in a hip-flexed position such as a deep squat or a high-knee drill.", "type": "sa", "model": "Origin: straight head AIIS; reflected head from the groove above the acetabulum. Insertion: tibial tuberosity via the patellar tendon. Actions: hip flexion and knee extension. Unlike the vasti (which only extend the knee), rectus femoris is shortened at the hip in a deep squat or high-knee position, so it is a less effective knee extensor there (length-tension).", "src": "final.31"}, {"q": "Walk through a Romanian deadlift muscle by muscle: name the prime movers of the descent and of the ascent, the contraction type in each phase, and the role of the spinal extensors.", "type": "sa", "model": "Descent: gluteus maximus, hamstrings (long head of biceps femoris, semitendinosus, semimembranosus) and the hamstring part of adductor magnus work eccentrically as the hips flex; spinal extensors work isometrically to keep the spine from flexing. Ascent: the same hip extensors work concentrically; spinal extensors remain largely isometric. The knees soften but do not dominate.", "src": "final.32"}, {"q": "Give the origin, insertion and primary actions of latissimus dorsi. Then name two other muscles that share its three glenohumeral actions (extension, adduction, internal rotation).", "type": "sa", "model": "Origin: T7–T12 spinous processes, thoracolumbar fascia, iliac crest, lower three or four ribs, inferior angle of the scapula. Insertion: floor of the intertubercular sulcus. Actions: glenohumeral extension, adduction and internal rotation; depression of the shoulder girdle. Two others with the same three GH actions: teres major and the sternocostal fibres of pectoralis major.", "src": "final.33"}, {"q": "Describe classical scapulohumeral rhythm (including the approximate 2:1 idea) and explain one reason a coach should treat it as an average rather than a law.", "type": "sa", "model": "After the early phase of elevation, full overhead motion of about 180 degrees is shared roughly 2:1 between glenohumeral motion (about 120 degrees) and scapulothoracic upward rotation (about 60 degrees). It is an average: the ratio varies with the plane of elevation, the load and the individual, so coaches should watch the actual scapula rather than assume a fixed split.", "src": "final.34"}, {"q": "Compare biceps brachii and brachialis as elbow flexors: origins, insertions and why forearm position changes one more than the other.", "type": "sa", "model": "Biceps: long head from the supraglenoid tubercle, short head from the coracoid; inserts on the radial tuberosity and bicipital aponeurosis; flexes the elbow and supinates the forearm (and assists GH flexion). Brachialis: anterior distal humerus to the ulnar tuberosity and coronoid process; flexes the elbow in every forearm position. Because biceps inserts on the radius, pronation reduces its effectiveness; brachialis inserts on the ulna, so forearm rotation does not change its action.", "src": "final.35"}, {"q": "Outline the Superficial Front Line and the Deep Front Line. Give one class or assisted stretching example for each.", "type": "sa", "model": "SFL: toe extensors and tibialis anterior, then quadriceps / rectus femoris, then rectus abdominis and sternal fascia, then sternocleidomastoid, then scalp (often taught in two pieces meeting at the pelvis). Example: low lunge, post-cycling hip-flexor / anterior-chain assisted stretching, standing out of a flexed bike posture. DFL: long toe flexors and tibialis posterior, then adductors, then pelvic floor and iliopsoas, then diaphragm, then deep front of the neck. Example: canister / breathing work, psoas- and adductor-informed assisted stretching, quiet Pi
