lates stability.", "src": "final.36"}, {"q": "A client’s front knee collapses inward on a walking lunge. Give one mobility hypothesis, one stability/control hypothesis, and the first experiment you would run to test which is more likely today.", "type": "sa", "model": "Mobility hypothesis: the hip lacks a rotation or extension option the lunge is asking for, so the femur collapses inward. Stability hypothesis: gluteus medius and the rest of the lateral hip are not controlling an available range, especially under speed. First experiment: shorten the range and slow the tempo (or add light support). If the collapse disappears, control was the larger issue today; if it remains at a slow, short range, explore hip mobility next.", "src": "final.37"}, {"q": "Name four bony landmarks you would palpate (with consent) when preparing to coach or stretch the shoulder complex, and name one muscle that attaches to or is located by each landmark.", "type": "sa", "model": "Any four correctly paired landmarks, for example: acromion — deltoid or trapezius; spine of the scapula — posterior deltoid or middle/lower trapezius; greater tubercle — supraspinatus, infraspinatus or teres minor; lesser tubercle — subscapularis; coracoid — pectoralis minor, short head of biceps or coracobrachialis; medial border — serratus anterior or rhomboids; inferior angle — latissimus dorsi or teres major; sternum / costal cartilages — pectoralis major.", "src": "final.38"}, {"q": "Write the warning signs of possible cauda equina compression that require emergency care, and write one sentence you would say to the client that stays inside scope.", "type": "sa", "model": "Required signs: saddle anaesthesia; new bladder or bowel disturbance (retention, incontinence, or loss of awareness); new sexual dysfunction; bilateral leg symptoms with back pain (progressive neurological deficit in both limbs also acceptable). Sentence: ‘These signs mean you need to be seen by a doctor in an emergency department today; we are not going to stretch or train this.’ Do not mark yourself correct if your answer diagnoses cauda equina as a certainty or offers to stretch.", "src": "final.39"}, {"q": "Choose one training format (for example Pilates, yoga, indoor cycling, functional fitness, small-group or one-to-one PT, or assisted stretching). Describe one common movement fault you see there, the anatomy underneath it, and the cue or regression you would use.", "type": "sa", "model": "Mark yourself correct when all three parts are present and anatomically sound. Example: indoor cycling — lumbar flexion or neck hanging off a shrugged upper trapezius; anatomy is a lost hip hinge plus an isometric demand on spinal extensors and overuse of upper trapezius; cue a hip hinge so the ribs stack over the pelvis and the shoulders rest quietly on the ribcage, and check saddle height. Other formats are equally acceptable.", "src": "final.40"}]};
</script>

const LKEY='l1pt.license.v1';
const PID_SET=typeof GUMROAD_PRODUCT_ID==='string'&&GUMROAD_PRODUCT_ID.trim()!==''&&!/^REPLACE_/.test(GUMROAD_PRODUCT_ID);
// Test mode: only on a local copy (file:// or localhost) opened with ?paywall-test=1. Keys starting TEST-VALID unlock; TEST-OFFLINE, TEST-REFUNDED and TEST-SERVER simulate failures; any other key is refused. Never active on the live site.
const TEST_MODE=(location.protocol==='file:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))&&/[?&]paywall-test=1(&|$)/.test(location.search);
const SALES_OPEN=TEST_MODE||(PID_SET&&BUY_URL!=='#');
let LIC=loadLic();
function loadLic(){try{const r=JSON.parse(localStorage.getItem(LKEY)||'null');return r&&typeof r.key==='string'&&r.key?r:null}catch(e){return null}}
function saveLic(){try{if(LIC)localStorage.setItem(LKEY,JSON.stringify(LIC));else localStorage.removeItem(LKEY)}catch(e){}}
function paid(){if(!LIC)return false;if(LIC.test)return TEST_MODE;return PID_SET&&LIC.pid===GUMROAD_PRODUCT_ID}
function needsPay(m){return !!m&&m.num>1&&!paid()}
function cleanKey(k){return String(k||'').replace(/\s+/g,'')}
function mockVerify(key){const k=key.toUpperCase();return new Promise(res=>setTimeout(()=>{
 if(k==='TEST-OFFLINE')res({ok:false,reason:'network'});else if(k==='TEST-REFUNDED')res({ok:false,reason:'refunded'});else if(k==='TEST-SERVER')res({ok:false,reason:'server'});
 else if(k.indexOf('TEST-VALID')===0)res({ok:true,purchase:{email:'buyer@example.com'},uses:1});else res({ok:false,reason:'invalid'})},window.__paywallDelay||450))}
async function verifyKey(key,activate){
 if(TEST_MODE)return mockVerify(key);
 if(!PID_SET)return{ok:false,reason:'closed'};
 const ctl=typeof AbortController==='function'?new AbortController():null;const tm=ctl?setTimeout(()=>ctl.abort(),15000):0;
 try{
  const r=await fetch('https://api.gumroad.com/v2/licenses/verify',{method:'POST',body:new URLSearchParams({product_id:GUMROAD_PRODUCT_ID,license_key:key,increment_uses_count:activate?'true':'false'}),signal:ctl?ctl.signal:undefined});
  let j=null;try{j=await r.json()}catch(e){}
  if(j&&j.success===true){const p=j.purchase||{};
   if(p.refunded||p.chargebacked||(p.disputed&&!p.dispute_won))return{ok:false,reason:'refunded'};
   if(p.subscription_ended_at||p.subscription_cancelled_at||p.subscription_failed_at)return{ok:false,reason:'refunded'};
   if(activate&&MAX_DEVICES>0&&j.uses>MAX_DEVICES)return{ok:false,reason:'devices'};
   return{ok:true,purchase:p,uses:j.uses}}
  if(r.status===404||(j&&j.success===false))return{ok:false,reason:'invalid'};
  return{ok:false,reason:'server'}
 }catch(e){return{ok:false,reason:'network'}}finally{if(tm)clearTimeout(tm)}
}

function recheckLicense(){if(!paid()||LIC.test||!PID_SET)return;if(navigator.onLine===false)return;if(Date.now()-(LIC.checked||0)<3*864e5)return;

/* ---------- progress helpers ---------- */
function seenCount(m){return (S.seen[m.id]||[]).filter(i=>i<m.lessons.length).length}
function qbest(m){return S.quiz[m.id]?S.quiz[m.id].best:null}
function passed(m){return qbest(m)!==null&&qbest(m)>=PASS}
function unlocked(m){return MODS.slice(0,m.num-1).every(passed)}
function modPct(m){if(passed(m))return 100;return Math.round(100*(seenCount(m)+(passed(m)?1:0))/(m.lessons.length+1))}
function status(m){if(passed(m))return['ok','Passed '+qbest(m)+'%'];if(needsPay(m))return['lock','Full course'];if(!unlocked(m))return['lock','Locked'];if(seenCount(m)||S.quiz[m.id])return['prog','In progress'];return['','Not started']}
function allPassed(){return MODS.every(passed)}
function eligible(){return allPassed()&&paid()}
function overall(){return Math.round(MODS.map(modPct).reduce((a,b)=>a+b,0)/MODS.length)}
function unlocksTxt(nm){return nm?(needsPay(nm)?'':` and unlock Module ${nm.num}`):' and unlock your certificate'}
function nextStep(){for(const m of MODS){if(!passed(m)){if(needsPay(m))return{href:'#/unlock',label:'Unlock the full course'};const s=S.seen[m.id]||[];for(let i=0;i<m.lessons.length;i++){if(!s.includes(i))return{href:`#/m/${m.id}/l/${i}`,label:(s.length||S.quiz[m.id])?`Continue: Module ${m.num}`:`Start Module ${m.num}`}}return{href:`#/m/${m.id}/quiz`,label:`Take the Module ${m.num} test`}}}return{href:'#/certificate',label:'View your certificate'}}

function block(b){
 switch(b.t){
  case 'p':return `<p>${md(b.x)}</p>`;
  case 'h':return `<h3 class="sub">${md(b.x)}</h3>`;
  case 'ul':return `<ul class="clean">${b.items.map(i=>`<li>${fmtItem(i)}</li>`).join('')}</ul>`;
  case 'ol':return `<ol class="clean">${b.items.map(i=>`<li>${fmtItem(i)}</li>`).join('')}</ol>`;
  case 'callout':return `<div class="callout ${b.kind||''}"><b class="ct">${md(b.title)}</b><p>${md(b.x)}</p></div>`;
  case 'svg':return `<figure class="fig">${SVGS[b.name]()}${b.cap?`<figcaption>${md(b.cap)}</figcaption>`:''}</figure>`;
  case 'cards':return `<div class="cards">${b.rows.map(r=>`<div class="tcard"><div class="th"><span class="hlabel">${md(b.hdr[0])}</span><h4>${md(r[0])}</h4></div><dl>${r.slice(1).map((c,i)=>c&&c!=='—'?`<dt>${md(b.hdr[i+1]||'')}</dt><dd>${md(c)}</dd>`:'').join('')}</dl></div>`).join('')}</div>`;
 }
 return '';
}
function fmtItem(s){ // bold a leading "Label:" if not already bold
 if(s.indexOf('**')>=0) return md(s);
 const m=s.match(/^([^:.]{2,48}):\s(.+)$/);
 return m?`<strong>${esc(m[1])}:</strong> ${md(m[2])}`:md(s);
}

 <p class="pw-status${SALES_OPEN?'':' info'}" id="pwStatus" role="status" aria-live="polite">${SALES_OPEN?'':`${I('info')}<span>Key entry opens when the course goes on sale.</span>`}</p></form></div>
 <div class="notice" style="margin-bottom:18px">${I('shield')}<div><b>Good to know</b><p>Your key is saved on this device, so the course stays unlocked even when you are offline. On a new phone or computer, enter the same key again. Your progress is saved separately on each device.</p></div></div>
 <div class="btn-row">${m1done?`<a class="btn ghost" href="#/m/${m1.id}">Review Module 1</a>`:`<a class="btn ghost" href="${nextStep().href}">${esc(nextStep().label.replace('Start Module 1','Start Module 1 for free'))}</a>`}<a class="btn ghost" href="#/modules">All modules</a></div></div>`;
}
function money(s){const n=parseFloat(String(s||'').replace(/[^0-9.]/g,''));return isNaN(n)?0:n}
function pwSet(cls,html){const s=document.getElementById('pwStatus');if(s){s.className='pw-status '+cls;s.innerHTML=html}}
let PW_BUSY=false;
async function doUnlock(){
 if(PW_BUSY)return;const inp=document.getElementById('pwInput'),btn=document.getElementById('pwSubmit');if(!inp)return;
 if(!SALES_OPEN){pwSet('info',`${I('info')}<span>${PW_MSG.closed}</span>`);return}
 const key=cleanKey(inp.value);inp.classList.remove('bad');
 if(!key){inp.classList.add('bad');pwSet('err',`${I('alert')}<span>${PW_MSG.empty}</span>`);inp.focus();return}
 PW_BUSY=true;inp.disabled=true;btn.disabled=true;btn.innerHTML='<span class="spin" aria-hidden="true"></span>Checking…';
 pwSet('busy','<span class="spin" aria-hidden="true"></span><span>Checking your key with Gumroad…</span>');
 const r=await verifyKey(key,true);PW_BUSY=false;
 if(r.ok){LIC={key,pid:TEST_MODE?'test':GUMROAD_PRODUCT_ID,test:TEST_MODE||undefined,email:(r.purchase&&r.purchase.email)||'',activated:Date.now(),checked:Date.now()};saveLic();
  pwSet('ok',`${I('check')}<span>Key accepted. The full course is unlocked.</span>`);btn.innerHTML=`${I('check')}Unlocked`;setTimeout(()=>{render();window.scrollTo(0,0)},900);return}
 inp.disabled=false;btn.disabled=false;btn.innerHTML=`${I('lock')}Unlock`;
 if(r.reason==='invalid'||r.reason==='refunded'||r.reason==='devices')inp.classList.add('bad');
 pwSet('err',`${I('alert')}<span>${PW_MSG[r.reason]||PW_MSG.server}</span>`);inp.focus();
}
function notFound(){return `<div class="wrap content"><h1>Page not found</h1><a class="btn" href="#/">Go home</a></div>`}

/* ---------- router ---------- */
function render(){
 const h=location.hash.replace(/^#\/?/,'');const p=h.split('/');
 let html='';
 if(Q&&p[0]!=='run'){Q=null;stopTimer()}
 if(Q&&!Q.done&&p[0]==='run'){html=quizView()}
 else if(Q&&Q.done&&p[0]==='run'){html=resultView()}
 else if(!h)html=home();
 else if(p[0]==='modules')html=`<div class="content"></div>`+modulesSection();
 else if(p[0]==='unlock')html=paywallPage(null);
 else if(p[0]==='m'){const m=byId(p[1]);if(!m)html=notFound();else if(needsPay(m))html=paywallPage({m});else if(!unlocked(m))html=lockedPage(m);else if(p[2]==='practice')html=msaIntro(m);else if(!p[2])html=modulePage(m);else if(p[2]==='l')html=lessonPage(m,parseInt(p[3],10));else if(p[2]==='recap')html=recapPage(m);else if(p[2]==='quiz')html=quizIntro(m);else html=notFound()}
 else if(p[0]==='final')html=paid()?finalIntro():paywallPage({label:'The practice final'});
 else if(p[0]==='written')html=paid()?writtenIntro():paywallPage({label:'The short-answer practice'});
 else if(p[0]==='about')html=aboutPage();
 else if(p[0]==='live')html=livePage();
 else if(p[0]==='certificate')html=paid()?certPage():paywallPage({label:'Your certificate of completion'});
 else if(p[0]==='run')html=notFound();
 else html=notFound();
 $app.innerHTML=`<main class="${ENTER?'enter':''}">${html}</main>`;ENTER=false;
 $app.querySelectorAll('.callout b.ct').forEach(b=>{if(b.querySelector('svg'))return;const c=b.parentNode.classList;b.insertAdjacentHTML('afterbegin',I(c.contains('lock')?'lock':c.contains('warn')?'alert':c.contains('cue')?'info':c.contains('tip')?'bulb':'star'))});
 if(Q&&Q.opts.timed&&!Q.done&&p[0]==='run')tick();
 const nu=document.getElementById('navUnlock');if(nu)nu.textContent=paid()?'Your course access':'Unlock the full course';
 closeMenu();
}
function go(hash){if(location.hash===hash)render();else location.hash=hash}
let ENTER=true;
window.addEventListener('hashchange',()=>{ENTER=true;render();window.scrollTo(0,0)});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-start]');if(!t)return;
 if(t.id==='menuBtn'){const d=document.getElementById('drawer');const o=!d.classList.contains('open');d.classList.toggle('open',o);t.setAttribute('aria-expanded',o);return}
 if(t.id==='resetBtn'||t.hasAttribute('data-reset')){if(confirm('Reset all progress, test scores and your certificate? This cannot be undone.')){S={seen:{},quiz:{},final:null,written:null,name:'',completedOn:null};save();Q=null;stopTimer();go('#/')}return}
 if(t.dataset.start){const k=t.dataset.start;
  if(k==='mod'){const m=byId(t.dataset.id);if(!m||needsPay(m)||!unlocked(m))return;Q=newRun('mod',mcq(m),{id:m.id,title:`Module ${m.num} test`,instant:true})}
  if(k==='msa'){const m=byId(t.dataset.id);if(!m||needsPay(m)||!unlocked(m))return;Q=newRun('msa',saq(m),{id:m.id,title:`Module ${m.num} short-answer practice`,instant:true})}
  if((k==='final'||k==='written')&&!paid())return;
  if(k==='final'){const timed=document.getElementById('optTimer').checked,inst=document.getElementById('optInstant').checked;Q=newRun('final',shuffle(DATA.final),{title:'Practice final',timed,instant:inst});if(timed)startTimer()}
  if(k==='written'){Q=newRun('written',DATA.saPractice,{title:'Short-answer practice',instant:true})}
  go('#/run');window.scrollTo(0,0);return}
 if(!Q)return;
 if(t.dataset.opt!==undefined&&!t.disabled){const oi=+t.dataset.opt;const q=Q.qs[Q.i];Q.ans[Q.i]=oi;Q.marks[Q.i]=oi===q.answer?1:0;render();if(Q.opts.instant!==false){const fb=document.querySelector('.fb');if(fb)fb.scrollIntoView({block:'nearest',behavior:'smooth'})}return}
 if(t.hasAttribute('data-reveal')){const ta=document.getElementById('sa');Q.ans[Q.i]=ta?ta.value:'';Q.revealed=true;render();return}
 if(t.dataset.mark!==undefined){const ta=document.getElementById('sa');if(ta)Q.ans[Q.i]=ta.value;Q.marks[Q.i]=parseFloat(t.dataset.mark);render();return}
 if(t.hasAttribute('data-next')){if(Q.i<Q.qs.length-1){Q.i++;Q.revealed=false;render();window.scrollTo(0,0)}else finishRun();return}
 if(t.hasAttribute('data-prev')){if(Q.i>0){Q.i--;render();window.scrollTo(0,0)}return}
 if(t.hasAttribute('data-quit')){if(confirm('Leave this attempt? Your answers will not be saved.')){const back=Q.kind==='mod'?`#/m/${Q.opts.id}/quiz`:Q.kind==='msa'?`#/m/${Q.opts.id}/practice`:(Q.kind==='final'?'#/final':'#/written');Q=null;stopTimer();go(back)}return}
 if(t.hasAttribute('data-retake')){const k=Q.kind;const id=Q.opts.id;Q=null;go(k==='mod'?`#/m/${id}/quiz`:k==='msa'?`#/m/${id}/practice`:(k==='final'?'#/final':'#/written'));return}
});
document.addEventListener('click',e=>{if(e.target.closest('[data-print]'))window.print();const bk=e.target.closest('[data-book]');if(bk&&BOOKING_URL==='#'){e.preventDefault();const n=bk.parentNode.querySelector('[data-book-note]');if(n){n.classList.remove('pulse');void n.offsetWidth;n.classList.add('pulse')}}});
document.addEventListener('submit',e=>{if(e.target.id==='pwForm'){e.preventDefault();doUnlock()}});
document.addEventListener('input',e=>{if(e.target.id==='pwInput'&&e.target.classList.contains('bad')){e.target.classList.remove('bad');pwSet('','')}});
document.addEventListener('input',e=>{if(e.target.id==='nm'){S.name=e.target.value.slice(0,60);save();const c=document.getElementById('certName');if(c)c.textContent=S.name||'Your name'}});
function closeMenu(){const d=document.getElementById('drawer');d.classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false')}
document.getElementById('drawer').addEventListener('click',e=>{if(e.target.tagName==='A')closeMenu()});
if(location.hash.indexOf('#/run')===0)location.hash='#/';
render();
recheckLicense();
window.__L1={DATA,state:()=>S,license:()=>LIC,paid:()=>paid(),testMode:TEST_MODE};
if(TEST_MODE){window.__L1.testUnlock=()=>{LIC={key:'TEST-VALID',pid:'test',test:true,activated:Date.now(),checked:Date.now()};saveLic();render()};window.__L1.testLock=()=>{LIC=null;saveLic();render()}}
})();
</script>
</body>
</html>
