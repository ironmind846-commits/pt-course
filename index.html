eus maximus, the hamstrings and the hamstring part of adductor magnus.)"}]}, {"title": "The shoulder complex", "blocks": [{"t": "p", "x": "Four articulations share the work of moving the arm: the sternoclavicular (SC) joint, the only true bony joint between the upper limb and the axial skeleton; the acromioclavicular (AC) joint; the glenohumeral (GH) joint, a shallow ball-and-socket joint deepened slightly by the glenoid labrum; and the scapulothoracic (ST) interface, which is not a synovial joint but a fascial and muscular gliding surface between scapula and ribcage."}, {"t": "p", "x": "Classical scapulohumeral rhythm (taught as a useful average, not a rigid law) says that after the early phase of elevation, full overhead motion of about 180° is shared roughly 2:1 between glenohumeral and scapulothoracic motion — about 120° of GH elevation and about 60° of scapular upward rotation. Real shoulders vary with plane of elevation, load and the individual. What matters for coaching is this: if the scapula does not upwardly rotate, posteriorly tilt and slightly externally rotate as the arm goes overhead, the greater tubercle and the coracoacromial arch run out of room, and clients often report pinching in the so-called ‘painful arc’ (commonly around 60–120° of abduction)."}]}, {"title": "Rotator cuff and deltoid", "blocks": [{"t": "cards", "hdr": ["Muscle", "Origin", "Insertion", "Primary actions"], "rows": [["Supraspinatus", "Supraspinous fossa of the scapula", "Superior facet of the greater tubercle of the humerus", "Initiates glenohumeral abduction and compresses the humeral head into the glenoid (a stabilising role throughout elevation)"], ["Infraspinatus", "Infraspinous fossa of the scapula", "Middle facet of the greater tubercle", "Glenohumeral external rotation; helps centre the humeral head"], ["Teres minor", "Upper part of the lateral border of the scapula", "Inferior facet of the greater tubercle", "Glenohumeral external rotation and adduction; helps centre the humeral head"], ["Subscapularis", "Subscapular fossa (anterior surface of the scapula)", "Lesser tubercle of the humerus", "Glenohumeral internal rotation; the only cuff muscle inserting on the lesser tubercle"], ["Anterior deltoid", "Lateral third of the clavicle", "Deltoid tuberosity of the humerus", "Glenohumeral flexion, internal rotation and horizontal adduction"], ["Middle deltoid", "Acromion", "Deltoid tuberosity", "Glenohumeral abduction"], ["Posterior deltoid", "Spine of the scapula", "Deltoid tuberosity", "Glenohumeral extension, external rotation and horizontal abduction"]]}, {"t": "p", "x": "A useful teaching image: the deltoid wants to pull the humeral head upward; the cuff (especially the inferior force of subscapularis, infraspinatus and teres minor, with supraspinatus compressing the head into the glenoid) keeps the ball centred. That is why ‘just raise the arm’ is not a complete overhead strategy, and why cuff-related shoulder pain is so common when load outruns control."}]}, {"title": "Axioscapular and axiohumeral muscles", "blocks": [{"t": "cards", "hdr": ["Muscle", "Origin", "Insertion", "Primary actions"], "rows": [["Pectoralis major", "Clavicular head: medial half of the clavicle. Sternocostal head: sternum, costal cartilages 1–6 and the aponeurosis of external oblique", "Lateral lip of the intertubercular (bicipital) sulcus", "Adduction, internal rotation and horizontal adduction of the humerus. Clavicular fibres flex the GH joint; sternocostal fibres extend it from a flexed position (for example, the pulling phase of a dumbbell pullover)"], ["Pectoralis minor", "Ribs 3–5 near their costal cartilages", "Coracoid process of the scapula", "Protracts, depresses and downwardly rotates the scapula; can elevate the ribs if the scapula is fixed"], ["Latissimus dorsi", "Spinous processes of T7–T12, thoracolumbar fascia, iliac crest, lower three or four ribs, and the inferior angle of the scapula", "Floor of the intertubercular sulcus", "Glenohumeral extension, adduction and internal rotation; depresses the shoulder girdle. A powerful ‘pull the arm to the pelvis’ muscle"], ["Teres major", "Posterior surface of the inferior angle of the scapula", "Medial lip of the intertubercular sulcus", "Glenohumeral extension, adduction and internal rotation — ‘lat’s little helper’"], ["Serratus anterior", "External surfaces of ribs 1–8 (sometimes described as 1–9)", "Anterior (costal) surface of the medial border of the scapula", "Protracts the scapula, upwardly rotates it, and holds it against the thoracic wall. Marked winging of the medial border suggests poor serratus function (and, if sudden or severe, a reason to refer)"], ["Upper trapezius", "External occipital protuberance, medial superior nuchal line, ligamentum nuchae and the C7 spinous process", "Lateral third of the clavicle and the acromion", "Elevates and upwardly rotates the scapula. Acting on the neck, both sides extend it; one side laterally flexes it to the same side and rotates it to the opposite side"], ["Middle trapezius", "Spinous processes of T1–T5", "Acromion and spine of the scapula", "Retracts the scapula"], ["Lower trapezius", "Spinous processes of T6–T12", "Medial end (root/apex) of the spine of the scapula", "Depresses and upwardly rotates the scapula"], ["Rhomboid major", "Spinous processes of T2–T5", "Medial border of the scapula from the spine to the inferior angle", "Retracts, elevates and downwardly rotates the scapula"], ["Rhomboid minor", "Ligamentum nuchae and spinous processes of C7–T1", "Medial border of the scapula at the root of the spine", "Retracts, elevates and downwardly rotates the scapula"], ["Levator scapulae", "Transverse processes of C1–C4", "Superior angle and upper medial border of the scapula", "Elevates and downwardly rotates the scapula; ipsilateral cervical side-bend and rotation"]]}, {"t": "p", "x": "Upward-rotation force couple. Upper trapezius, lower trapezius and serratus anterior turn the scapula so that the glenoid faces up as the arm elevates. Rhomboids, levator scapulae and pectoralis minor contribute to downward rotation (for example during the pull of a pull-up, or when the arms are lowered from overhead). A shrugged, ear-chasing overhead position is usually too much upper trapezius and too little upward rotation from serratus and lower trapezius — a coaching problem you can see in wall balls, yoga sun salutations and poorly set indoor-bike handlebar leans."}, {"t": "p", "x": "Memory aid for the walls of the intertubercular sulcus: pectoralis major inserts on the lateral lip, teres major on the medial lip, and latissimus dorsi on the floor — ‘a lady between two majors’."}]}, {"title": "The elbow and radioulnar joints", "blocks": [{"t": "p", "x": "The humeroulnar joint is a hinge (flexion and extension). The humeroradial joint moves with it. The proximal and distal radioulnar joints are pivots that allow pronation and supination: the radius rotates around a relatively fixed ulna."}, {"t": "cards", "hdr": ["Muscle", "Origin", "Insertion", "Primary actions"], "rows": [["Biceps brachii", "Long head: supraglenoid tubercle (and glenoid labrum). Short head: coracoid process", "Radial tuberosity and the bicipital aponeurosis", "Elbow flexion, forearm supination, and assistance with glenohumeral flexion. It is a weak flexor when the forearm is fully pronated"], ["Brachialis", "Anterior distal half of the humerus", "Ulnar tuberosity and coronoid process of the ulna", "Elbow flexion in every forearm position — the workhorse flexor, because it attaches to the ulna and is unaffected by pronation or supination"], ["Brachioradialis", "Proximal two-thirds of the lateral supracondylar ridge of the humerus", "Lateral surface of the radial styloid process", "Elbow flexion, strongest in mid-pronation (the ‘beer-glass’ or handshake position)"], ["Triceps brachii", "Long head: infraglenoid tubercle. Lateral head: posterior humerus above the radial (spiral) groove. Medial head: posterior humerus below the radial groove", "Olecranon of the ulna", "Elbow extension. The long head also extends and adducts the glenohumeral joint. The medial head is the workhorse extensor"]]}]}, {"title": "Push and pull — muscle by muscle", "blocks": [{"t": "h", "x": "Horizontal push (push-up, bench press, chest press)"}, {"t": "ul", "items": ["Prime movers: Pectoralis major, anterior deltoid and triceps brachii work concentrically as the elbows extend and the humerus horizontally adducts (the exact contribution shifts with hand width and elbow path).", "Scapula and trunk: Serratus anterior protracts the scapula at the end of a full push-up (‘push-up plus’); the cuff centres the humeral head; the canister keeps the ribs from dumping towards the floor.", "Eccentric phase: The same muscles accept the load as the body or the bar is lowered."]}, {"t": "h", "x": "Vertical push (overhead press, wall ball)"}, {"t": "ul", "items": ["Prime movers: Anterior and middle deltoid, triceps, and the clavicular fibres of pectoralis major, with the upward-rotation force couple aiming the glenoid (upper trapezius, lower trapezius, serratus anterior) and the cuff centring the ball.", "Common leak: Rib flare and lumbar extension to ‘finish’ the press; shrugged scapulae without upward rotation; a painful arc. Regress range, reduce load, or move to a landmine or half-kneeling press before you add speed (wall balls)."]}, {"t": "h", "x": "Horizontal pull (row, Pilates reformer rowing, seated or standing band row)"}, {"t": "ul", "items": ["Prime movers: Latissimus dorsi, teres major, posterior deltoid, middle trapezius and rhomboids, with biceps brachii and brachialis flexing the elbow. The cuff still centres the humeral head.", "Scapula: Scapulae should retract and slightly depress without thrusting the head forward or extending the lumbar spine to finish the pull. Do not cue a violent squeeze that downwardly rotates the scapula into a shrugged, neck-short position."]}, {"t": "h", "x": "Vertical pull (pulldown, pull-up, some ski-erg mechanics)"}, {"t": "ul", "items": ["Prime movers: Latissimus dorsi and teres major, assisted by the posterior deltoid, the biceps group, and scapular downward rotators and depressors (rhomboids, pectoralis minor, lower trapezius as a depressor) depending on the phase. At the start of a pull-up the scapula must first set (often a slight depression and downward rotation) before the elbows can do useful work."]}]}, {"title": "Practice drills", "blocks": [{"t": "p", "x": "Work through these drills with a training partner where one is needed. On your own, use a mirror or film yourself. Times are guides only."}, {"t": "h", "x": "Bones and joints"}, {"t": "ol", "items": ["Landmark hunt (10 minutes): Using the list above, partners find C7, the spine and inferior angle of the scapula, the iliac crest, ASIS, PSIS, greater trochanter, fibular head, both malleoli, the acromion, the olecranon and the sternal angle if they can. Get clear consent first, and offer a same-gender partner where that is preferred.", "Living joint catalogue (5 minutes): A partner calls a synovial type; pairs demonstrate a common gym exercise that uses a joint of that type and name the joint."]}, {"t": "h", "x": "Lower body"}, {"t": "ol", "items": ["Muscle map (6 minutes): On a consenting partner (or on self), locate the ASIS, AIIS region, greater trochanter, ischial tuberosity, tibial tuberosity, fibular head, pes anserinus and Achilles. Name one muscle that attaches to each.", "Squat breakdown (7 minutes): Partner A performs a bodyweight squat. Partner B narrates descent and ascent using muscle names and contraction types, then offers one regression (shallower depth, heel wedge, goblet counterweight) and one progression (pause, tempo, load). Swap.", "Hinge breakdown (6 minutes): Same structure with a dowel or light kettlebell RDL. The coach must notice and correct lumbar flexion versus hip flexion.", "Lunge breakdown (6 minutes): Walking or split lunge. The coach names the front-limb prime movers and one frontal-plane control muscle, and shows a supported regression (static split squat, reduced depth, hand support)."]}, {"t": "h", "x": "Upper body"}, {"t": "ol", "items": ["Cuff and scapular landmark map (6 minutes): Locate the spine of the scapula, acromion, greater and lesser tubercles (lesser is more medial, best found with the arm slightly externally rotated), medial scapular border and coracoid (only with clear consent — it can be tender). Name the cuff muscle associated with each greater-tubercle facet.", "Push breakdown (7 minutes): Wall press or kneeling or full push-up. The coach narrates GH, elbow and scapular muscles in both phases, then adds a push-up plus to feel serratus anterior. Offer one regression (wall or incline) and one progression (tempo or plus).", "Pull breakdown (6 minutes): Band or dumbbell row. The coach must spot head poke, lumbar extension and a shrugged finish, and recast the cue in anatomical language."]}, {"t": "h", "x": "Practice tasks"}, {"t": "ul", "items": ["Memorise origin, insertion and actions for: iliopsoas (psoas major and iliacus), gluteus maximus, gluteus medius, rectus femoris, the three vasti as a group, biceps femoris (both heads), semitendinosus, semimembranosus, gastrocnemius, soleus and tibialis anterior.", "Film yourself (or observe a colleague) performing a squat, a hinge and a lunge. Write a one-page muscle-by-muscle analysis of one of them, including contraction types.", "In your next lower-body session (with a client or a training partner), watch for a loss of frontal-plane knee control and apply a single anatomical cue. Note what changed.", "Memorise origin, insertion and actions for: the four rotator-cuff muscles, all three parts of trapezius, serratus anterior, pectoralis major, latissimus dorsi, biceps brachii, brachialis and triceps brachii. (Transversus abdominis and the diaphragm follow in Module 4.)", "Write a muscle-by-muscle breakdown of a push-up and of a row, including scapular muscles and contraction types.", "In your next upper-body session, look for a shrugged overhead position or a winged scapula and apply a single anatomical cue. Note what changed."]}]}, {"title": "On the gym floor", "blocks": [{"t": "h", "x": "Lower body"}, {"t": "ul", "items": ["Pilates (mat and reformer): Footwork is a supine squat pattern: watch hip-knee-ankle alignment, and notice whether the pelvis stays quiet. Side-lying series is gluteus medius and minimus in their frontal-plane role. Bridging is a hinge/hip-extension pattern.", "Pilates chair: Standing pump and step-up variations are split-stance hip and knee work with a smaller base — a useful place to see gluteus medius fail or succeed.", "Yoga: Lunges, warriors and chair pose are the same three patterns in different costumes. Downward-facing dog is a hinge plus ankle dorsiflexion plus shoulder flexion.", "Indoor cycling: The downstroke is hip extension, knee extension and plantarflexion (gluteus maximus, quadriceps, triceps surae). A climb in the saddle with a deeper hip hinge shifts demand towards the posterior chain; standing climbs add more bodyweight loading through the same joints.", "Functional fitness and PT: Sled push is a forward-leaning squat/lunge hybrid; sled pull and farmer’s carries challenge the same hips to stabilise while the upper body works; sandbag lunges are this module’s lunge under fatigue.", "Assisted stretching: The Superficial Back Line (Module 4) runs through plantar fascia, Achilles, gastrocnemius and the hamstrings. Today’s attachments explain why a true hinge sensation and a calf-to-hamstring assisted stretching sequence belong together."]}, {"t": "h", "x": "Upper body"}, {"t": "ul", "items": ["Pilates (mat and reformer): Long stretch and plank variations are horizontal pushes plus serratus work. Supine arm straps are cuff and scapular control against springs. The hundred and abdominal series only work if the neck is not asked to be a flexor-in-chief — cue the canister and the mid-thorax, not a yank on the sternocleidomastoid.", "Pilates chair: Triceps press-sit and seated or standing press patterns are today’s elbow and shoulder tables made visible.", "Yoga: Chaturanga is a horizontal push with a high need for serratus and cuff control; upward-facing dog needs thoracic extension without dumping into the lumbar spine; downward-facing dog is shoulder flexion plus upward rotation plus a hinge.", "Indoor cycling: Resting heavily through shrugged shoulders on the handlebars is an upper-trapezius strategy. Cue a long, supported spine and a quieter shoulder girdle, not a military retraction that lifts the chest into lumbar extension.", "Functional fitness and PT: Farmer’s carries demand a canister and a depressed, stable scapula; wall balls are a squat plus a vertical push; the ski erg is a hinge plus a vertical-pulling pattern. Fatigue will show you which part of this module’s map was theoretical.", "Assisted stretching: The arm lines and the Deep Front Line (Module 4) become teachable once today’s attachments are clear. Do not stretch into a painful arc and call it fascia."]}]}], "takeaways": ["Axial skeleton: skull, spine, ribs, sternum. Appendicular: girdles and limbs.", "Six synovial types: hinge, pivot, ball-and-socket, condyloid, saddle and plane.", "Hip: gluteus maximus extends, gluteus medius steadies the pelvis, iliopsoas flexes.", "Squat and lunge: quads and glutes lower eccentrically and lift concentrically; a hinge loads the hamstrings across the hip.", "The scapula aims the socket and the rotator cuff centres the ball.", "Push: pecs, anterior deltoid, triceps, serratus. Pull: lats, posterior deltoid, rhomboids and mid-traps, elbow flexors."], "quiz": [{"q": "The glenohumeral joint is which synovial type?", "options": ["Hinge", "Pivot", "Ball-and-socket", "Saddle"], "answer": 2, "explain": "The glenohumeral joint is a ball-and-socket synovial joint, with three degrees of freedom.", "src": "q2.2"}, {"q": "The atlanto-axial (C1–C2) relationship that allows a large share of cervical rotation is primarily a:", "options": ["Hinge joint", "Fibrous suture", "Ball-and-socket joint", "Pivot joint"], "answer": 3, "explain": "The atlanto-axial joint (C1–C2) is a pivot joint: the atlas rotates around the dens of the axis.", "src": "q2.4"}, {"q": "Which of the following is a cartilaginous joint?", "options": ["The pubic symphysis", "A skull suture", "The glenohumeral joint", "The proximal radioulnar joint"], "answer": 0, "explain": "The pubic symphysis is a cartilaginous joint (a symphysis). Skull sutures are fibrous; the other options are synovial.", "src": "q2.6"}, {"q": "Which is the only quadriceps muscle that crosses the hip as well as the knee?", "options": ["Vastus lateralis", "Rectus femoris", "Vastus intermedius", "Vastus medialis"], "answer": 1, "explain": "Rectus femoris crosses both the hip (flexion) and the knee (extension); the three vasti cross only the knee.", "src": "q3.1"}, {"q": "Gluteus medius inserts on the:", "options": ["Lesser trochanter", "Iliac crest", "Greater trochanter", "Adductor tubercle"], "answer": 2, "explain": "Gluteus medius runs from the external ilium to the lateral surface of the greater trochanter.", "src": "q3.2"}, {"q": "Which hamstring muscle does not cross the hip?", "options": ["Long head of biceps femoris", "Semimembranosus", "Semitendinosus", "Short head of biceps femoris"], "answer": 3, "explain": "The short head of biceps femoris arises from the femur, so it crosses only the knee.", "src": "q3.3"}, {"q": "The primary actions of tibialis anterior are:", "options": ["Dorsiflexion and inversion", "Plantarflexion and eversion", "Dorsiflexion and eversion", "Plantarflexion and inversion"], "answer": 0, "explain": "Tibialis anterior dorsiflexes and inverts the foot.", "src": "q3.4"}, {"q": "The three muscles that insert at the pes anserinus are:", "options": ["Rectus femoris, vastus medialis and sartorius", "Sartorius, gracilis and semitendinosus", "Semimembranosus, gracilis and adductor longus", "Biceps femoris, sartorius and gracilis"], "answer": 1, "explain": "“Say grace before tea”: sartorius, gracilis and semitendinosus form the pes anserinus.", "src": "q3.5"}, {"q": "Compared with a squat, a hip hinge (for example a Romanian deadlift) loads the hamstrings more obviously because:", "options": ["The hamstrings do not cross the hip", "The knees travel much further forward than in a squat", "The hamstrings lengthen over the hip without being shortened as much by deep knee flexion", "The quadriceps do most of the work of extending the hip in a hinge"], "answer": 2, "explain": "In a hinge the knees stay soft, so the hamstrings lengthen across the hip without being shortened at the knee, which loads them more obviously.", "src": "q3.6"}, {"q": "Give the origin, insertion and primary actions of gluteus maximus.", "type": "sa", "model": "Origin: posterior ilium behind the posterior gluteal line, dorsal sacrum and coccyx, sacrotuberous ligament. Insertion: iliotibial tract and gluteal tuberosity of the femur. Actions: hip extension and external rotation; upper fibres abduct, lower fibres adduct; posterior pelvic tilt. Mark yourself correct if all three elements are substantially right.", "src": "q3.7"}, {"q": "Which rotator-cuff muscle inserts on the lesser tubercle of the humerus?", "options": ["Supraspinatus", "Infraspinatus", "Teres minor", "Subscapularis"], "answer": 3, "explain": "Subscapularis is the only rotator-cuff muscle that inserts on the lesser tubercle; the other three use the greater tubercle.", "src": "q4.1"}, {"q": "The upward-rotation force couple of the scapula is produced by:", "options": ["Upper trapezius, lower trapezius and serratus anterior", "Rhomboids, levator scapulae and pectoralis minor", "Middle trapezius, latissimus dorsi and biceps brachii", "Anterior deltoid, pectoralis major and coracobrachialis"], "answer": 0, "explain": "Upper trapezius, lower trapezius and serratus anterior together rotate the scapula upward so the glenoid faces up.", "src": "q4.2"}, {"q": "The workhorse of elbow flexion in every forearm position is:", "options": ["Biceps brachii", "Brachialis", "Brachioradialis", "Coracobrachialis"], "answer": 1, "explain": "Brachialis attaches to the ulna, so forearm rotation does not change its pull: it flexes the elbow in every forearm position.", "src": "q4.3"}, {"q": "Latissimus dorsi inserts on the:", "options": ["Greater tubercle of the humerus", "Coracoid process", "Floor of the intertubercular (bicipital) sulcus", "Olecranon of the ulna"], "answer": 2, "explain": "Latissimus dorsi inserts on the floor of the intertubercular sulcus, between pectoralis major and teres major.", "src": "q4.5"}, {"q": "The classical teaching model of scapulohumeral rhythm for full elevation is approximately:", "options": ["1:1 glenohumeral to scapulothoracic motion", "All of the motion coming from the glenohumeral joint", "4:1 glenohumeral to scapulothoracic motion", "2:1 glenohumeral to scapulothoracic motion"], "answer": 3, "explain": "Classical teaching describes a roughly 2:1 ratio of glenohumeral to scapulothoracic motion. It is an average, not a law.", "src": "q4.6"}], "num": 3}, {"id": "anat3", "title": "Anatomy III: Spine, Core, Nervous System & Fascia", "short": "Spine, core, nerves & fascia", "hours": 4, "blurb": "Understand the spine and posture, the deep core canister, how the nervous system controls movement, and where fascia fits.", "objectives": ["Describe the regions and curves of the vertebral column, the parts of a typical vertebra, and the structure of an intervertebral disc.", "Carry out a standing postural observation against a standard plumb-line reference, describing what you see without diagnosing a medical condition.", "Relate common postural patterns (forward head, rounded shoulders, anterior or posterior pelvic tilt) to the training you deliver, and choose a coaching experiment rather than a ‘corrective’ label.", "Describe the deep core canister (diaphragm, transversus abdominis and the rest of the abdominal wall, multifidus, pelvic floor) and contrast it with rectus abdominis as a trunk flexor.", "Define a motor unit and explain, in coaching language, how the nervous system grades force (recruitment and rate coding) and why motor control is more than ‘strength’.", "Describe proprioception and the main roles of muscle spindles and Golgi tendon organs.", "Locate the major peripheral nerves that matter on a gym floor (brachial plexus branches, femoral, obturator, sciatic, tibial and common fibular) and recognise a small set of nerve-related observations that require referral rather than stretching.", "Outline the Superficial Back Line, Superficial Front Line, Lateral Line, Spiral Line and Deep Front Line as described by Myers, and link each line to an assisted-stretching or class example.", "Distinguish mobility from stability using the joint-by-joint model as a useful lens rather than a law, and choose a matching coaching response."], "intro": "This module joins the nervous system to the connective-tissue network coaches already work with in assisted stretching. Keep both conversations honest: fascia is real and continuous, and it is not the cause of every restriction; nerves drive and sense movement, and they are not to be ‘released’ on the gym floor.", "lessons": [{"title": "The spine", "blocks": [{"t": "p", "x": "A typical adult vertebral column has 7 cervical, 12 thoracic and 5 lumbar vertebrae, the sacrum (five fused vertebrae) and the coccyx (usually three to five fused segments). There are 23 intervertebral discs: none between the skull and C1, and none between C1 and C2. The adult sagittal curves are a cervical lordosis, a thoracic kyphosis, a lumbar lordosis and a sacral kyphosis. The thoracic and sacral curves are primary (present at birth); the cervical and lumbar lordoses are secondary and develop as the infant lifts the head and then stands."}, {"t": "p", "x": "A typical vertebra has a body, a vertebral arch (two pedicles and two laminae), a spinous process, two transverse processes, superior and inferior articular processes (whose facets form the zygapophyseal joints) and a vertebral foramen. Stacked foramina form the vertebral canal for the spinal cord. Spinal nerves exit through the intervertebral foramina."}, {"t": "ul", "items": ["Cervical notes: Atlas (C1) has no body and no spinous process; it is a ring that holds the skull. The atlanto-occipital joints (condyloid) allow nodding (‘yes’). The axis (C2) has the dens (odontoid process). The atlanto-axial joints allow a large share of cervical rotation (‘no’). Cervical vertebrae have transverse foramina (the vertebral artery typically travels through C1–C6). C2–C6 spinous processes are often bifid. C7 is the vertebra prominens.", "Thoracic notes: Costal facets on the bodies and transverse processes articulate with the ribs. Spinous processes are long and angled downward, one reason thoracic extension and rotation feel different from lumbar motion.", "Lumbar notes: Large kidney-shaped bodies, short stout spinous processes and facet orientations that favour flexion and extension over rotation. This is where many clients feel ‘tight backs’ after loaded hinges and indoor cycling classes — and where trainers must not chase lumbar rotation to make up for a stiff thorax."]}, {"t": "p", "x": "An intervertebral disc has a tough outer annulus fibrosus (concentric lamellae of collagen, fibre direction alternating between layers) and an inner nucleus pulposus (a hydrated, proteoglycan-rich gel that distributes compressive load). The disc is a symphysis between vertebral bodies. Disc tissue has a limited blood supply, and the outer annulus is innervated — one reason disc problems can be painful, and one reason trainers never claim to ‘put a disc back in’."}, {"t": "callout", "title": "Teaching caution", "x": "A posterolateral disc protrusion may irritate a nearby nerve root. That is a medical presentation, not a programming puzzle. Modules 6 and 10 cover red flags and referral. For now, never offer an informal diagnosis of ‘a slipped disc’; simply understand and explain the structure accurately."}]}, {"title": "Posture", "blocks": [{"t": "p", "x": "Posture is the alignment of body segments at a given moment — standing, sitting on an indoor bike, or holding a plank. It is not a fixed identity. The reference used in this course is the standing lateral plumb line described by Kendall (Muscles: Testing and Function). In a commonly accepted standing alignment, the line falls roughly through the lobe of the ear, the bodies of the cervical vertebrae, the tip of the acromion / the shoulder joint, the bodies of the lumbar vertebrae, the greater trochanter, slightly anterior to the midline of the knee, and slightly anterior to the lateral malleolus."}, {"t": "p", "x": "From the front and back, trainers also look for:"}, {"t": "ul", "items": ["Head tilt or rotation; shoulder-girdle height and a more prominent scapula on one side.", "Waist-angle symmetry, iliac crest height, and PSIS/ASIS heights (a rough, not diagnostic, screen).", "Frontal-plane knee position (a genu valgum appearance vs genu varum) and an obvious pes planus or pes cavus foot shape — again as observations, not labels to medicalise."]}, {"t": "p", "x": "Patterns trainers will see often, and the honest way to talk about them:"}, {"t": "cards", "hdr": ["Observation", "What you may notice", "Common (not universal) muscular pattern", "Coaching experiment, not a diagnosis"], "rows": [["Forward head", "Ear sits well anterior to the acromion; upper cervical extension with lower cervical flexion", "Often short suboccipitals; long or under-used deep neck flexors", "Cue the head position on the bike and in mat abdominal work so the neck is not hanging off the back of the skull."], ["Rounded / protracted shoulders", "Acromion sits forward; scapulae sit wide on the ribcage", "Often dominant pectoralis minor and major; under-used middle trapezius, rhomboids and serratus (the last of these is about control, not ‘tightness’)", "A row is not automatically the fix. Check whether the scapula can both retract and upwardly rotate (Module 3)."], ["Increased thoracic kyphosis", "A deeper convex curve through the mid-back", "May involve stiffness into extension and rotation rather than a single ‘weak’ muscle", "Thoracic extension over a foam roller or a bench is a mobility experiment; pair it with loaded rows and overhead control."], ["Anterior pelvic tilt", "ASIS well anterior and inferior relative to PSIS; increased lumbar lordosis", "Often a lower-crossed pattern (Janda): shorter hip flexors and lumbar extensors; longer or less active abdominals and gluteus maximus. Treat this as a hypothesis.", "Check whether the client can posteriorly tilt on request, then hold a hinge without dumping into the lumbar spine."], ["Posterior pelvic tilt", "Flattened lumbar curve; pubic bone more anterior", "May accompany a flexed lumbar strategy in sitting or in abdominal work", "In mat work, not every client should be cued into a deeper tuck. Some already live there."], ["Apparent scoliosis or pelvic height difference", "Lateral curvature, rib hump, or one iliac crest higher", "Many causes, including a true structural curve, a leg-length difference, or a simple standing habit", "Do not ‘correct a scoliosis’ on the gym floor. Note it, avoid aggressive loaded side-bending into pain, and refer if it is new, progressive or symptomatic."]]}, {"t": "p", "x": "A useful sentence to remember: ‘We describe what we see, we test whether the person can change it when asked, and we choose an exercise that gives them that option. We do not name a disease.’"}]}, {"title": "The deep core and the rest of the trunk", "blocks": [{"t": "p", "x": "Teach the trunk as a canister, not as a set of ‘abs’. The roof is the diaphragm, the walls are transversus abdominis and the rest of the abdominal wall (with the thoracolumbar fascia linking into the back), the back of the wall includes multifidus, and the floor is the pelvic floor (levator ani — pubococcygeus, puborectalis and iliococcygeus — plus coccygeus). When these four parts coordinate, intra-abdominal pressure rises in a controlled way and the lumbar segments have a more stable environment for the hips and shoulders to work from. This is relevant to a loaded hinge, a heavy carry, the Pilates hundred and a controlled yoga transition."}, {"t": "cards", "hdr": ["Muscle", "Origin", "Insertion", "Primary actions"], "rows": [["Diaphragm", "Xiphoid process; inner surfaces of the lower six ribs and their costal cartilages; lumbar vertebral bodies via the crura (approximately L1–L3) and the arcuate ligaments", "Central tendon of the diaphragm", "Primary muscle of inspiration. It also cooperates with the abdominal wall and pelvic floor to manage intra-abdominal pressure"], ["Transversus abdominis", "Inner surfaces of costal cartilages 7–12, thoracolumbar fascia, iliac crest and inguinal ligament", "Linea alba and pubic crest via the abdominal aponeurosis", "Compresses the abdomen and raises intra-abdominal pressure; supports lumbar stability. It is not a trunk flexor in the way rectus abdominis is"], ["Multifidus", "Sacrum, PSIS, and the mammillary or transverse processes of vertebrae below", "Spinous processes two to four levels above", "Segmental spinal stabilisation, extension and contralateral rotation. Especially important in the lumbar spine"], ["Pelvic floor (levator ani group and coccygeus)", "Pubis, tendinous arch of levator ani and ischial spine (broadly)", "Coccyx, anococcygeal ligament and related midline structures; puborectalis forms a sling around the anorectal junction", "Supports the pelvic organs, contributes to continence, and forms the floor of the core canister"], ["Rectus abdominis", "Pubic crest and pubic symphysis", "Xiphoid process and costal cartilages of ribs 5–7", "Trunk flexion and posterior pelvic tilt; compresses the abdomen"], ["External oblique", "External surfaces of ribs 5–12", "Iliac crest, linea alba and pubic tubercle (via its aponeurosis)", "Contralateral trunk rotation, ipsilateral side-bend and flexion; compresses the abdomen"], ["Internal oblique", "Thoracolumbar fascia, iliac crest and inguinal ligament", "Inferior borders of ribs 10–12, linea alba and pubic crest", "Ipsilateral trunk rotation, ipsilateral side-bend and flexion; compresses the abdomen"], ["Erector spinae (iliocostalis, longissimus, spinalis)", "A broad origin from the sacrum, iliac crest, sacroiliac ligaments and the lumbar and thoracic spinous processes (the common tendon), then region-specific attachments", "Ribs, transverse processes and spinous processes above, and the skull for the most superior parts", "Spinal extension (bilateral) and ipsilateral side-bend (unilateral); they work isometrically in a well-braced hinge"], ["Quadratus lumborum", "Iliac crest and iliolumbar ligament", "Inferior border of the 12th rib and the tips of the L1–L4 transverse processes", "Ipsilateral side-bend; ‘hip hiking’; stabilises the 12th rib during respiration; a frequent complaint zone after poorly organised side-bending or standing on one leg"]]}, {"t": "p", "x": "External and internal obliques on opposite sides cooperate to produce rotation (right external oblique with left internal oblique rotates the trunk to the left). Cue rotation as a whole-trunk movement led by the thorax, not as a lumbar twist on a stiff thorax."}]}, {"title": "Motor control and the motor unit", "blocks": [{"t": "p", "x": "A motor unit is one alpha motor neuron and all of the skeletal muscle fibres it innervates. Small motor units (fewer fibres, typically slower-twitch) are recruited first; larger, higher-threshold units come in as force demand rises (Henneman’s size principle). The nervous system also grades force by changing how fast those neurons fire (rate coding). Strength, therefore, is never only a property of a muscle belly. It is also a skill of recruiting the right motor units, at the right time, in concert with the rest of the body, for the task in front of the client."}, {"t": "p", "x": "Motor control uses both feedforward (anticipatory) and feedback (reactive) strategies. A well-organised canister before a lift is feedforward. A stumble and recovery on a sandbag lunge is feedback. External cues (‘push the floor away’, ‘quietly slide the carriage’) often produce cleaner movement than internal ones (‘contract your gluteus maximus’) because they let the nervous system organise the synergy instead of asking the client to micromanage a single muscle. Use anatomical names with other coaches; use simpler, external language with clients unless a client clearly wants the detail."}]}, {"title": "Proprioception", "blocks": [{"t": "p", "x": "Proprioception is the sense of where the body is in space and how it is moving, built from muscle, tendon, joint and skin receptors and assembled in the central nervous system."}, {"t": "ul", "items": ["Muscle spindles (Ia and II afferents): Lie within the muscle, in parallel with the ordinary (extrafusal) muscle fibres. They detect muscle length and the rate of length change. Their stretch reflex produces a protective contraction of the same muscle (the classic tendon-tap reflex is the textbook demonstration). They are one reason a fast, unexpected lengthening feels different from a slow assisted-stretch lengthening.", "Golgi tendon organs: Lie in series at the musculotendinous junction. They detect tension. Via Ib afferents they can reduce drive to the same muscle (autogenic inhibition) and are part of the nervous system’s force-monitoring system. They are not a switch you ‘turn off’ to get a deeper stretch, and that is not how we should describe assisted stretching.", "Joint and cutaneous receptors: Joint capsules, ligaments and skin add position and pressure information, especially at the foot and hand. This is one reason barefoot or lightly shod balance work, and careful foot contact on a Pilates reformer footbar, change how a movement feels."]}, {"t": "p", "x": "After an ankle sprain (once a clinician has cleared the client to train), proprioceptive loss is common even when strength has returned. Single-leg stance, slow-tempo lunges and carefully progressed change-of-direction work are motor-control training, not a test of courage."}]}, {"title": "Nerves trainers should be able to name", "blocks": [{"t": "p", "x": "The central nervous system is the brain and spinal cord. The peripheral nervous system includes the cranial and spinal nerves. For this course, trainers need a working map of the nerves most often discussed on a gym floor — not so they can diagnose, but so they know when a presentation has left the world of ‘tight muscles’ and entered the world of referral."}, {"t": "cards", "hdr": ["Nerve (typical roots)", "Muscles or role of interest", "Gym-floor observation that is not yours to treat"], "rows": [["Long thoracic (C5–C7)", "Serratus anterior", "Marked, especially new, scapular winging. Refer rather than loading more overhead work."], ["Suprascapular (C5–C6)", "Supraspinatus and infraspinatus", "Unexplained wasting of the supra- or infraspinous fossa, or deep posterior shoulder pain with weakness of external rotation or initiation of abduction."], ["Axillary (C5–C6)", "Deltoid and teres minor; sensation over the ‘regimental badge’ area of the upper lateral arm", "Weak abduction after shoulder trauma or dislocation — stop and refer."], ["Radial (C5–T1)", "Triceps and the extensor compartment of the forearm", "Wrist drop (inability to extend the wrist and fingers), for example after a fracture of the humeral shaft or sustained pressure on the back of the upper arm."], ["Median (C6–T1, often described as C5–T1)", "Most forearm flexors and the thenar muscles", "Numbness in the palmar thumb, index, middle and radial ring finger, especially at night — a carpal-tunnel-type presentation to refer, not to stretch harder."], ["Ulnar (C8–T1)", "Flexor carpi ulnaris, the medial half of flexor digitorum profundus, and most of the intrinsic hand muscles", "Numbness in the little finger and ulnar ring finger; a ‘clawing’ tendency. Common entrapment talk involves the cubital tunnel at the elbow."], ["Femoral (L2–L4)", "Iliacus, sartorius, quadriceps; often pectineus. Sensory: anterior thigh and, via saphenous, the medial leg", "Unexplained quadriceps weakness or a sudden inability to control the knee in a squat or on stairs."], ["Obturator (L2–L4)", "Adductor group (the hamstring part of adductor magnus is sciatic/tibial) and gracilis; obturator externus", "Sensory change on the inner thigh with adductor weakness — refer."], ["Sciatic (L4–S3)", "Hamstrings (the short head of biceps femoris is the common fibular division) and, via its tibial and common fibular branches, essentially the rest of the lower leg", "True sciatic symptoms are not ‘a tight piriformis’ until a clinician says so. Radiating pain, numbness or weakness into the limb is a referral, not an assisted-stretching target."], ["Tibial (from sciatic)", "Triceps surae, tibialis posterior, the long toe flexors and the plantar intrinsics", "Unexplained numbness of the sole, or a foot that cannot plantarflex strongly (for example, cannot rise onto the toes)."], ["Common fibular / peroneal (from sciatic; L4–S2)", "Then splits: deep fibular to the anterior compartment (tibialis anterior, long toe extensors); superficial fibular to the lateral compartment (fibularis longus and brevis)", "The nerve is vulnerable where it winds around the fibular neck. Foot drop (loss of dorsiflexion and eversion) is an urgent reason to stop and refer — it is not a cueing problem."]]}, {"t": "p", "x": "The brachial plexus is formed from the ventral rami of C5–T1. The lumbar plexus is formed mainly from L1–L4; the sacral plexus from L4–S4. The sciatic nerve typically leaves the pelvis through the greater sciatic foramen, most often inferior to piriformis, and divides into tibial and common fibular nerves, usually near the popliteal fossa (the division can occur higher)."}]}, {"title": "Fascial lines — linked to assisted stretching", "blocks": [{"t": "p", "x": "Thomas Myers’ Anatomy Trains describes myofascial meridians: continuous lines of muscle and connective tissue along which load and movement can be traced. They are a map for seeing the body as a whole, which is how many assisted-stretching methods, including Fascial Stretch Therapy, are taught. They are a model, not a set of surgical structures you could dissect as labelled railway lines. Use them to organise stretching, cueing and session flow; do not use them to explain every pain a client reports."}, {"t": "cards", "hdr": ["Line", "General path (teaching version)", "Class and stretching link"], "rows": [["Superficial Back Line (SBL)", "Plantar fascia and short toe flexors → Achilles and gastrocnemius → hamstrings → sacrotuberous ligament → erector spinae / sacral fascia → epicranial fascia over the skull to the brow", "A standing forward fold, an RDL, Pilates reformer elephant, downward-facing dog and a classic back-line assisted stretching sequence all load parts of this line. Tightness ‘in the hamstrings’ is sometimes a line conversation that includes the sole of the foot and the lumbar fascia."], ["Superficial Front Line (SFL)", "Toe extensors and tibialis anterior → subpatellar tendon and quadriceps / rectus femoris → rectus abdominis and sternal fascia → sternocleidomastoid → scalp fascia (the line is often taught in two pieces that meet at the pelvis)", "A lunge with the rear hip extending, a neglected stretch of the anterior hip after indoor cycling, ‘standing tall’ out of a flexed bike posture, and an assisted-stretching sequence that opens the front of the hip and trunk."], ["Lateral Line (LL)", "Fibularis longus and brevis → anterior ligament of the fibular head → IT tract / TFL and part of gluteus maximus → lateral obliques → lateral intercostals → splenius / sternocleidomastoid on the neck", "Side-lying mat series, standing side bends, single-leg pelvic control and assisted stretching work along the side of the leg and trunk. A ‘tight IT band’ is rarely an isolated band problem."], ["Spiral Line (SL)", "A double helix: splenius to rhomboids to serratus anterior, across via the abdominal obliques, then TFL / IT tract to tibialis anterior, with a lower stirrup through fibularis longus and back up the biceps femoris towards the sacrum", "Rotational yoga transitions, wood-chops, the way a runner counter-rotates through the trunk, and assisted stretching sequences that combine a hip with the opposite shoulder."], ["Deep Front Line (DFL)", "The deep ‘core line’: long toe flexors and tibialis posterior → adductors and the deep posterior leg → pelvic floor and iliopsoas → diaphragm and mediastinal/visceral connections → longus colli and capitis and the deep front of the neck", "Breathing, canister work, adductor and psoas-informed assisted stretching, and the quiet stability underneath Pilates. This is the line to think about when a client holds their breath and grips their hip flexors to find ‘core’."], ["Arm lines (four)", "Superficial and Deep Front Arm Lines (pectoralis major to the palmar flexors; pectoralis minor to biceps and the thumb side of the forearm) and Superficial and Deep Back Arm Lines (trapezius/deltoid to the forearm extensors; rhomboids and the cuff to triceps and the ulnar side of the hand)", "Pilates reformer strap work, chaturanga, carries, the ski erg and assisted stretching sequences for the chest, cuff and forearm. Grip and shoulder position belong on the same map."]]}, {"t": "p", "x": "Myers also describes Functional Lines that cross the front and back of the trunk (for example latissimus dorsi on one side towards the opposite adductor via the abdominal fascia). You do not need them for the module test beyond knowing that these crossed, functional connections exist."}, {"t": "callout", "title": "Honest limits of the model", "x": "Fascial continuity helps explain why a foot position changes a hamstring sensation, or why a breath change alters a hip stretch. It does not license a trainer to claim they have ‘released an organ line’ or treated a neuropathy. Stay with movement, sensation and load. Leave pathology to clinicians."}]}, {"title": "Mobility versus stability", "blocks": [{"t": "p", "x": "Mobility is the available, controlled range of a joint or region — the combination of tissue extensibility and the person’s ability to reach and use that range. Stability is the ability to control motion (or to prevent unwanted motion) under the load and speed the task requires. A person can be mobile and unstable, or stiff and stable, or any other pairing. Stretching a region that actually needed control is a common coaching error; so is strengthening a region that simply cannot get into the range the exercise requires."}, {"t": "p", "x": "The joint-by-joint lens popularised by Cook and Boyle is a useful starting hypothesis, not a law of nature. In that model, the ankle, hip, thoracic spine and glenohumeral joint tend to need mobility; the knee, lumbar spine and scapulothoracic region tend to need stability (with the scapula providing a controlled base so the GH joint can be mobile). Real clients break the pattern often: a stiff knee after surgery, a hypermobile lumbar spine, a thorax that is unstable rather than stiff. Use the lens to ask a better question, then test it."}, {"t": "cards", "hdr": ["What you see", "Mobility hypothesis", "Stability / control hypothesis", "First coaching experiment"], "rows": [["Heels rise or the feet spin out in a squat", "Limited talocrural dorsiflexion (often soleus or joint)", "The person is rushing the descent and has not organised the foot", "A heel wedge or a slower tempo. If the wedge instantly cleans the squat, mobility (or a temporary bypass of it) was a large part of the story."], ["Lumbar flexion at the bottom of a hinge", "Limited hip flexion range, or the person is simply going beyond their hip range", "They cannot maintain the canister and the spinal extensors under load", "Raise the implement and shorten the range. If a higher surface produces a perfect hinge, you were asking for more hip mobility than they had today."], ["Knee falls in during a lunge", "Limited hip internal or external rotation options (either can appear as a collapse, depending on strategy)", "Poor frontal-plane control by gluteus medius and the rest of the lateral hip", "Narrow the range, slow the tempo, add a light band cue or a wall support. If control appears when speed and depth drop, it was largely a stability problem."], ["Pinch through a painful arc overhead", "Limited GH external rotation or scapular upward rotation / posterior tilt", "Poor cuff centring or a shrugged, upper-trap strategy", "Reduce range, slow down, and coach upward rotation (Module 3). Pain that persists or worsens is a referral, not a mobility project (Module 10)."], ["Ribs flare in abdominal or overhead work", "Stiff thorax that cannot extend, so the lumbar spine extends instead", "The person cannot keep the canister organised while the arms or legs move", "Shorten the lever (bent knees, lower the arms) before you stretch anything."]]}]}, {"title": "Practice drills", "blocks": [{"t": "p", "x": "Work through these drills with a training partner where one is needed. On your own, use a mirror or film yourself. Times are guides only."}, {"t": "ol", "items": ["Standing posture screen (10 minutes): One partner stands in a natural posture. The other observes from the side against an imaginary plumb line (a hanging band or a door frame helps) and from the front and back. They record five observations in neutral language (‘the ear sits anterior to the acromion’, not ‘you have bad posture’). Swap.", "Canister before load (6 minutes): In crook lying, practise a quiet nasal breath that expands the abdomen and lower ribs without thrusting the ribs, then take that same sense into a dead-bug, a light hinge or a short farmer’s carry.", "Line mapping (8 minutes): One partner lies supine or stands. The other traces, with a hand hovering or with light consented contact, the Superficial Back Line and then the Superficial Front Line, naming the stations they pass. Repeat on the Lateral Line in side-lying or standing.", "Assisted stretching link (7 minutes): With a partner, take one assisted stretch you already use (or a simple standing hamstring stretch) and name the primary line it loads. Change one joint position (for example ankle dorsiflexion, or adding a breath into the DFL) and report what the sensation does.", "Mobility or stability? (6 minutes): Each pair picks a squat or a hinge limitation and runs the matching experiment from the table above. They must say which hypothesis they are testing and what result would support it.", "Proprioception (4 minutes): Single-leg stance, eyes open then (if safe) eyes briefly closed, then a slow marching pattern. Relate the wobble to the earlier gluteus medius conversation and to this module’s receptors, not to ‘weak ankles’ as a moral category."]}, {"t": "h", "x": "Practice tasks"}, {"t": "ul", "items": ["Sketch the vertebral column and label the five regions, the four adult curves (and whether each is a lordosis or a kyphosis), C7, T3, T7 and the iliac crests.", "With consent, observe two colleagues or (if appropriate) two clients in standing. Write five plumb-line observations for each, using descriptive language only.", "On one page, map a single stretch or stretching sequence onto one of Myers’ lines. Name at least five stations along that line.", "Write three gym-floor examples from your own week: one that was mainly a mobility limitation, one that was mainly a stability / motor-control limitation, and one you are still unsure about. Revisit the unsure one when you reach Module 7.", "Revise the nerve table until you can name the muscle group and the ‘stop and refer’ observation for long thoracic, femoral, sciatic and common fibular nerves."]}]}, {"title": "On the gym floor", "blocks": [{"t": "ul", "items": ["Pilates: Spinal articulation (roll-down, long spine, cat-cow on the mat) is a controlled journey through many synovial facet joints and many discs. Cue region by region when a client ‘hinges’ at one segment only.", "Indoor cycling: Set-up is a postural task: ear over shoulder, ribs over pelvis, a chosen hip hinge rather than lumbar flexion, and a knee angle set by saddle height. A saddle that is too low increases knee flexion and patellofemoral demand; a saddle that is too high often produces hip rocking and a search for range in the lumbar spine or hamstrings.", "Functional fitness and PT: Loaded carries and sled work are moving postural tasks. If the thorax cannot extend and rotate, the lumbar spine is often asked to do the extra motion — a coaching problem, not a character flaw.", "Assisted stretching: Bony landmarks (Module 3) are the hands’ map and the foundation for the fascial lines in this module."]}, {"t": "ul", "items": ["Pilates: So much of the method is motor control: moving one segment while another stays quietly organised. That is feedforward canister work plus selective mobility, which is why Pilates transfers so well into strength work when it is taught this way.", "Yoga: Transitions are motor-control problems at speed. Name the line you are lengthening (SBL in a forward fold, SFL in a low lunge, Spiral Line in a twist) and the joint you are asking to be stable underneath it.", "Indoor cycling: Repetitive sagittal loading in a fixed posture. Clients often leave with an SFL that feels short (hip flexors, anterior chest) and an SBL that has been held in a long isometric (spinal extensors). Assisted stretching and a well-chosen hinge or thoracic-extension drill are a better answer than random stretching.", "Functional fitness and PT: Fatigue degrades motor control before it degrades theoretical strength. Cue fewer things, earlier, and treat late-session valgus or lumbar flexion as a control problem, not as a chance to ‘push through’.", "Assisted stretching: This module is the theory beneath much of the stretching work coaches deliver. Plan sequences by line, respect symptoms that sound neural, and never stretch into numbness, pins and needles, or radiating pain."]}]}], "takeaways": ["7 cervical, 12 thoracic, 5 lumbar vertebrae; four adult curves; 23 discs.", "Posture is an observation, not a diagnosis: describe, test if it can change, experiment.", "The core canister: diaphragm, abdominal wall, multifidus and pelvic floor.", "Strength is also a skill: recruitment and rate coding of motor units.", "Fascial lines are a useful map, not an explanation for every pain.", "Mobility = reaching the range; stability = controlling it under load and speed. Test, don’t guess.", "Numbness, pins and needles, radiating pain or weakness: stop and refer."], "quiz": [{"q": "How many vertebrae are typically present in the lumbar region of an adult?", "options": ["4", "12", "7", "5"], "answer": 3, "explain": "The adult lumbar spine typically has 5 vertebrae (with 7 cervical and 12 thoracic).", "src": "q2.1"}, {"q": "The inner, gel-like region of an intervertebral disc is the:", "options": ["Nucleus pulposus", "Ligamentum flavum", "Annulus fibrosus", "Facet capsule"], "answer": 0, "explain": "The nucleus pulposus is the hydrated, gel-like centre of the disc; the annulus fibrosus is the tough outer ring.", "src": "q2.3"}, {"q": "In Kendall’s standing lateral plumb-line reference, the line should pass approximately through which of the following?", "options": ["The tip of the nose and the navicular bone", "The lobe of the ear, the greater trochanter, and slightly anterior to the lateral malleolus", "The chin, the umbilicus and the heels", "The back of the skull, the sacrum and the back of the heel"], "answer": 1, "explain": "In Kendall’s reference, the line passes roughly through the ear lobe, the greater trochanter and slightly in front of the lateral malleolus.", "src": "q2.5"}, {"q": "Name the four sagittal curves of a typical adult vertebral column and state whether each is a lordosis or a kyphosis. Which two are secondary curves?", "type": "sa", "model": "Cervical lordosis, thoracic kyphosis, lumbar lordosis, sacral kyphosis. The cervical and lumbar lordoses are the secondary curves.", "src": "q2.8"}, {"q": "The primary role of transversus abdominis is to:", "options": ["Flex the trunk in the same way as rectus abdominis", "Rotate the trunk to the same side and laterally flex the spine", "Compress the abdomen, raise intra-abdominal pressure and support lumbar stability", "Extend the lumbar spine and pull the pelvis into anterior tilt"], "answer": 2, "explain": "Transversus abdominis compresses the abdomen and raises intra-abdominal pressure; it is not a trunk flexor like rectus abdominis.", "src": "q4.4"}, {"q": "Describe the core canister (four parts) and explain in two sentences why it matters for a loaded hip hinge.", "type": "sa", "model": "Roof: diaphragm. Walls: transversus abdominis and the rest of the abdominal wall (with thoracolumbar fascia). Back of the wall: multifidus. Floor: pelvic floor. In a loaded hinge they raise and manage intra-abdominal pressure so the lumbar segments have a stable environment while the hips move; spinal extensors can then work isometrically rather than the lumbar spine flexing under load.", "src": "q4.9"}, {"q": "A motor unit is:", "options": ["One muscle fibre and all of the nerves that touch it", "A Golgi tendon organ plus a muscle spindle", "The brain, spinal cord and a single muscle", "One alpha motor neuron and all of the skeletal muscle fibres it innervates"], "answer": 3, "explain": "A motor unit is one alpha motor neuron plus all the muscle fibres it supplies.", "src": "q5.1"}, {"q": "Muscle spindles are most sensitive to:", "options": ["Muscle length and the rate of length change", "Arterial blood pressure", "Skin temperature", "Intra-abdominal pressure only"], "answer": 0, "explain": "Muscle spindles sit in parallel with muscle fibres and detect length and rate of length change.", "src": "q5.2"}, {"q": "Golgi tendon organs primarily detect:", "options": ["Light touch on the skin", "Tension in the musculotendinous unit", "Joint swelling", "The oxygen content of muscle"], "answer": 1, "explain": "Golgi tendon organs sit at the musculotendinous junction and sense tension.", "src": "q5.3"}, {"q": "The sciatic nerve typically arises from which nerve roots?", "options": ["C5–T1", "L1–L2 only", "L4–S3", "S4–Co1"], "answer": 2, "explain": "The sciatic nerve typically arises from roots L4 to S3.", "src": "q5.4"}, {"q": "Injury to the long thoracic nerve affects which muscle, with which classic visual sign?", "options": ["Deltoid — wasted regimental badge area", "Infraspinatus — loss of internal rotation only", "Trapezius — inability to shrug", "Serratus anterior — winging of the scapula"], "answer": 3, "explain": "The long thoracic nerve supplies serratus anterior; weakness shows as winging of the scapula.", "src": "q5.5"}, {"q": "In the joint-by-joint lens taught on this course, which pairing is correct?", "options": ["Lumbar spine biased towards stability; hip biased towards mobility", "Ankle biased towards stability; knee biased towards mobility", "Lumbar spine biased towards mobility; hip biased towards stability", "Thoracic spine biased towards stability; glenohumeral joint biased towards stability"], "answer": 0, "explain": "The joint-by-joint lens suggests the lumbar spine tends to need stability and the hip mobility. It is a useful hypothesis, not a law.", "src": "q5.6"}, {"q": "Explain the difference between a mobility limitation and a stability (motor-control) limitation, and give one gym-floor example of each.", "type": "sa", "model": "Mobility: the joint or region cannot reach the range the task asks for (for example limited ankle dorsiflexion so the heels rise in a squat). Stability/control: the range exists but the person cannot organise it under load or speed (for example the knee collapses in a lunge and the collapse disappears when the movement is slowed and shortened). Any clear, parallel pair of definitions with one example each.", "src": "q5.8"}, {"q": "Why does proprioception matter when you return a cleared client to single-leg work after an ankle sprain? Name one receptor type involved and one drill you might use.", "type": "sa", "model": "Ligament injury and swelling often reduce proprioceptive input even after strength returns, so the person may not know where the foot is in space. Receptors: muscle spindles, Golgi tendon organs, joint receptors or cutaneous receptors of the foot (any one named correctly). Drill: single-leg stance, slow lunges, or other graded balance / position-sense work once cleared.", "src": "q5.9"}], "num": 4}, {"id": "physiology", "title": "Exercise Physiology Essentials", "short": "Exercise physiology", "hours": 2.5, "blurb": "How the body fuels movement, responds in the moment, and adapts over weeks, so every programme choice has a reason.", "objectives": ["Describe the three energy systems and match each to typical training efforts.", "Explain the acute cardiorespiratory responses to exercise: heart rate, stroke volume, cardiac output, blood pressure and breathing.", "Outline the main chronic adaptations to cardiovascular and resistance training.", "Apply the principles of training: overload, specificity, progression, individuality, recovery and reversibility.", "Monitor exercise intensity using heart rate, RPE and the talk test."], "lessons": [{"title": "ATP and the three energy systems", "blocks": [{"t": "p", "x": "Muscles contract using one fuel: **adenosine triphosphate (ATP)**. The body stores only a small amount, so it constantly regenerates ATP through three overlapping energy systems. All three are always active; what changes is which one contributes most, depending on the intensity and duration of the effort."}, {"t": "svg", "name": "energy", "cap": "The three energy systems overlap. The longer the effort lasts, the lower the intensity that can be sustained and the more the oxidative system contributes. Durations are approximate."}, {"t": "cards", "hdr": ["System", "Fuel", "Dominant during", "Gym-floor examples"], "rows": [["Phosphagen (ATP–PC)", "Stored ATP and creatine phosphate", "Very short, maximal efforts: roughly the first 10 seconds", "A heavy single or double, a jump, a short sprint"], ["Glycolytic (anaerobic glycolysis)", "Carbohydrate (glucose and muscle glycogen), without needing oxygen for this step", "Hard efforts lasting roughly 10 seconds to 2 minutes", "A hard 400 m run, a high-rep set, intervals of 30–60 seconds"], ["Oxidative (aerobic)", "Carbohydrate and fat (and a small amount of protein), using oxygen in the mitochondria", "Efforts longer than about 2–3 minutes, and recovery between hard efforts", "Steady cycling, a long walk or jog, recovering between sets"]]}, {"t": "callout", "title": "Coaching link", "x": "Rest periods matter because they let the phosphagen system recharge. Short rests keep the session more metabolic; longer rests let the client produce high force again on the next set.", "kind": "tip"}]}, {"title": "What happens during exercise: acute responses", "blocks": [{"t": "p", "x": "As exercise begins, the body works to deliver more oxygen to working muscle and remove carbon dioxide and heat."}, {"t": "ul", "items": ["**Heart rate (HR)** rises roughly in line with intensity.", "**Stroke volume (SV)**, the blood pumped per beat, increases, especially in the early stages of exercise.", "**Cardiac output = HR × SV**, the total blood pumped per minute, rises substantially.", "**Blood pressure**: during rhythmic aerobic exercise, systolic pressure rises with intensity while diastolic pressure stays about the same or falls slightly. Heavy lifting, especially with breath-holding, can cause large temporary spikes. A fall in systolic pressure as the workload rises is abnormal and a reason to stop the session.", "**Breathing (ventilation)** increases in rate and depth to take in oxygen and remove carbon dioxide.", "**Blood flow is redistributed** towards working muscles and the skin (for cooling).", "**Body temperature rises**, and sweating increases to dissipate heat."]}, {"t": "callout", "title": "Breath-holding", "x": "The Valsalva manoeuvre (forcefully exhaling against a closed airway) is sometimes used by experienced lifters on maximal attempts, but it raises blood pressure sharply. For general clients, and especially anyone with high blood pressure or heart disease, coach continuous breathing: exhale through the effort.", "kind": "warn"}]}, {"title": "How the body adapts: chronic adaptations", "blocks": [{"t": "h", "x": "Cardiorespiratory training"}, {"t": "ul", "items": ["Stroke volume increases, so resting heart rate and heart rate at a given workload often fall.", "Maximal oxygen uptake (VO₂max), the body’s top capacity to use oxygen, improves, especially in previously untrained people.", "Muscles gain more mitochondria and capillaries and become better at using fat as a fuel.", "Resting blood pressure can fall in people whose blood pressure is elevated."]}, {"t": "h", "x": "Resistance training"}, {"t": "ul", "items": ["**Neural adaptations come first**: in the first weeks, much of the strength gain comes from better motor-unit recruitment, firing rate and coordination (see Module 4).", "**Hypertrophy** (larger muscle fibres) develops over the following weeks and months with sufficient training volume, effort and protein.", "Tendons, ligaments and bone adapt to progressive load, but more slowly than muscle: over months, not sessions.", "Everyday function improves: lifting, carrying, climbing stairs and getting up from the floor."]}, {"t": "callout", "title": "Set expectations honestly", "x": "Early strength gains can be rapid because they are largely neural. Visible change in muscle size and body composition takes longer. Telling clients this early prevents frustration.", "kind": "tip"}]}, {"title": "The principles of training", "blocks": [{"t": "cards", "hdr": ["Principle", "What it means", "In practice"], "rows": [["Overload", "The body adapts only when it is challenged beyond what it is used to.", "Increase load, reps, sets, range, complexity or density, but not all at once."], ["Specificity (SAID)", "Specific Adaptations to Imposed Demands: you get better at what you train.", "A client training for a 5 km run needs running; a client who wants to lift their child needs loaded hinges and carries."], ["Progression", "Overload must increase gradually and systematically over time.", "Progress one variable at a time and watch how the client recovers."], ["Individuality", "People respond differently to the same programme.", "Adjust for age, training history, recovery, schedule and preferences."], ["Recovery", "Adaptation happens during recovery, not during the session itself.", "Plan rest days, sleep and lighter weeks; avoid hammering the same tissues daily."], ["Reversibility", "Fitness gains fade when training stops (“use it or lose it”).", "Keep a minimum effective dose during busy or travel periods."], ["Variation", "Planned changes keep progress and engagement going.", "Change exercises, rep ranges or emphasis in planned blocks, not randomly every session."]]}, {"t": "callout", "title": "Overload is not exhaustion", "x": "A good session leaves the client challenged and able to recover for the next one. Making someone too sore to train for days is not a sign of a good programme.", "kind": "tip"}]}, {"title": "Measuring and monitoring intensity", "blocks": [{"t": "ul", "items": ["**Heart rate**: maximum heart rate is often estimated as 220 − age, or with the Tanaka formula (208 − 0.7 × age). Both are only estimates, and individuals can differ substantially from them.", "**Rating of perceived exertion (RPE)**: on a 0–10 scale, moderate intensity is about 5–6 and vigorous about 7–8. The Borg 6–20 scale is also widely used.", "**The talk test**: at moderate intensity a client can talk but not sing; at vigorous intensity they can say only a few words before pausing for breath.", "**Reps in reserve (RIR)** for resistance training: how many more good reps the client could have done. Beginners often think they are closer to failure than they really are, so teach it over time."]}, {"t": "callout", "title": "Medication can change heart rate", "x": "Some medicines, such as beta-blockers, blunt the heart-rate response to exercise. For these clients, use RPE and the talk test rather than heart-rate zones, and follow any guidance from their doctor.", "kind": "warn"}, {"t": "h", "x": "Physical activity guidelines for adults"}, {"t": "p", "x": "International guidelines (for example from the World Health Organization and ACSM) recommend that adults accumulate at least 150–300 minutes of moderate-intensity, or 75–150 minutes of vigorous-intensity, aerobic activity per week (or an equivalent combination), plus muscle-strengthening activities for all major muscle groups on two or more days a week. Doing some activity is better than none, and less sitting benefits health."}]}], "takeaways": ["ATP fuels every contraction; the phosphagen, glycolytic and oxidative systems overlap.", "Cardiac output = heart rate × stroke volume; both rise during exercise.", "Early strength gains are mostly neural; hypertrophy and tendon adaptation take longer.", "Overload, specificity, progression, individuality, recovery and reversibility guide every programme.", "Monitor intensity with RPE, the talk test and heart rate, and know the limits of HR formulas."], "quiz": [{"q": "Which energy system dominates a maximal effort lasting about 5 seconds, such as a heavy single?", "options": ["Phosphagen (ATP–PC)", "Glycolytic", "Oxidative", "None; the body does not need energy for short efforts"], "answer": 0, "explain": "Very short, maximal efforts rely mainly on stored ATP and creatine phosphate: the phosphagen system."}, {"q": "A hard interval lasting about 45 seconds relies most heavily on which system?", "options": ["Phosphagen only", "Glycolytic", "Oxidative only", "Fat oxidation only"], "answer": 1, "explain": "Hard efforts from roughly 10 seconds to 2 minutes are dominated by anaerobic glycolysis, although all systems contribute."}, {"q": "Cardiac output is calculated as:", "options": ["Stroke volume − heart rate", "Heart rate ÷ blood pressure", "Heart rate × stroke volume", "Breathing rate × heart rate"], "answer": 2, "explain": "Cardiac output (blood pumped per minute) equals heart rate multiplied by stroke volume."}, {"q": "During steady aerobic exercise, what typically happens to blood pressure?", "options": ["Both systolic and diastolic rise sharply", "Both systolic and diastolic pressure stay the same as at rest", "Systolic falls and diastolic rises", "Systolic rises with intensity; diastolic stays about the same or falls slightly"], "answer": 3, "explain": "This is the normal response to rhythmic aerobic exercise. A fall in systolic pressure as workload rises is abnormal and a reason to stop."}, {"q": "In the first few weeks of resistance training, most strength gains come from:", "options": ["Neural adaptations such as better motor-unit recruitment and coordination", "Large increases in muscle size", "Increases in bone density and tendon thickness", "More muscle fibres forming in each trained muscle"], "answer": 0, "explain": "Early gains are largely neural. Hypertrophy contributes more over the following weeks and months."}, {"q": "“You get better at what you train” describes which principle?", "options": ["Reversibility", "Specificity (SAID)", "Individuality", "Variation"], "answer": 1, "explain": "Specificity, or Specific Adaptations to Imposed Demands, means adaptations match the demands of the training."}, {"q": "A client stops training for two months and loses fitness. Which principle explains this?", "options": ["Overload", "Specificity", "Reversibility", "Progression"], "answer": 2, "explain": "Reversibility: training adaptations fade when the training stimulus is removed."}, {"q": "At moderate intensity, the talk test means a client can:", "options": ["Sing comfortably", "Not speak at all", "Say only one word at a time", "Talk, but not sing"], "answer": 3, "explain": "Being able to talk but not sing is the practical marker of moderate intensity."}, {"q": "A client takes a beta-blocker. Which intensity method is most appropriate?", "options": ["RPE and the talk test", "Strict heart-rate zones from 220 − age", "Maximal testing every session", "Training only to failure"], "answer": 0, "explain": "Beta-blockers blunt the heart-rate response, so heart-rate zones become unreliable; RPE and the talk test work better."}, {"q": "Current adult guidelines recommend muscle-strengthening activities for all major muscle groups on at least:", "options": ["One day per month", "Two days per week", "Every day without rest", "Five days per week only"], "answer": 1, "explain": "WHO and ACSM guidance recommends muscle-strengthening activity on two or more days a week."}], "num": 5}, {"id": "consult", "title": "Client Consultation & Screening", "short": "Consultation & screening", "hours": 2, "blurb": "Run a first session that feels effortless to the client and covers everything that keeps them safe: screening, red flags and goals that stick.", "objectives": ["Structure an initial consultation that builds rapport and gathers the right information.", "Use a PAR-Q style pre-participation questionnaire and know when medical clearance is needed.", "Recognise red flags that require emergency care or prompt referral.", "Set SMART goals that connect to what matters to the client.", "Choose appropriate baseline measures and record them sensitively."], "lessons": [{"title": "The initial consultation", "blocks": [{"t": "p", "x": "The first conversation sets the tone for the whole relationship. Aim for a calm, private space and enough time, typically 30–60 minutes. A simple structure:"}, {"t": "ol", "items": ["**Welcome and rapport**: introduce yourself, explain what will happen today and how the information will be used.", "**Goals and motivation**: what do they want, and why does it matter to them now?", "**Health screening**: a PAR-Q style questionnaire, current medications, injuries, surgeries and anything a doctor has advised.", "**Training and lifestyle history**: past exercise, what they enjoyed or disliked, work, sleep, stress, schedule and available equipment.", "**Informed consent**: explain the programme, its benefits and risks, and their right to stop or ask questions at any time.", "**Baseline assessment**: posture and movement screen (Module 7) and any measurements that suit the goal.", "**Agree next steps**: a first-session plan and how you will review progress."]}, {"t": "callout", "title": "Use open questions", "x": "“Tell me about your experience with exercise” invites a story. “Have you exercised before?” invites a yes or no. Reflect back what you hear: “So consistency has been the biggest challenge, not motivation.”", "kind": "tip"}]}, {"title": "Pre-participation health screening", "blocks": [{"t": "p", "x": "Screening identifies people who should get medical clearance before starting, or increasing, an exercise programme. The most widely used tool is the **Physical Activity Readiness Questionnaire (PAR-Q+)**. Its core questions ask whether the person:"}, {"t": "ul", "items": ["Has ever been told by a doctor they have a heart condition or high blood pressure", "Feels pain in the chest at rest, during daily activities or during physical activity", "Loses balance because of dizziness, or has lost consciousness, in the last 12 months", "Has been diagnosed with another chronic medical condition", "Is currently taking prescribed medication for a chronic condition", "Has a bone, joint or soft-tissue problem that could be made worse by becoming more active", "Has been told by a doctor to do only medically supervised physical activity"]}, {"t": "p", "x": "A “yes” answer leads to follow-up questions and, often, a recommendation to get clearance from a doctor or qualified exercise professional before going further. The ACSM pre-participation screening process follows the same logic: it considers the person’s current activity level, any known cardiovascular, metabolic or renal disease, any signs or symptoms suggesting such disease, and the intensity they plan to exercise at."}, {"t": "callout", "title": "When in doubt, get clearance", "x": "Screening is not about refusing people. It is about starting safely. If a client’s answers raise questions, pause intense training, keep activity light if appropriate, and ask them to see their doctor before you progress.", "kind": "warn"}, {"t": "h", "x": "Also ask about"}, {"t": "ul", "items": ["Pregnancy or recent childbirth", "Recent surgery, injury or illness", "Diabetes, asthma, epilepsy or other conditions that may need an emergency plan", "Medications that affect heart rate, blood pressure, blood sugar or balance"]}]}, {"title": "Red flags and referral", "blocks": [{"t": "p", "x": "A red flag is a warning sign that the problem may not be a straightforward musculoskeletal niggle and that a medically qualified person needs to see the client. Trainers are not expected to name the disease. They are expected to stop, not guess, and hand the person to the right level of care."}, {"t": "h", "x": "Emergency care now (do not continue the session; call emergency services or send the client to an emergency department)"}, {"t": "ul", "items": ["Possible cauda equina warning signs: Saddle anaesthesia (numbness in the groin, buttocks or inner thighs), new bladder or bowel disturbance (inability to urinate, incontinence, loss of awareness of the need to go), sexual dysfunction that is new, or bilateral leg symptoms with back pain. This cluster raises concern for cauda equina syndrome.", "Chest pain or systemic collapse: Chest pain, unexplained severe shortness of breath, fainting, sudden unexplained wheeze, or signs that may suggest a blood clot in the lung after a swollen, painful calf.", "Possible stroke or neurological emergency: Sudden severe headache unlike any other, facial droop, limb weakness or speech change, or a seizure.", "Acute trauma: A joint that looks deformed after trauma, an inability to bear weight after a fall or twist, or a suspected fracture or dislocation.", "Possible infection or clot: A hot, rapidly swelling joint with fever (possible infection of the joint) or a calf that is suddenly swollen, red, warm and tender (possible deep-vein thrombosis), especially after travel, surgery or a period of immobility."]}, {"t": "h", "x": "Prompt medical or physiotherapy referral (do not ‘train through it’)"}, {"t": "ul", "items": ["History of cancer, unexplained weight loss, night pain that does not change with position, fever or night sweats with spinal pain, or pain that is steadily worsening rather than mechanical.", "Progressive neurological deficit: a foot that is beginning to drop, unexplained wasting, spreading numbness, or worsening weakness.", "Significant trauma, or trauma in a person who may have osteoporosis (including long-term corticosteroid use), even if they ‘just want to stretch it out’.", "A new, unexplained lump, unremitting pain, or any presentation that simply does not fit a load-related pattern.", "In pregnancy: vaginal bleeding, severe abdominal pain, sudden marked swelling, severe headache, or reduced fetal movement if the client reports it. Refer; do not problem-solve on the gym floor."]}, {"t": "h", "x": "Modify and monitor (usually remains inside the trainer’s role)"}, {"t": "ul", "items": ["Mild, settling, clearly mechanical discomfort that the client can easily localise, that does not radiate in a worrying way, and that eases when you red
