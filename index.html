     Set COURSE_REGULAR_PRICE='' to drop the struck-through price.
   MAX_DEVICES: 0 means no limit. Set a number (for example 3) to refuse a key once it has been activated on more devices than that.
   While GUMROAD_PRODUCT_ID or BUY_URL is still a placeholder, the unlock screen shows “Purchase opens soon” and key entry is off. */

const BUNDLE_PRICE='$197';
const MAX_DEVICES=0;
</script>
<title>Your Level 1 PT Course · by Josh Pieters, Fitness Professional</title>
<meta name="description" content="Your Level 1 PT Course by Josh Pieters, Fitness Professional. An online entry-level personal training course: anatomy, physiology, screening, technique, programme design, nutrition and safety, with a test at the end of every module, a certificate of completion (not an accredited qualification) and a live 1:1 session with Josh to help you start your personal training business.">
<style>
:root{--ink:#14201B;--ink2:#1E2E27;--cream:#F4EEE1;--paper:#FBF8F1;--gold:#C8A96A;--gold-d:#9C7F43;--line:rgba(20,32,27,.13);--muted:#56625C;--ok:#2E6B4E;--ok-bg:#E3EFE7;--bad:#9A3B2E;--bad-bg:#F6E3DE;--warn-bg:#F7EBD3;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;overflow-wrap:break-word;word-wrap:break-word}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.2;margin:0 0 .5em;font-weight:700;overflow-wrap:break-word;hyphens:auto}
h1{font-size:clamp(2rem,7vw,3.2rem);letter-spacing:-.01em}
h2{font-size:clamp(1.45rem,4.6vw,2rem)}
h3{font-size:1.2rem}
p{margin:0 0 1em}
a{color:inherit}
button{font:inherit;color:inherit}
img,svg{max-width:100%}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:0 18px}
.wide{max-width:1120px}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--cream);border-bottom:1px solid rgba(200,169,106,.35)}
.top .bar{display:flex;align-items:center;gap:12px;min-height:58px;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;flex:1}
.mono{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--gold);font-size:.95rem}
.brand-txt{min-width:0;line-height:1.15}
.brand-txt b{display:block;font-family:var(--serif);font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{flex:0 0 auto;background:transparent;border:1px solid rgba(244,238,225,.35);border-radius:999px;padding:7px 14px;color:var(--cream);cursor:pointer;font-size:.9rem}
.menu-btn:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav.drawer{display:none;border-top:1px solid rgba(244,238,225,.12);padding:6px 0 12px}
nav.drawer.open{display:block}
nav.drawer a,nav.drawer button{display:block;width:100%;text-align:left;padding:11px 2px;text-decoration:none;color:var(--cream);background:none;border:0;border-bottom:1px solid rgba(244,238,225,.08);cursor:pointer;font-size:1rem}
nav.drawer button.danger{color:#E9B8AE}
/* hero */
.hero{background:radial-gradient(1200px 400px at 85% -10%,rgba(200,169,106,.22),transparent 60%),var(--ink);color:var(--cream);padding:42px 0 46px}
.eyebrow{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px}
.byline{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:1.12rem;margin:-4px 0 18px}
.hero p.lead{font-size:1.08rem;color:rgba(244,238,225,.88);max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 24px;padding:0;list-style:none}
.chips li{border:1px solid rgba(200,169,106,.5);border-radius:999px;padding:5px 12px;font-size:.86rem;color:var(--cream)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--cream);text-decoration:none;cursor:pointer;font-weight:600;text-align:center;max-width:100%}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.hero .btn.ghost{color:var(--cream);border-color:rgba(244,238,225,.5)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.btn-row .btn{flex:1 1 180px}
.meter{height:8px;border-radius:999px;background:rgba(20,32,27,.12);overflow:hidden}
.hero .meter{background:rgba(244,238,225,.15)}
.meter i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .4s}
.meter-label{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:.86rem;margin:0 0 6px}
section.block{padding:38px 0 8px}
.section-head{margin-bottom:18px}
.section-head p{color:var(--muted);max-width:62ch}
/* module grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
a.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(20,32,27,.45)}
.mcard-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.num{font-family:var(--serif);font-size:.9rem;color:var(--gold-d);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.badge{font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:rgba(20,32,27,.07);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.prog{background:var(--warn-bg);color:#7A5A1E}
.card h3{margin-bottom:6px}
.card p.blurb{color:var(--muted);font-size:.95rem;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted);margin:6px 0 12px}
.dark-card,a.card.dark-card{background:var(--ink);color:var(--cream);border-color:var(--ink)}
#app{flex:1 0 auto}
.dark-card p.blurb{color:rgba(244,238,225,.8)}
.dark-card .num{color:var(--gold)}
/* rules */
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px;margin:0;padding:0;list-style:none}
.rules li{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:14px 16px;min-width:0}
.rules b.big{display:block;font-family:var(--serif);font-size:1.6rem;line-height:1.1;color:var(--ink)}
.rules span{display:block;font-size:.92rem;color:var(--muted)}
/* page header */
.phead{background:var(--ink);color:var(--cream);padding:28px 0 30px}
.phead .crumbs{font-size:.84rem;color:var(--gold);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px}
.phead .crumbs a{color:var(--gold)}
.phead p{color:rgba(244,238,225,.85)}
.phead h1{font-size:clamp(1.7rem,6vw,2.6rem)}
.phead .meter{background:rgba(244,238,225,.15);margin-top:14px}
main{padding-bottom:40px}
.content{padding-top:26px}
.content h2{margin-top:1.4em}
.content h3.sub{font-family:var(--sans);font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-d);margin:1.8em 0 .7em}
ul.clean,ol.clean{padding-left:1.2em;margin:0 0 1.2em}
ul.clean li,ol.clean li{margin-bottom:.55em;padding-left:.2em}
ul.clean li::marker{color:var(--gold-d)}
ol.clean li::marker{color:var(--gold-d);font-weight:700}
.objectives{list-style:none;padding:0;margin:0 0 10px}
.objectives li{position:relative;padding:10px 0 10px 34px;border-bottom:1px solid var(--line)}
.objectives li::before{content:"";position:absolute;left:4px;top:15px;width:16px;height:16px;border-radius:50%;border:2px solid var(--gold)}
.lesson-list{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:8px}
.lesson-list a{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;text-decoration:none;min-width:0}
.lesson-list .n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:700;background:rgba(20,32,27,.07)}
.lesson-list .seen .n{background:var(--ok);color:#fff}
.lesson-list .t{flex:1;min-width:0}
.lesson-list .go{flex:0 0 auto;color:var(--gold-d);font-weight:700}
.lesson-list .special{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.lesson-list .special .n{background:var(--gold);color:var(--ink)}
.lesson-list .special .go{color:var(--gold)}
.lesson-list .special .t small{display:block;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:2px}
.lesson-list .practice{background:transparent;border-style:dashed}
.card.locked{opacity:.66}
.badge.lock{background:rgba(20,32,27,.07);color:var(--muted)}
.test-end{background:var(--ink);color:var(--cream);border-radius:18px;padding:20px;margin:18px 0 8px}
.test-end .eb{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
.test-end h3{color:var(--cream);margin:.25em 0 .35em}
.test-end p{margin:0 0 14px;color:rgba(244,238,225,.85)}
.cert .c-note{font-size:.78rem;line-height:1.5;color:#4A554F;max-width:560px;margin:22px auto 0;padding-top:12px;border-top:1px solid var(--gold);font-style:italic}
.cert .c-note b{font-style:normal;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;color:var(--gold-d);display:block;margin-bottom:2px}
.notice{background:var(--paper);border:1px solid var(--gold);border-radius:14px;padding:14px 16px;margin:16px 0 0}
.notice b{display:block;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d);margin-bottom:4px}
.notice p{margin:0;font-size:.95rem}
/* lesson blocks */
.callout{border-radius:14px;padding:14px 16px;margin:0 0 1.2em;background:#EFE6D2;border-left:4px solid var(--gold)}
.callout.warn{background:var(--bad-bg);border-left-color:var(--bad)}
.callout.cue{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--ink)}
.callout b.ct{display:block;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.callout p{margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px;margin:0 0 1.4em}
.tcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.tcard h4{font-family:var(--sans);font-size:1rem;margin:0 0 8px;color:var(--ink)}
.tcard .hlabel{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-d);font-weight:700;margin-bottom:2px}
.tcard dl{margin:0}
.tcard dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:10px}
.tcard dd{margin:2px 0 0;font-size:.95rem}
figure.fig{margin:0 0 1.4em;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
figure.fig svg{display:block;width:100%;height:auto}
figure.fig figcaption{font-size:.88rem;color:var(--muted);margin-top:10px}
.fig-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-top:12px;font-size:.88rem}
.fig-legend div{min-width:0}
.fig-legend b{display:block}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ticks{display:grid;grid-template-columns:25% 35% 1fr auto;font-size:.76rem;color:var(--muted);margin-top:4px}
.flow{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.flow li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--cream);min-width:0}
.flow li b.step{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--gold);font-size:.85rem}
.flow li div{min-width:0}
.pager{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.pager .btn{flex:1 1 160px}
.takeaways{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:10px;counter-reset:t}
.takeaways li{counter-increment:t;display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.takeaways li::before{content:counter(t);flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--ink);font-weight:700;font-size:.85rem}
/* quiz */
.qhead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted);margin-bottom:8px}
.qstem{font-family:var(--serif);font-size:1.28rem;line-height:1.35;margin:14px 0 18px}
.opts{display:grid;gap:10px;margin-bottom:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;line-height:1.45;min-width:0}
.opt .l{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:rgba(20,32,27,.07)}
.opt .tx{flex:1;min-width:0}
.opt:hover:not([disabled]){border-color:var(--gold)}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.sel .l{background:var(--ink);color:var(--cream)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:14px 16px;margin-bottom:16px}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.fb.no{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb.neutral{background:#EFE6D2;border-left:4px solid var(--gold)}
.fb b{display:block;margin-bottom:4px}
.fb p{margin:0}
textarea{width:100%;min-height:120px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:12px 14px;font:inherit;font-size:1rem;resize:vertical;margin-bottom:12px}
input[type=text]{width:100%;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:12px 14px;font:inherit;min-height:48px}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:10px 0 18px}
.ring{flex:0 0 auto;width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:1.9rem;font-weight:700}
.ring.pass{background:conic-gradient(var(--ok) var(--p),rgba(20,32,27,.1) 0)}
.ring.fail{background:conic-gradient(var(--bad) var(--p),rgba(20,32,27,.1) 0)}
.ring span{width:84px;height:84px;border-radius:50%;background:var(--cream);display:grid;place-items:center}
.score > div:not(.ring){min-width:0;flex:1 1 200px}
.review{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.review li{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.review .rq{font-weight:600;margin-bottom:6px}
.review .ra{font-size:.94rem}
.review .ok{color:var(--ok);font-weight:700}
.review .no{color:var(--bad);font-weight:700}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;cursor:pointer}
.toggle input{width:22px;height:22px;flex:0 0 auto;margin-top:2px;accent-color:var(--ink)}
.timer{position:sticky;top:58px;z-index:10;background:var(--gold);color:var(--ink);font-weight:700;text-align:center;padding:6px 10px;font-size:.92rem}
.timer.low{background:var(--bad);color:#fff}
.selfmark{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.selfmark .btn{flex:1 1 120px}
/* checklist */
.check{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:8px}
.check li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);min-width:0}
.check li i{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.8rem;background:rgba(20,32,27,.1)}
.check li.done i{background:var(--ok);color:#fff}
.check li div{min-width:0;flex:1}
/* certificate */
.cert{background:#FFFDF8;color:var(--ink);border-radius:6px;padding:10px;margin:20px 0;box-shadow:0 20px 40px -24px rgba(20,32,27,.5)}
.cert-in{border:2px solid var(--gold);outline:1px solid var(--gold);outline-offset:-8px;padding:clamp(22px,6vw,56px) clamp(16px,5vw,48px);text-align:center}
.cert .mono{margin:0 auto 14px;width:54px;height:54px;font-size:1.3rem;color:var(--gold-d);border-color:var(--gold-d)}
.cert .c-eyebrow{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d);font-weight:700}
.cert h2{font-size:clamp(1.6rem,6vw,2.6rem);margin:.3em 0 .4em}
.cert .c-name{font-family:var(--serif);font-size:clamp(1.6rem,7vw,2.6rem);font-style:italic;border-bottom:1px solid var(--gold);display:inline-block;padding:0 12px 4px;margin:6px 0 14px;max-width:100%}
.cert .c-course{font-family:var(--serif);font-weight:700;font-size:1.15rem}
.cert .c-foot{display:flex;flex-wrap:wrap;justify-content:space-around;gap:16px;margin-top:28px;font-size:.9rem}
.cert .c-foot div{min-width:140px}
.cert .c-foot b{display:block;font-family:var(--serif);font-size:1.05rem;border-top:1px solid var(--line);padding-top:6px}
footer.foot{background:var(--ink);color:rgba(244,238,225,.75);padding:26px 0 34px;font-size:.9rem;margin-top:30px}
footer.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== about Josh / meet your coach ===== */
.about-coach{padding:38px 0 8px}
.about-panel{display:grid;gap:22px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,28px);align-items:center}

.btn{transition:background-color .18s,border-color .18s,color .18s,transform .18s,box-shadow .18s}

.btn .ic{width:1.1em;height:1.1em}

/* hero */
.hero{position:relative;overflow:hidden;padding:46px 0 50px;background:radial-gradient(900px 420px at 92% -12%,rgba(200,169,106,.26),transparent 62%),radial-gradient(700px 380px at -10% 110%,rgba(200,169,106,.10),transparent 60%),var(--ink)}
.hero-grid{display:grid;gap:30px;align-items:center}
.hero h1{font-size:clamp(2.3rem,9vw,4rem);letter-spacing:-.015em;margin-bottom:.25em}

.hero-card{background:linear-gradient(160deg,rgba(244,238,225,.07),rgba(244,238,225,.02));border:1px solid rgba(200,169,106,.38);border-radius:var(--r-lg);padding:22px;min-width:0}
.hero-card .hc-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.hero-card .hc-head svg{width:52px;height:52px;flex:0 0 auto}
.hero-card .hc-head b{display:block;font-family:var(--serif);font-size:1.15rem;color:var(--cream)}
.hero-card .hc-head span{display:block;font-size:.82rem;color:rgba(244,238,225,.7)}
.hc-stats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hc-stats li{border-top:1px solid rgba(200,169,106,.3);padding-top:10px;min-width:0}
.hc-stats b{display:block;font-family:var(--serif);font-size:1.6rem;line-height:1.1;color:var(--gold)}
.hc-stats span{display:block;font-size:.84rem;color:rgba(244,238,225,.78)}
.hero-card .hc-note{margin:16px 0 0;font-size:.82rem;line-height:1.5;color:rgba(244,238,225,.7);display:flex;gap:8px}
.hero-card .hc-note .ic{color:var(--gold);margin-top:2px}
@media (min-width:900px){.hero{padding:76px 0 80px}.hero-grid{grid-template-columns:minmax(0,1.35fr) minmax(0,.9fr);gap:56px}}
/* section heads */
section.block{padding:52px 0 10px}
.section-head{margin-bottom:24px}
.section-head .eyebrow{margin-bottom:8px}
.section-head h2{margin-bottom:.35em}
/* module cards */

/* rules */
.rules li{border-radius:var(--r-md);padding:16px 18px}

/* module test intro + end panel */
.test-end{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:24px;background:radial-gradient(500px 200px at 100% 0,rgba(200,169,106,.22),transparent 60%),var(--ink)}

.tstats{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.tstats li{background:var(--cream);border-radius:var(--r-md);padding:14px 16px;min-width:0}
.tstats .ic{color:var(--gold-d);width:22px;height:22px;display:block;margin-bottom:6px}
.tstats b{display:block;font-family:var(--serif);font-size:1.5rem;line-height:1.1}
.tstats span{display:block;font-size:.86rem;color:var(--muted)}
.test-hero p{margin:0 0 4px}
/* results */
.result-card{border-radius:var(--r-lg);padding:24px;margin:8px 0 18px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}

.result-card .rc-eb{display:flex;align-items:center;gap:8px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold-d);margin-bottom:6px}
.result-card.fail .rc-eb{color:var(--bad)}
.result-card h2{margin:0 0 .3em}

.ring{width:118px;height:118px}
.ring span{width:90px;height:90px;background:#FFFDF8}

.opt{transition:border-color .15s,background-color .15s,box-shadow .15s}
.qstem{font-size:clamp(1.2rem,4.2vw,1.42rem)}
/* certificate */
.cert{padding:12px;border-radius:8px;background:#FFFDF8;box-shadow:0 30px 60px -30px rgba(20,32,27,.55)}
.cert-in{position:relative;border:2px solid var(--gold);outline:1px solid var(--gold);outline-offset:-9px;background:radial-gradient(600px 300px at 50% 0,rgba(200,169,106,.12),transparent 70%);padding:clamp(30px,7vw,60px) clamp(18px,6vw,56px)}

<script>
const DATA = {"modules": [{"id": "role", "title": "The Role of the Personal Trainer", "short": "Role & professionalism", "hours": 1.5, "blurb": "What great trainers actually do, where the professional line sits, and how to earn trust from the first conversation.", "objectives": ["Describe the core responsibilities of a personal trainer across the client journey.", "State a personal trainer’s scope of practice clearly, including what a trainer must not say or do.", "Apply professional standards for consent, touch, confidentiality and communication.", "Explain why evidence-based practice, a referral network and continuing education protect clients and your career."], "lessons": [{"title": "What a personal trainer does", "blocks": [{"t": "p", "x": "A personal trainer helps apparently healthy people, and people cleared by a clinician, become fitter, stronger and more confident through safe, effective exercise. The job is far more than counting reps. Across the client journey you will:"}, {"t": "ol", "items": ["**Consult and screen**: learn the person’s goals, history and readiness, and check whether exercise needs medical clearance first.", "**Assess**: observe posture and movement and record baseline measures that matter to the goal.", "**Design**: build a programme that fits the person’s goal, experience, schedule and preferences.", "**Coach**: teach technique, cue clearly, choose regressions and progressions, and manage effort session by session.", "**Review and progress**: track results, adjust the plan, and keep the client motivated over months, not just weeks.", "**Refer**: recognise when something sits outside your role and hand it to the right professional."]}, {"t": "callout", "title": "The standard to aim for", "x": "A great trainer sees a movement, describes it accurately, chooses a sensible next step, and recognises the moment that next step is no longer theirs.", "kind": "tip"}]}, {"title": "Scope of practice", "blocks": [{"t": "p", "x": "Scope of practice is the boundary of what your training and qualification allow you to do. Staying inside it protects the client, protects you, and builds trust with the clinicians who will send you clients."}, {"t": "p", "x": "Personal trainers observe movement, coach technique, modify load and range, deliver the methods they are trained in, and refer when something sits outside that role. They do not diagnose medical conditions, interpret imaging, claim to ‘fix’ discs, nerves or fascia, or provide rehabilitation for an unresolved injury."}, {"t": "cards", "hdr": ["Trainers do", "Trainers do not"], "rows": [["Observe movement and describe it accurately", "Diagnose injuries, diseases or ‘imbalances’ as medical facts"], ["Coach technique, dose (load, range, speed, volume) and regressions", "Provide rehabilitation for an unresolved clinical injury, or contradict a treating clinician’s restrictions"], ["Deliver assisted stretching and the class formats they are already trained to teach, within those methods", "Claim to ‘release a nerve’, ‘put a disc back’, or ‘cure’ plantar fascia, a cuff tear or scoliosis"], ["Identify red flags and refer", "Interpret MRI or X-ray reports for a client, or recommend that they ignore medical advice"], ["Communicate clearly with your employer or colleagues and, with the client’s permission, with the client’s clinician", "Guess out loud in front of a client to save face"]]}, {"t": "callout", "title": "Words matter", "x": "Never say ‘it is only muscle’ about a worrying set of symptoms, and never say ‘I think you have a disc herniation’. Describe what you observed and say ‘these signs mean you need to be seen by a doctor’.", "kind": "warn"}]}, {"title": "Professional standards, consent and touch", "blocks": [{"t": "p", "x": "Some practice drills in this course involve observing a partner and, in a few, palpating bony landmarks and muscle bellies. Whether you practise with a training partner or work with a client, always obtain clear consent, explain what you will do and why, stay with the landmarks covered in that lesson, and stop at once if the person asks you to. Offer a same-gender practitioner where that is preferred, and follow your workplace’s privacy and professional-touch policies. This is not an optional courtesy; it is part of professional practice."}, {"t": "callout", "title": "If a drill reproduces your own pain", "x": "Stop the drill, choose a regression or a different role (observer or coach), and do not work through sharp, radiating or unfamiliar pain in order to ‘complete the task’. The same rule is the one we want to use with clients.", "kind": "warn"}, {"t": "h", "x": "Confidentiality and records"}, {"t": "ul", "items": ["Health information is private. Store screening forms and notes securely and share them only with the client’s permission (or where the law requires it).", "Keep brief, factual session notes: what you did, how the client responded, anything unusual, and any incident.", "Never discuss one client’s health, body or progress with another client, including on social media."]}, {"t": "h", "x": "Professional conduct"}, {"t": "ul", "items": ["Be punctual, prepared and present: phone away, attention on the client.", "Dress and speak professionally; avoid comments about a client’s body that are not about the agreed goal.", "Keep clear boundaries in personal relationships and in messaging.", "Follow your facility’s policies on emergencies, incidents, payments and cancellations."]}]}, {"title": "Communication and coaching skills", "blocks": [{"t": "p", "x": "Clients remember how you made them feel long before they remember a cue. Strong communication is a core technical skill, not a soft extra."}, {"t": "ul", "items": ["**Listen more than you talk**: open questions (‘What would make the next three months a success for you?’) reveal more than yes/no questions.", "**Reflect back**: summarise what you heard so the client knows you understood.", "**Cue simply**: one or two cues at a time; external cues (‘push the floor away’) often work better with clients than internal muscle-by-muscle instructions.", "**Demonstrate, then let them try**: show the movement, give one cue, observe, then give feedback.", "**Give specific feedback**: name what was good, then one thing to change.", "**Use plain language with clients**: save anatomical terms for colleagues unless a client wants the detail."]}]}, {"title": "Evidence, qualifications and growth", "blocks": [{"t": "ul", "items": ["**Evidence-based practice** combines the best available research, your professional experience and the client’s values and preferences. Settle factual disagreements with recognised textbooks and position stands, not social-media infographics.", "**Keep core certifications current**: in most settings this means an accredited PT qualification plus valid CPR/AED and first-aid training. This online course builds your knowledge, but it is not itself an accredited qualification.", "**Professional insurance**: check what your employer covers and what you need if you train clients independently.", "**Continuing education**: anatomy, programming, special populations and coaching skills all develop throughout a career.", "**Build a referral network**: doctors, physiotherapists, registered dietitians and mental-health professionals you can point clients to."]}, {"t": "callout", "title": "Know what you do not know", "x": "If you are unsure, say so, and look it up after the session. Guessing out loud in front of a client to save face is unprofessional and can be unsafe.", "kind": "tip"}]}], "takeaways": ["A trainer consults, assesses, designs, coaches, reviews and refers.", "Scope of practice: observe, coach, modify and refer; never diagnose, interpret imaging or treat injuries.", "Consent before touch, confidentiality always, and clear professional boundaries.", "Communicate simply, listen actively and give specific feedback.", "Keep certifications (including CPR/AED) current and build a referral network."], "quiz": [{"q": "Which statement correctly describes the personal trainer’s scope of practice?", "options": ["Trainers observe movement, coach technique, modify load and range, deliver assisted stretching within their training, and refer when a presentation sits outside that role.", "Trainers may diagnose a ligament tear from the client’s description, provided they have completed an anatomy course like this one.", "Trainers may read and explain a client’s MRI report, as long as they then refer the client to a physiotherapist for treatment.", "Trainers may tell a client to ignore a physiotherapist’s restrictions if the client feels well today."], "answer": 0, "explain": "Trainers observe, coach, modify, deliver what they are trained in, and refer. They do not diagnose or interpret imaging.", "src": "q6.4"}, {"q": "Which task is inside a personal trainer’s scope of practice?", "options": ["Diagnosing a rotator-cuff tear from a client’s description", "Adjusting load and range of motion when a client reports mild, settling discomfort", "Telling a client to stop medication prescribed by their doctor", "Interpreting an X-ray report for a client"], "answer": 1, "explain": "Modifying load and range for mild, mechanical discomfort is core trainer work. Diagnosis, medication advice and imaging interpretation belong to clinicians."}, {"q": "Before palpating a landmark on a client, you should:", "options": ["Begin, then ask if it is okay", "Only ask if the client looks uncomfortable", "Explain what you will do and why, and get clear consent", "Skip consent if you have trained them before"], "answer": 2, "explain": "Consent is obtained every time before touch: explain what and why, stay with the agreed area, and stop immediately if asked."}, {"q": "A client tells you about a health condition during a session. What is the professional approach to that information?", "options": ["Share it with other trainers so everyone knows", "Ignore it so you do not need to record it", "Post a general update about it on social media", "Keep it confidential and record only what is relevant, stored securely"], "answer": 3, "explain": "Health information is confidential. Record what is relevant to safe training, store it securely, and share it only with permission or where required."}, {"q": "Which statement best describes evidence-based practice?", "options": ["Combining the best available research, professional expertise and the client’s values", "Following the newest research findings exactly, whatever the client prefers", "Using the methods most popular with experienced coaches online", "Repeating the programme you used for yourself"], "answer": 0, "explain": "Evidence-based practice integrates research, practitioner experience and client values and preferences."}, {"q": "Which cue is the best example of an external cue?", "options": ["“Contract your gluteus maximus”", "“Push the floor away”", "“Activate your transversus abdominis”", "“Fire your quads”"], "answer": 1, "explain": "External cues focus on the effect on the environment (the floor, a bar, a wall). They often produce cleaner movement than cues that ask a client to micromanage one muscle."}, {"q": "A client asks whether their back pain means they have a slipped disc. The best response is:", "options": ["“Yes, that sounds like a disc. We’ll stretch it out.”", "“It’s almost certainly muscular, so we’ll carry on as planned and see how it feels.”", "“I can’t diagnose that. Let’s keep training comfortable today, and a doctor or physiotherapist can assess it properly.”", "“Let’s test it with a few heavy deadlifts and see whether the pain gets worse.”"], "answer": 2, "explain": "Stay inside scope: do not diagnose or dismiss. Modify training sensibly and refer for assessment."}, {"q": "Which certification is most commonly expected alongside a personal-training qualification?", "options": ["A massage licence", "A physiotherapy licence", "A dietetics degree", "Valid CPR/AED and first-aid training"], "answer": 3, "explain": "Most employers and accrediting bodies expect current CPR/AED (and usually first-aid) certification alongside a PT qualification."}, {"q": "You do not know the answer to a client’s anatomy question. What should you do?", "options": ["Say you are not sure, then check a reliable source and follow up", "Change the subject", "Guess confidently so you look knowledgeable", "Tell them the question is not important"], "answer": 0, "explain": "Admitting uncertainty and following up with a reliable source builds trust and keeps information accurate."}], "num": 1}, {"id": "anat1", "title": "Anatomy I: The Language of Movement", "short": "Language of movement", "hours": 2.5, "blurb": "Speak the language every great coach shares: anatomical position, planes and axes, joint actions, tissues and how muscle makes force.", "objectives": ["Describe the anatomical position and use directional terms (anterior/posterior, medial/lateral, proximal/distal, superficial/deep, ipsilateral/contralateral) accurately.", "Name the three cardinal planes and their corresponding axes, and match common gym exercises to the correct plane and axis.", "Define the main joint-action terms used in coaching, including those unique to the forearm, foot and scapula.", "Distinguish the four primary tissue types, with extra attention to muscle and to the connective tissues trainers load every day (bone, cartilage, ligament, tendon, fascia).", "Explain concentric, eccentric and isometric muscle action using a squat, a reformer spring and an indoor-cycling climb as examples."], "intro": "Treat this as a shared language, not a vocabulary test. The goal is that two trainers watching the same lunge, chaturanga or pedal stroke describe it in the same terms.", "lessons": [{"title": "Anatomical position and directional terms", "blocks": [{"t": "p", "x": "The anatomical position is the reference posture from which every directional term and joint action is named: standing upright, head facing forward, eyes looking ahead, arms relaxed at the sides, palms facing forward (forearms supinated), fingers extended, feet parallel or only slightly apart with the toes pointing forward. This is not how clients stand when they train. It is the zero point that keeps ‘medial’, ‘lateral’, ‘flexion’ and ‘rotation’ from drifting when a person is prone on a reformer, seated on a bike or inverted in downward-facing dog."}, {"t": "p", "x": "Directional terms to master:"}, {"t": "ul", "items": ["Anterior / posterior: towards the front or back of the body.", "Superior / inferior: towards the head or towards the feet (in the trunk; in the limbs, prefer proximal and distal).", "Medial / lateral: towards or away from the midline.", "Proximal / distal: nearer to or further from the root of the limb (the hip or the shoulder).", "Superficial / deep: closer to or further from the body surface.", "Ipsilateral / contralateral: on the same side or the opposite side of the body.", "Unilateral / bilateral: one side or both sides.", "Palmar / dorsal (hand); plantar / dorsal (foot): the palm or sole versus the back of the hand or the top of the foot."]}]}, {"title": "Planes and axes", "blocks": [{"t": "p", "x": "A plane is an imaginary flat surface that divides the body. An axis is an imaginary line around which rotation occurs. Movement in a given plane takes place around the axis that is perpendicular to that plane."}, {"t": "svg", "name": "planes", "cap": "Each plane divides the body; movement in a plane turns around the axis perpendicular to it."}, {"t": "cards", "hdr": ["Plane", "How it divides the body", "Axis (perpendicular to the plane)", "Typical actions", "Examples"], "rows": [["Sagittal (mid-sagittal if it splits left and right halves equally; otherwise para-sagittal)", "Left and right portions", "Frontal (also called mediolateral or coronal) axis", "Flexion and extension; dorsiflexion and plantarflexion at the ankle", "Squat, hip hinge, lunge (primarily), seated indoor-cycling climb, Pilates reformer footwork, yoga forward fold, most spinal articulation in mat Pilates"], ["Frontal (coronal)", "Anterior and posterior portions", "Sagittal (anteroposterior) axis", "Abduction and adduction; lateral flexion of the spine; inversion and eversion at the foot (simplified teaching)", "Side-lying glute series on the mat, standing abduction, lateral lunge, side bend"], ["Transverse (horizontal)", "Superior and inferior portions", "Vertical (longitudinal) axis", "Internal (medial) and external (lateral) rotation; horizontal abduction and adduction; forearm pronation and supination", "Seated or standing rotation, wood-chop, yoga twists, humeral rotation during a row, bicycle set-up checks for hip rotation"]]}, {"t": "p", "x": "Most gym-floor movements are multiplanar. A walking lunge is mainly sagittal, but the stance hip has to control frontal-plane drop (adduction) and transverse-plane collapse (internal rotation). Teach the primary plane first, then name the control that stops the other two planes from leaking. Circumduction (arm circles, hip circles) is not a single-axis action; it is a sequential combination of flexion, abduction, extension and adduction that traces a cone."}]}, {"title": "Joint-action terms every coach must share", "blocks": [{"t": "p", "x": "Use these terms exactly. ‘Open the hip’ or ‘close the chain’ can stay as coaching colour, but the anatomical name should sit underneath them."}, {"t": "cards", "hdr": ["Action", "Plain meaning", "Where trainers will use it"], "rows": [["Flexion / extension", "Decreasing / increasing the angle between two segments in the sagittal plane. At the shoulder and hip, flexion carries the limb forward of the anatomical position; extension carries it back.", "Squat, hinge, spinal articulation, biceps curl, indoor cycling hip angle."], ["Abduction / adduction", "Moving away from / towards the midline in the frontal plane. At the fingers and toes this is relative to the middle finger or second toe. Scapular abduction is usually called protraction.", "Side-lying series, cable abduction, standing hip control in a lunge or sandbag lunge."], ["Internal (medial) / external (lateral) rotation", "Rotation towards / away from the midline around a vertical or segmental long axis.", "Femoral control in the squat; humeral rotation in a row or overhead reach."], ["Horizontal abduction / adduction", "Moving the already-flexed (usually 90°) arm away from / across the midline in the transverse plane.", "Chest fly, reverse fly, some reformer arm work."], ["Dorsiflexion / plantarflexion", "Bringing the dorsum of the foot towards the tibia / pointing the foot away from the tibia.", "Squat ankle demand; pedal stroke; reformer footbar work; downward-facing dog."], ["Inversion / eversion", "Tilting the sole towards / away from the midline, occurring mainly at the subtalar and related joints of the foot.", "Single-leg stability, ankle-sprain history, assisted stretching foot and lower-leg sequences."], ["Pronation / supination (forearm)", "Radius crossing over the ulna (palm facing backward from the anatomical position, or down with the elbow bent) / radius and ulna lying parallel (palm forward, or up with the elbow bent).", "Biceps versus brachialis work; gripping an indoor-bike handlebar or a farmer’s-carry handle."], ["Pronation / supination (foot)", "Triplanar, coupled motions. Pronation combines eversion, abduction and dorsiflexion; supination combines inversion, adduction and plantarflexion. Do not treat them as synonyms for eversion and inversion.", "Gait, landing mechanics, bike-shoe set-up conversations. Stay descriptive; do not diagnose a ‘pronation problem’."], ["Elevation / depression", "Scapula (or mandible, or ribs) moving superiorly / inferiorly.", "Shrugging on the bike or during a carry; cueing ‘heavy shoulders’ as scapular depression without dumping the chest."], ["Protraction / retraction", "Scapula gliding anteriorly around the ribcage / gliding posteriorly towards the spine. Also used at the mandible and, less precisely, the head.", "Push-up plus (serratus), rowing finish, reformer long stretch."], ["Upward / downward rotation (scapula)", "The glenoid cavity turning upward (to allow overhead work) / turning downward (as the arms are pulled down from overhead in a pull-up or pulldown).", "Overhead press, pull-up or pulldown, wall balls, chaturanga-to-up-dog transitions."], ["Anterior / posterior pelvic tilt", "The top of the pelvis (ASIS) tipping forward and down, usually with increased lumbar lordosis / the ASIS tipping backward and up, usually flattening the lumbar curve.", "Hinge set-up, abdominal work, bike posture, ‘tuck versus arch’ cues on the reformer."], ["Lateral flexion", "Side-bending of the spine in the frontal plane.", "Side bend, oblique work, checking that a ‘core’ drill is not just a side crunch."], ["Opposition (thumb)", "Thumb pad meeting the pad of another finger.", "Grip quality on kettlebells, reformer straps and farmer’s carries."]]}]}, {"title": "Tissue types", "blocks": [{"t": "p", "x": "The four primary tissue types are epithelial, connective, muscle and nervous tissue. Trainers do not need histology in depth. They do need to know what they are loading."}, {"t": "cards", "hdr": ["Tissue", "What it is", "Why it matters"], "rows": [["Epithelial", "Covering and lining tissue (skin surface, lining of the gut and airways, glandular tissue). Highly cellular, avascular, renews quickly.", "Relevant mainly as skin integrity: friction from Pilates reformer straps, bike saddles, sandbags and sled handles. Not a coaching focus this module."], ["Connective — bone", "Mineralised connective tissue. Compact bone externally, cancellous (spongy) bone internally. Cells: osteoblasts, osteocytes, osteoclasts. Adapts to load (Wolff’s law).", "Strength work is also bone work. Sudden spikes in running or jumping volume (race-style conditioning blocks, plyometrics) are a common path to bone-stress injuries."], ["Connective — cartilage", "Hyaline cartilage covers synovial joint surfaces (low friction, no blood supply, limited healing). Fibrocartilage forms menisci, labra, intervertebral discs and the pubic symphysis. Elastic cartilage is found in the ear and epiglottis.", "Deep squat and loaded knee work compress hyaline cartilage and the menisci — usually well tolerated when load progresses. Do not promise that exercise ‘heals cartilage’ in a specific joint."], ["Connective — dense regular (tendon and ligament)", "Type I collagen arranged in parallel. Tendons connect muscle to bone and transmit force. Ligaments connect bone to bone and restrain excess joint motion. Both have relatively poor blood supply and remodel slowly.", "Tendons adapt to progressive loading over months, not sessions. Ligament sprains (especially the anterior talofibular ligament at the ankle) need medical clearance and a staged return; they are not ‘just tight calves’."], ["Connective — fascia", "A continuous connective-tissue network: superficial fascia beneath the skin, deep fascia wrapping muscles (and forming septa, aponeuroses and retinacula), and visceral fascia. Rich in sensory nerve endings.", "This is the tissue conversation underneath assisted stretching and under many Pilates ‘integration’ cues. Module 4 develops fascial lines. In this module, treat fascia as a load-sharing, sensory connective tissue — not as a miracle explanation for every restriction."], ["Muscle", "Skeletal (voluntary, striated, attached via tendons), cardiac and smooth. Skeletal muscle generates force through actin–myosin cross-bridges, organised in motor units.", "Almost every cue you give is a skeletal-muscle cue. Cardiac and smooth muscle sit outside the coaching brief except as a reason to take chest pain, unusual breathlessness or dizziness seriously (Module 10)."], ["Nervous", "Neurons and supporting glial cells. The central nervous system (brain and spinal cord) and peripheral nervous system (cranial and spinal nerves) plan, drive and sense movement.", "Motor control and proprioception are developed in Module 4. In this module, note that a ‘tight’ muscle is sometimes a nervous-system protection strategy, not a short piece of string."]]}]}, {"title": "How skeletal muscle produces force — coaching essentials", "blocks": [{"t": "ul", "items": ["Concentric: Shortening under load (the up-phase of a squat for the glutes and quadriceps; the pulling phase of a row for the latissimus dorsi).", "Eccentric: Lengthening under load (the lowering phase of a squat; the descent of a hinge; the return of a reformer carriage under spring tension). Eccentric capacity is often where clients fail first, and where tendinopathy programmes do a lot of their work.", "Isometric: Producing force without a change in muscle length (a well-braced plank; the spinal extensors holding a neutral hinge; a paused wall-sit)."]}, {"t": "p", "x": "A muscle can only pull; it cannot push. Joints ‘push’ because one muscle group pulls on the far side of the joint, or because the limb pushes against the floor, a pedal or a reformer footbar. The length–tension relationship means a muscle produces less active force when it is put in a very shortened or a very lengthened position. The force–velocity relationship means concentric force drops as speed rises, while eccentric force can be high. These two ideas explain why a slow deep lunge, a paused hinge and a fast wall-ball cycle feel like different tasks even when the joints look similar."}, {"t": "callout", "title": "Think it through", "x": "Ask yourself: ‘In a seated indoor-cycling climb, what is the primary plane at the hip? What contraction type is the quadriceps performing as the pedal goes down? What are the spinal extensors doing?’ Answer: sagittal plane; concentric on the downstroke (and a more complex cycle through the rest of the stroke); isometric to hold the torso."}]}, {"title": "Practice drills", "blocks": [{"t": "p", "x": "Work through these drills with a training partner where one is needed. On your own, use a mirror or film yourself. Times are guides only."}, {"t": "ol", "items": ["Anatomical position reset (3 minutes): Pairs stand their partner in anatomical position and then in a natural standing posture. Name five things that changed (palm facing, femoral rotation, pelvic tilt, head position, scapular rest).", "Plane call-outs (8 minutes): A partner names a common gym exercise (bodyweight squat, side-lying abduction, wood-chop, chaturanga, seated indoor-cycling climb, farmer’s carry walk). Pairs have 20 seconds to name the primary plane, the axis and the main joint actions. Fast debrief after each.", "Action library on the floor (8 minutes): One partner moves; the other must cue using only anatomical action terms — no ‘up’, ‘down’, ‘squeeze’ or ‘open’. Swap. The listening partner notes any term that was used loosely.", "Tissue touch (6 minutes), consent first. On self or a consenting partner’s forearm and lower leg, distinguish skin, a muscle belly (for example gastrocnemius), a tendon (Achilles or distal biceps) and a subcutaneous bony surface (shin or olecranon). Name which tissue is being loaded in a calf raise versus a biceps isometric hold."]}, {"t": "h", "x": "Practice tasks"}, {"t": "ul", "items": ["Write anatomical-position and directional-term flashcards, including ipsilateral/contralateral and proximal/distal.", "Photograph or sketch three common gym exercises (one each from a sagittal, frontal and transverse emphasis). Label the primary plane, axis and joint actions. Keep the notes for revision.", "In your next two sessions (with a client or a training partner), replace one vague cue with an anatomical one, and note whether the movement changed.", "Read, if you have access, the introductory chapters on anatomical terminology in Gray’s Anatomy for Students or the equivalent opening plates in Netter’s Atlas of Human Anatomy."]}]}, {"title": "On the gym floor", "blocks": [{"t": "ul", "items": ["Pilates (mat and reformer): Cues such as ‘articulate through the spine’ and ‘keep the pelvis still while the femur flexes’ become precise once flexion, extension and pelvic tilt are named correctly.", "Yoga: A sun salutation is a sagittal series; warrior poses add frontal- and transverse-plane hip work; twists are transverse-plane spinal rotation stacked over whatever the pelvis is doing.", "Indoor cycling: The pedal stroke is sagittal at the hip, knee and ankle; the torso should be a relatively isometric hold, not repeated lumbar flexion.", "Functional fitness and small-group PT: Sandbag lunges, sleds and wall balls are multiplanar under fatigue. Naming the leak (usually frontal-plane knee or pelvic control) is the first coaching step.", "Assisted stretching: This module’s language stops a session being described only as ‘opening the fascia’. Name the joint, the direction you are moving it, and the tissue you intend to load or lengthen."]}]}], "takeaways": ["Name every movement from the anatomical position: palms forward, feet forward.", "Sagittal plane = flexion/extension; frontal = abduction/adduction; transverse = rotation.", "Most gym movements are multiplanar: name the main plane, then the control that stops the others leaking.", "Four tissue types: epithelial, connective, muscle and nervous. Know what you are loading.", "Concentric shortens, eccentric lengthens, isometric holds; a muscle can only pull."], "quiz": [{"q": "In the anatomical position, which of the following is correct?", "options": ["The palms face the thighs.", "The palms face anteriorly and the feet point forward.", "The palms face posteriorly.", "The arms are abducted to 90° with the palms facing the floor."], "answer": 1, "explain": "In the anatomical position the palms face forward (forearms supinated) and the feet point forward. It is the reference posture for all directional terms.", "src": "q1.1"}, {"q": "Hip abduction occurs primarily in which plane and around which axis?", "options": ["Sagittal plane, around a frontal (mediolateral) axis", "Transverse plane, around a vertical axis", "Frontal (coronal) plane, around a sagittal (anteroposterior) axis", "Frontal plane, around a vertical axis"], "answer": 2, "explain": "Abduction happens in the frontal plane, around the sagittal (anteroposterior) axis, which is perpendicular to that plane.", "src": "q1.2"}, {"q": "Which term describes bringing the dorsum of the foot towards the tibia?", "options": ["Plantarflexion", "Inversion", "Eversion", "Dorsiflexion"], "answer": 3, "explain": "Dorsiflexion brings the top (dorsum) of the foot towards the shin; plantarflexion points the foot away.", "src": "q1.3"}, {"q": "Tendons and most ligaments are composed primarily of:", "options": ["Dense regular connective tissue, rich in type I collagen", "Elastic cartilage", "Epithelial tissue", "Hyaline articular cartilage"], "answer": 0, "explain": "Tendons and ligaments are dense regular connective tissue: type I collagen fibres arranged in parallel.", "src": "q1.4"}, {"q": "Turning the head to look over one shoulder occurs primarily in the:", "options": ["Sagittal plane", "Transverse plane", "Frontal plane", "Only in an oblique plane; it cannot be named"], "answer": 1, "explain": "Turning the head is rotation around a vertical axis, which happens in the transverse plane.", "src": "q1.5"}, {"q": "During the lowering phase of a squat, the quadriceps are working:", "options": ["Concentrically", "Only as an antagonist with no force", "Eccentrically", "Isometrically, staying the same length throughout"], "answer": 2, "explain": "As the knees bend under load on the way down, the quadriceps lengthen while producing force: an eccentric action.", "src": "q1.6"}, {"q": "Define the anatomical position in two or three sentences.", "type": "sa", "model": "Standing upright, facing forward, eyes looking ahead, arms at the sides, palms facing forward (forearms supinated), fingers extended, feet parallel or slightly apart with toes pointing forward. It is the reference posture from which directional terms and joint actions are named.", "src": "q1.7"}, {"q": "Name the three cardinal planes. For each plane, give one common gym exercise that occurs primarily in that plane.", "type": "sa", "model": "Sagittal, frontal (coronal) and transverse (horizontal). Examples (any accurate match): sagittal — squat, hinge, indoor cycling seated climb, reformer footwork; frontal — side-lying abduction, lateral lunge, side bend; transverse — wood-chop, yoga twist, rotation drills.", "src": "q1.8"}, {"q": "Distinguish a tendon from a ligament by attachment and function.", "type": "sa", "model": "A tendon connects muscle to bone and transmits contractile force. A ligament connects bone to bone and restrains excess motion at a joint. Both are dense regular connective tissue, but their attachments and roles differ.", "src": "q1.9"}, {"q": "A client performs a standing biceps curl. Name the plane of motion and the joint action at the elbow during the lifting phase. Name the contraction type of biceps brachii in that phase.", "type": "sa", "model": "Sagittal plane; elbow flexion; concentric action of biceps brachii (brachialis is also an acceptable extra).", "src": "q1.10"}, {"q": "Using anatomical terms of position, the elbow is ___ to the wrist.", "options": ["Superficial", "Distal", "Lateral", "Proximal"], "answer": 3, "explain": "Proximal means closer to the trunk or the point of attachment of a limb. The elbow is nearer the shoulder than the wrist, so it is proximal to the wrist; the wrist is distal to the elbow.", "src": "review"}, {"q": "Which of these is a combination of movements rather than a single action about one axis?", "options": ["Circumduction", "Flexion", "Abduction", "Medial rotation"], "answer": 0, "explain": "Circumduction traces a cone by combining flexion, abduction, extension and adduction in sequence (for example arm circles at the shoulder). Flexion, abduction and rotation each occur about a single axis.", "src": "review"}], "num": 2}, {"id": "anat2", "title": "Anatomy II: Bones, Joints & Muscles", "short": "Bones, joints & muscles", "hours": 5, "blurb": "Map the skeleton, understand how joints move, and learn the muscles behind every squat, hinge, lunge, push and pull.", "objectives": ["Distinguish the axial and appendicular skeletons and locate the bony landmarks used most often in coaching and assisted stretching.", "Classify joints by structure (fibrous, cartilaginous, synovial) and name the six synovial types with a living example of each.", "Name the key muscles of the hip, knee and ankle, and give origin, insertion and primary actions for the muscles listed in this module’s tables.", "Explain which muscles are biarticular (rectus femoris, hamstrings except the short head of biceps femoris, gastrocnemius, sartorius, gracilis, TFL via the IT tract) and what that means for cueing a squat versus a hinge.", "Describe the screw-home mechanism of the knee and the role of popliteus in unlocking it.", "Break down a squat, a hip hinge and a lunge muscle by muscle, including the contraction type in each phase and the frontal-plane control required.", "Describe the four articulations of the shoulder complex (sternoclavicular, acromioclavicular, glenohumeral, scapulothoracic) and the classical scapulohumeral rhythm as a useful average, not a rigid law.", "Give origin, insertion and primary actions for the rotator cuff, deltoid, pectoralis major, latissimus dorsi, trapezius (three parts), serratus anterior, rhomboids, biceps, brachialis and triceps.", "Break down a horizontal push, a vertical push, a horizontal pull and a vertical pull muscle by muscle."], "intro": "Bones give trainers their map. Joints tell them what motion is available. Posture is a starting observation, not a moral judgement and not a diagnosis. This is the densest muscle module. You do not need every fibre attachment in Gray’s, but learn the origins, insertions and actions below: they are the ones that change how you cue.", "lessons": [{"title": "The skeleton", "blocks": [{"t": "p", "x": "The adult skeleton has 206 bones in the typical count. It is divided into the axial skeleton (skull, auditory ossicles, hyoid, vertebral column, ribs and sternum) and the appendicular skeleton (pectoral girdle, upper limbs, pelvic girdle and lower limbs). The pectoral girdle is the clavicle and scapula on each side; the pelvic girdle is the two hip bones (each formed from ilium, ischium and pubis, fused at the acetabulum) joining the sacrum at the sacroiliac joints to form the pelvis."}, {"t": "p", "x": "Bone shapes predict role:"}, {"t": "ul", "items": ["Long bones: Femur, tibia, humerus, radius, ulna, metacarpals, metatarsals, phalanges. A shaft (diaphysis) with a medullary cavity and two expanded ends (epiphyses).", "Short bones: Carpals and most tarsals. Cube-like, designed for transfer of force and small gliding motions.", "Flat bones: Sternum, ribs, many skull bones, scapula (often classed here). Protect and provide broad muscle attachment.", "Irregular bones: Vertebrae, sacrum, hyoid, many facial bones.", "Sesamoid bones: Patella (the largest), and the small sesamoids at the first metatarsal head. They are embedded in a tendon and change its line of pull."]}, {"t": "p", "x": "Landmarks you will use repeatedly: external occipital protuberance; C7 spinous process (usually the most prominent at the base of the neck); T3 (roughly level with the spine of the scapula) and T7 (roughly level with the inferior angle); iliac crest, ASIS, PSIS, ischial tuberosity, greater trochanter; lateral and medial femoral epicondyles; tibial tuberosity, fibular head, medial and lateral malleoli; sternum (manubrium, body, xiphoid), acromion, coracoid process, spine of the scapula, medial border of the scapula, greater and lesser tubercles of the humerus, olecranon, radial head and styloid processes of radius and ulna."}]}, {"title": "Joint types", "blocks": [{"t": "p", "x": "Structurally, joints are fibrous (bones joined by dense connective tissue — skull sutures, the interosseous membranes, the distal tibiofibular syndesmosis), cartilaginous (joined by cartilage — the pubic symphysis and intervertebral symphyses are secondary cartilaginous / symphyses; the first sternocostal joint and the epiphyseal plate in a growing bone are primary cartilaginous / synchondroses) or synovial. Functionally, joints are synarthroses (negligible movement), amphiarthroses (slight movement) or diarthroses (freely movable). Almost every synovial joint is a diarthrosis."}, {"t": "p", "x": "A typical synovial joint has: a joint cavity; hyaline articular cartilage on the bone ends; a fibrous capsule lined by synovial membrane; and synovial fluid. Some also have an articular disc or meniscus, a labrum, bursae or intracapsular ligaments (the cruciate ligaments of the knee are the example trainers will meet most often in conversation)."}, {"t": "svg", "name": "joints", "cap": "A synovial joint: bone ends covered in articular cartilage, enclosed by a capsule lined with synovial membrane and filled with synovial fluid."}, {"t": "cards", "hdr": ["Synovial type", "Degrees of freedom (teaching model)", "Living example", "Coaching note"], "rows": [["Hinge (ginglymus)", "One: flexion and extension", "Humeroulnar joint; talocrural (ankle) joint; interphalangeal joints", "The knee is a modified hinge: it flexes and extends, and it also rotates (see the screw-home mechanism later in this module)."], ["Pivot (trochoid)", "One: rotation around a long axis", "Proximal radioulnar joint (pronation/supination); atlanto-axial joint (C1–C2 rotation)", "Roughly half of all neck rotation happens at C1–C2; looking over the shoulder should come from the neck and thorax, not from twisting the lumbar spine."], ["Ball-and-socket (spheroid)", "Three: flex/extend, abduct/adduct, rotate", "Glenohumeral joint; femoroacetabular (hip) joint", "The hip trades some motion for bony stability; the shoulder does the opposite and leans on the rotator cuff and scapular control."], ["Condyloid / ellipsoid", "Two: flex/extend and abduct/adduct (circumduction possible; independent rotation limited)", "Radiocarpal (wrist) joint; metacarpophalangeal joints of fingers 2–5; atlanto-occipital joint", "Wrist position on the reformer box or during chaturanga changes how load reaches the elbow and shoulder."], ["Saddle (sellar)", "Two, with a unique opposed-convex/concave pairing", "First carpometacarpal joint (thumb); some texts also treat the sternoclavicular joint as a saddle", "Thumb saddle mobility is what makes a quality grip possible on a kettlebell or farmer’s-carry handle."], ["Plane / gliding", "Small translations and glides (sometimes described as non-axial)", "Intercarpal and intertarsal joints; acromioclavicular joint; zygapophyseal (facet) joints of the spine; patellofemoral joint (gliding)", "Facet joints help guide spinal motion: their orientation is one reason the lumbar spine prefers flexion/extension and the thoracic spine accepts more rotation."]]}]}, {"title": "The hip — a ball-and-socket joint with a deep socket", "blocks": [{"t": "p", "x": "The femoroacetabular joint is a ball-and-socket synovial joint. The acetabulum is deepened by the acetabular labrum. Compared with the glenohumeral joint it has more bony congruency and a stronger capsule and ligament complex (iliofemoral, pubofemoral and ischiofemoral ligaments). Available motions are flexion, extension, abduction, adduction, internal rotation and external rotation. Many clients have less extension and rotation than a textbook hip; that is a reason to explore range kindly, not to force a deeper lunge."}]}, {"title": "Key hip muscles: origin, insertion, action", "blocks": [{"t": "cards", "hdr": ["Muscle", "Origin", "Insertion", "Primary actions"], "rows": [["Psoas major", "Vertebral bodies and intervertebral discs of T12–L5, and the transverse processes of L1–L5", "Lesser trochanter of the femur (iliopsoas tendon)", "Hip flexion; contributes to external rotation of the hip and to lumbar stabilisation / lateral flexion of the lumbar spine"], ["Iliacus", "Iliac fossa and ala of the sacrum", "Lesser trochanter via the iliopsoas tendon", "Hip flexion"], ["Gluteus maximus", "Posterior ilium behind the posterior gluteal line, dorsal sacrum and coccyx, and the sacrotuberous ligament", "Iliotibial tract and the gluteal tuberosity of the femur", "Hip extension and external rotation; upper fibres abduct, lower fibres adduct; posteriorly tilts the pelvis"], ["Gluteus medius", "External surface of the ilium between the anterior and posterior gluteal lines", "Lateral surface of the greater trochanter", "Hip abduction. Anterior fibres flex and internally rotate; posterior fibres extend and externally rotate. Essential for pelvic control in single-leg stance (it prevents the opposite pelvis from dropping)"], ["Gluteus minimus", "External ilium between the anterior and inferior gluteal lines", "Anterior surface of the greater trochanter", "Hip abduction and internal rotation"], ["Tensor fasciae latae", "ASIS and the anterior part of the iliac crest", "Iliotibial tract, which attaches to Gerdy’s tubercle on the anterolateral tibia", "Hip flexion, abduction and internal rotation; tenses the IT tract"], ["Piriformis", "Anterior (pelvic) surface of the sacrum", "Superior aspect of the greater trochanter", "External rotation of the extended hip; abduction of the flexed hip. The sciatic nerve usually exits below it (anatomical variants exist)"], ["Deep external rotators (as a group)", "Obturator internus, gemellus superior and inferior, quadratus femoris, obturator externus — from the ischium, obturator membrane or ischial tuberosity region", "Medial greater trochanter or the quadrate tubercle (quadratus femoris)", "External rotation of the hip; they also contribute to joint congruency, similar in spirit to a ‘rotator cuff of the hip’"], ["Adductor longus", "Anterior body of the pubis, below the pubic crest", "Middle third of the linea aspera", "Hip adduction; assists hip flexion"], ["Adductor magnus", "Adductor part: inferior pubic ramus and ischial ramus. Hamstring part: ischial tuberosity", "Adductor part: linea aspera and medial supracondylar line. Hamstring part: adductor tubercle of the femur", "Hip adduction. The adductor part assists flexion; the hamstring part extends the hip. A uniquely dual muscle"], ["Gracilis", "Body and inferior ramus of the pubis", "Pes anserinus on the medial proximal tibia", "Hip adduction; knee flexion; internal rotation of the tibia"], ["Pectineus", "Superior ramus of the pubis (pecten pubis)", "Pectineal line of the femur", "Hip flexion and adduction"], ["Sartorius", "ASIS", "Pes anserinus", "Hip flexion, abduction and external rotation, plus knee flexion and tibial internal rotation — the ‘tailor’ position"], ["Rectus femoris", "Straight head: AIIS. Reflected head: groove immediately above the acetabulum", "Tibial tuberosity via the quadriceps (patellar) tendon", "Hip flexion and knee extension — the only biarticular quadriceps muscle"]]}, {"t": "p", "x": "Adductor brevis and the individual deep external rotators follow the same logic as their neighbours; recognise the names and the action group even if you cannot recite every attachment. Piriformis is named because it is a useful landmark for the sciatic nerve and a frequent target in assisted stretching and hip rotation work — not because every posterior hip pain is ‘piriformis syndrome’."}]}, {"title": "The knee — a modified hinge", "blocks": [{"t": "p", "x": "The tibiofemoral joint is a modified hinge. It flexes and extends, and it rotates when it is flexed. The patellofemoral joint is a gliding articulation between the patella (a sesamoid in the quadriceps tendon) and the femoral trochlea. Stability comes from the joint geometry, the menisci, the collateral ligaments (MCL, LCL), the cruciate ligaments (ACL, PCL) and the surrounding musculature. Trainers do not diagnose ligament injury; they do need to know that a sudden giving-way event with swelling after a twist is a reason to stop and refer."}, {"t": "p", "x": "Screw-home mechanism. In an open chain (for example a seated knee extension), the tibia externally rotates on the femur in terminal extension to ‘lock’ the knee. In a closed chain (standing up from a squat), the femur internally rotates on the tibia to achieve the same lock. Popliteus, a small muscle from the lateral femoral condyle to the posterior tibia, unlocks the knee by internally rotating the tibia on the femur (open chain) or by externally rotating the femur on the tibia (closed chain) at the start of flexion."}, {"t": "cards", "hdr": ["Muscle", "Origin", "Insertion", "Primary actions"], "rows": [["Vastus lateralis", "Greater trochanter, intertrochanteric line, gluteal tuberosity and the lateral lip of the linea aspera", "Tibial tuberosity via the patellar tendon (and the lateral patella / retinaculum)", "Knee extension"], ["Vastus medialis", "Intertrochanteric line, spiral line, medial lip of the linea aspera and the medial supracondylar line", "Tibial tuberosity via the patellar tendon (and the medial patella / retinaculum)", "Knee extension. It contributes to medial patellar control; do not teach ‘VMO isolation’ as a separate exercise science"], ["Vastus intermedius", "Anterior and lateral shaft of the femur", "Tibial tuberosity via the patellar tendon", "Knee extension"], ["Rectus femoris", "See hip table (AIIS and acetabular rim)", "Tibial tuberosity via the patellar tendon", "Knee extension and hip flexion"], ["Biceps femoris, long head", "Ischial tuberosity (common tendon with semitendinosus)", "Head of the fibula", "Hip extension, knee flexion and tibial external rotation"], ["Biceps femoris, short head", "Lateral lip of the linea aspera and the lateral supracondylar line of the femur", "Head of the fibula", "Knee flexion and tibial external rotation. It does not cross the hip"], ["Semitendinosus", "Ischial tuberosity", "Pes anserinus (medial proximal tibia)", "Hip extension, knee flexion and tibial internal rotation"], ["Semimembranosus", "Ischial tuberosity", "Posterior aspect of the medial tibial condyle", "Hip extension, knee flexion and tibial internal rotation"], ["Gastrocnemius (crosses the knee)", "Posterior surfaces of the medial and lateral femoral condyles", "Calcaneus via the calcaneal (Achilles) tendon", "Knee flexion and ankle plantarflexion"], ["Popliteus", "Lateral femoral condyle and the posterior horn of the lateral meniscus (variable)", "Posterior tibia, above the soleal line", "Unlocks the extended knee; internally rotates the tibia on the femur in an open chain"]]}, {"t": "p", "x": "Pes anserinus (‘goose’s foot’) is the shared insertion of sartorius, gracilis and semitendinosus on the medial proximal tibia. A useful memory aid is ‘say grace before tea’ (sartorius, gracilis, semiTendinosus). These tendons help support the medial knee, and the area (including the pes anserine bursa) can become irritated, for example after a sudden increase in running or stair-climbing volume."}]}, {"title": "The ankle and foot — enough anatomy to coach well", "blocks": [{"t": "p", "x": "The talocrural (ankle) joint is a hinge between the tibia, the fibula and the trochlea of the talus. Its primary actions are dorsiflexion and plantarflexion. Inversion and eversion occur mainly at the subtalar (talocalcaneal) joint and the transverse tarsal joints. The medial longitudinal arch is supported passively by bone shape, plantar ligaments and plantar fascia, and dynamically by tibialis posterior, the plantar intrinsics and other invertors and digital flexors."}, {"t": "cards", "hdr": ["Muscle", "Origin", "Insertion", "Primary actions"], "rows": [["Gastrocnemius", "Medial and lateral femoral condyles (posterior)", "Calcaneus via the Achilles tendon", "Plantarflexion and knee flexion. It is more active when the knee is extended"], ["Soleus", "Posterior fibular head and shaft; soleal line and medial border of the tibia", "Calcaneus via the Achilles tendon", "Plantarflexion, including when the knee is flexed (the reason a bent-knee calf raise targets soleus more than gastrocnemius)"], ["Tibialis anterior", "Lateral tibial condyle and the upper lateral tibia; interosseous membrane", "Medial cuneiform and the base of the first metatarsal", "Dorsiflexion and inversion"], ["Tibialis posterior", "Posterior tibia, fibula and interosseous membrane", "Navicular tuberosity, cuneiforms, cuboid and bases of metatarsals 2–4", "Plantarflexion and inversion; a key dynamic support of the medial longitudinal arch"], ["Fibularis (peroneus) longus", "Head and proximal lateral fibula", "Plantar base of the first metatarsal and the medial cuneiform", "Eversion and plantarflexion; supports the transverse arch (it slings under the foot)"], ["Fibularis brevis", "Distal two-thirds of the lateral fibula", "Tuberosity of the fifth metatarsal", "Eversion and plantarflexion"]]}, {"t": "p", "x": "Also name, without requiring full attachments today: extensor hallucis longus and extensor digitorum longus (dorsiflexion and toe extension; EHL also inverts slightly); flexor hallucis longus and flexor digitorum longus (plantarflexion and toe flexion; they support the medial arch); fibularis tertius (everts and dorsiflexes, inserting near the base of the fifth metatarsal). The two heads of gastrocnemius plus soleus are the triceps surae and share the Achilles tendon."}]}, {"title": "Squat, hinge and lunge — muscle by muscle", "blocks": [{"t": "h", "x": "The squat"}, {"t": "p", "x": "A bodyweight or loaded squat is a coordinated flexion then extension of the hips, knees and ankles (dorsiflexion on the way down, then a return towards neutral on the way up), with the spine held in a relatively constant, braced orientation. Exact joint contribution varies with stance, load position (goblet, front, back) and available ankle dorsiflexion."}, {"t": "ul", "items": ["Descent: Hips flex, knees flex, ankles dorsiflex. The pelvis should not dump into an uncontrolled anterior tilt or into lumbar flexion (‘butt wink’ at depth is often a mobility or strategy issue — reduce depth, improve hip and ankle options, and coach the brace before you load it).", "Eccentric muscles: Quadriceps (controlling knee flexion), gluteus maximus and the adductor magnus hamstring part (controlling hip flexion), and the soleus (controlling ankle dorsiflexion, because the knee is bending). The hamstrings lengthen at the hip and shorten at the knee, so their net length change is modest — they are not the star of a squat descent.", "Isometric / control muscles: Spinal extensors and the deep core canister work largely isometrically to keep the trunk from collapsing. Gluteus medius and the other hip abductors work to prevent femoral adduction and internal rotation (the valgus leak).", "Ascent: Hips and knees extend, ankles return from dorsiflexion. Prime movers are the gluteus maximus, quadriceps and adductor magnus, with hamstring assistance at the hip and calf assistance at the ankle. This is concentric work for those prime movers."]}, {"t": "h", "x": "The hinge (Romanian deadlift / kettlebell deadlift pattern)"}, {"t": "p", "x": "A hinge is hip-dominant. The hips flex and then extend through a large range while the knees soften but do not travel the way they do in a squat, and the spine stays in a braced, relatively unchanged alignment. The bar or bell travels close to the legs."}, {"t": "ul", "items": ["Descent (eccentric posterior chain): Gluteus maximus, hamstrings (especially the three that cross the hip) and the hamstring part of adductor magnus lengthen under load as the pelvis rotates forward over the femurs. The spinal extensors are isometric. If the lumbar spine flexes under load, the client has lost the hinge and found a spinal flexion strategy — reduce range, raise the implement, or coach the hip back more clearly.", "Ascent (concentric): The same muscles shorten and extend the hip. Cue ‘push the floor away and stand the pelvis up’ rather than ‘pull with the back’.", "Why it feels like a hamstring exercise: Because they lengthen over the hip and are not simultaneously shortened by deep knee flexion, the hamstrings are far more obviously loaded in a hinge than in a squat. That is the biomechanical reason an RDL makes the back of the thigh work in a way a squat does not."]}, {"t": "h", "x": "The lunge (and split squat)"}, {"t": "p", "x": "A forward or walking lunge is an asymmetrical squat pattern. The front limb accepts most of the vertical load through hip flexion, knee flexion and ankle dorsiflexion; the rear hip moves into extension (and the rear knee flexes). Frontal- and transverse-plane control of the front femur is the usual limiting skill."}, {"t": "ul", "items": ["Sagittal muscles: Quadriceps and gluteus maximus of the front limb work eccentrically on the way down and concentrically on the way up, just as in a split squat. The rear iliopsoas and rectus femoris are lengthened; if the rear hip cannot extend, the lumbar spine often extends instead (an anterior pelvic tilt / rib flare strategy).", "Frontal-plane muscles: Gluteus medius (and minimus) of the front hip must keep the pelvis from dropping and the knee from falling into valgus. This is why a ‘wobbly lunge’ is often a hip-control problem rather than a ‘weak knee’.", "Sandbag lunge: The same pattern under a sandbag, usually with more trunk lean and more fatigue. Coach the front hip and foot before you coach pace."]}, {"t": "callout", "title": "Think it through", "x": "Ask yourself: ‘A client’s heels rise early in the squat. Which joint action is missing, and which muscle tightness or which joint limitation might be involved?’ Answer: limited ankle dorsiflexion, in which soleus (and sometimes joint restriction) is a common contributor; a temporary heel wedge is a valid coaching experiment, not a moral failure. Next, name the concentric prime movers of an RDL. (Answer: glut
